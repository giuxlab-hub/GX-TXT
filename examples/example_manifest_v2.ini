[pipeline]
format=2
application_version=0.7.4
module_api_version=1
instrument_api_version=1

[runtime]
octave_cmd=/usr/bin/octave-cli
cpu_count=16

[acquisition]
module_id=acq.generic_csv
input_csv=/data/VG_X.csv
session_root=/data/GXTXT_sessions
session_name=6BX7_GE_fit

[session]
mode=analysis_only

[experiment]
name=6BX7 characteristic extraction
project=Vacuum tube SPICE models
date=2026-09-10
operator=
tags=6BX7;triode;SPICE
notes=General notes may contain escaped newlines.\nSecond line.
objective=Fit a reusable triode model to a family of characteristic curves.
procedure=Import the digitized CSV and fit all curves globally.
observations=

[instrument_modules]
api_version=1
count=0

[source_variables]
count=3

[source_variable.1]
enabled=1
source_column=1
source_channel=
original_header=X_V
canonical=X_V
unit=V
semantic_role=independent
instrument_id=
instrument_channel=

[source_variable.2]
enabled=1
source_column=2
source_channel=
original_header=Vg_V
canonical=Vg_V
unit=V
semantic_role=family
instrument_id=
instrument_channel=

[source_variable.3]
enabled=1
source_column=3
source_channel=
original_header=Y_mA
canonical=Y_mA
unit=mA
semantic_role=measured
instrument_id=
instrument_channel=

[module_state]
enabled=curvefit.family_global
run=curvefit.family_global

[module_config.acq.generic_csv]
dataset_id=curve_family.primary
dataset_kind=curve_family.table
delimiter=auto
header_rows=1

[module_config.acq.rigol_csv]
parser=rigol_ds1000z
delimiter=comma
header_rows=2
sequence_col=1
time_col=1
tstart=
dt=
make_rigol_split=1
make_canonical_split=1
chunk_rows=250000
raw_fields=0
drop_trailing_fields=0
strict_sequence=1

[module_config.curvefit.family_global]
dataset_id=curve_family.primary
model_id=triode.koren_v1
solver=auto
max_iter=2000
tolerance=1e-8

[module_binding.curvefit.family_global]
x=auto
family=auto
y=auto

[module_plot.curvefit.family_global.curvefit.family.overlay]
title=6BX7-GT characteristic curves
x_label=Anode voltage [V]
y_label=Anode current [mA]
show_measured=1
show_fitted=1
marker_size=4
line_width=1.6
legend_mode=family_only
x_min=
x_max=
y_min=0
y_max=


[module_plot.curvefit.family_global.curvefit.family.residuals]
title=Curve Family Fitting - residuals
x_label=auto
y_label=Residual
show_zero_line=1
marker_size=4
x_min=
x_max=
y_min=
y_max=

[graph_provider_api]
version=1
model=module-declared graph offerings; one configured instance per graph ID

[module_graphs.curvefit.family_global]
offered=curvefit.family.overlay,curvefit.family.residuals
enabled=curvefit.family.overlay,curvefit.family.residuals

[plot.legend.overrides]
keys=curvefit.family.overlay

[plot.legend.curvefit.family.overlay]
enabled=1
placement=inside
layout=stacked
alignment=center
location=northeast
columns=1
mode=inside
orientation=vertical
background=#FFFFFF
border=1
border_color=#808080
font_unit=inherit
font_size=10
external_margin_px=12
manual_x=0.75
manual_y=0.85

[graphics]
graphics_mode=headless
graphics_toolkit=gnuplot
graphics_display=
graphics_visible=0
plot_width_px=1600
plot_height_px=900
plot_font_unit=px
plot_font_size=12
plot_axis_label_font_size=
plot_title_font_size=
plot_line_width=1.4
plot_grid=1
plot_grid_mode=both
plot_grid_color=
plot_background=#FFFFFF
plot_legend_mode=inside
plot_legend_location=northeast
plot_legend_layout=auto
plot_legend_alignment=center
plot_legend_columns=1
plot_legend_font_unit=inherit
plot_legend_font_size=10
plot_legend_background=#FFFFFF
plot_legend_border=1
plot_legend_external_border=0
plot_legend_border_color=#808080
plot_legend_external_margin_px=12
plot_legend_manual_x=0.75
plot_legend_manual_y=0.85
analysis_png_dpi=200

[module_graphics_api]
version=1

[module_graphics.curvefit.family_global]
enabled=0
width_px=
height_px=
dpi=
font_unit=inherit
font_size=
axis_label_font_size=
title_font_size=
line_width=
grid_mode=inherit
grid_color=
background=
legend_placement=inherit
legend_inside_preset=inherit
legend_layout=inherit
legend_alignment=inherit
legend_columns=
legend_font_unit=inherit
legend_font_size=
legend_background=
legend_border=inherit
legend_border_color=
legend_margin_px=

[print]
print_page=A4
print_orientation=landscape
print_rows=2
print_cols=1
print_margin_mm=12
print_gap_mm=8
print_captions=1
print_title=
print_output_pdf=
print_printer=
print_copies=1
print_duplex=auto
export_dir=
