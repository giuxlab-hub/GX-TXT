[meta]
api_version=1
id=response.logistic_v1
kind=scalar_expression
name=Logistic response (amplitude, center, rate)
version=1.0.0
description=Continuous sigmoid response, not binary logistic regression. The value at center is amplitude/2 above the separately declared baseline.

[parameters]
names=amplitude;center;rate
initial=1;0;1

[fitting]
api_version=1
expression=amplitude*logistic(rate*(x-center))
predictor=x
method_class=regression
parameter_units=Y;X;1/X
parameter_meanings=Signed response step;Half-step predictor coordinate;Signed inverse predictor scale controlling sigmoid direction
parameter_domains=real;real;real
input_domain=finite_real
initialization=Review the response step, midpoint and signed rate in source units. A zero rate removes center sensitivity and cannot identify all parameters.
derivatives=Stable sign-dependent logistic evaluation and native automatic differentiation through the shared controlled expression VM.
uncertainty=Continuous-response noise assumptions and CORE rank, convergence and constraint checks apply. This does not declare Bernoulli likelihood or odds ratios.
extrapolation=Asymptotic plateaus are properties of this response law; data covering only one plateau do not identify the transition. Add a separate baseline explicitly.

[documentation]
api_version=1
guide=README.md
api_refs=NUMERIC_API_v1;STATISTICAL_RESULT_SEMANTICS_API_v1
