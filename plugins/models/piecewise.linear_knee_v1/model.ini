[meta]
api_version=1
id=piecewise.linear_knee_v1
kind=scalar_expression
name=Continuous linear knee
version=1.0.0
description=Two straight regimes joined at one fitted physical breakpoint and response level. All free parameters are estimated in one joint solve.

[parameters]
names=breakpoint;level;left_slope;right_slope
initial=0;0;1;2

[fitting]
api_version=1
expression=level+left_slope*minimum(x-breakpoint,0)+right_slope*positive_part(x-breakpoint)
predictor=x
method_class=regression
parameter_units=X;Y;Y/X;Y/X
parameter_meanings=Physical predictor value of the junction;Physical response at the junction;Slope below the breakpoint;Slope at and above the breakpoint
parameter_domains=real;real;real;real
input_domain=finite_real
translation_policy=forbid_translation
initialization=Choose a breakpoint inside the observed span with data on both sides, review finite search bounds and both slopes. Different starts may find different local minima. Descriptor defaults are dimensional placeholders.
derivatives=Native automatic differentiation; positive_part uses the right derivative at zero and minimum chooses its second operand at equality. The model is C0 and has a slope discontinuity unless its slopes agree.
uncertainty=Full joint local covariance includes the breakpoint and its correlations. A weak or absent kink, a breakpoint at a bound or outside observed support, or rank deficiency cannot support a precise breakpoint claim. Local intervals are not profile intervals or a model-selection test.
extrapolation=Each outer line continues beyond the observed span. This is model extrapolation, not an observed physical regime. Coordinate translations are forbidden so breakpoint and level retain physical identities.

[documentation]
api_version=1
guide=README.md
api_refs=NUMERIC_API_v1;STATISTICAL_RESULT_SEMANTICS_API_v1
