[meta]
api_version=1
id=decay.exponential_v1
kind=scalar_expression
name=Exponential decay (amplitude, lifetime)
version=1.0.0
description=One decay component with positive lifetime. Sum multiple independently named components for a multi-exponential model and add a separate baseline if required.

[parameters]
names=amplitude;tau
initial=1;1

[fitting]
api_version=1
expression=amplitude*exp(-x/tau)
predictor=x
method_class=regression
parameter_units=Y;X
parameter_meanings=Signed amplitude at predictor zero;Strictly positive decay lifetime in predictor units
parameter_domains=real;positive
input_domain=finite_real
initialization=Supply distinct positive lifetimes and reviewed amplitudes for multiple decays. Equal lifetimes can make their separate amplitudes unidentifiable. Use bounds to define a reviewed lifetime ordering if needed.
derivatives=Native automatic differentiation through the shared controlled expression VM and Ceres fitter.
uncertainty=Local intervals require CORE eligibility. Multi-exponential fits can have permutation ambiguity and strong amplitude/lifetime correlation; a converged fit does not prove a unique decomposition.
extrapolation=Negative coordinates extrapolate growth; they are not rejected mathematically. The amplitude is referenced to the explicit predictor origin and any recorded translation.

[documentation]
api_version=1
guide=README.md
api_refs=NUMERIC_API_v1;STATISTICAL_RESULT_SEMANTICS_API_v1
