[meta]
api_version=1
id=peak.lorentzian_height_v1
kind=scalar_expression
name=Lorentzian peak (height, HWHM)
version=1.0.0
description=Peak height is not integrated area. FWHM = 2*hwhm and integrated area = pi*height*hwhm.

[parameters]
names=height;center;hwhm
initial=1;0;1

[fitting]
api_version=1
expression=height/(1+((x-center)/hwhm)^2)
predictor=x
method_class=regression
parameter_units=Y;X;X
parameter_meanings=Peak height above the separate baseline;Peak center;Positive half width at half maximum
parameter_domains=real;real;positive
input_domain=finite_real
initialization=Explicit user-reviewed parameter values; descriptor values are dimensional placeholders, not estimated from data.
derivatives=Native automatic differentiation through the CORE controlled expression grammar.
uncertainty=Local covariance and pointwise propagation subject to CORE rank, convergence, constraints and noise eligibility.
extrapolation=Formula evaluation is permitted on finite real inputs, with model extrapolation kept distinct from validated data support.

[documentation]
api_version=1
guide=README.md
api_refs=NUMERIC_API_v1;STATISTICAL_RESULT_SEMANTICS_API_v1
