[meta]
api_version=1
id=region.quadratic_increment_v1
kind=regional_increment
name=Quadratic regional increment
version=1.0.0
description=An increment from a regional start, composed with other regions into one joint continuous physical model.

[regional_fit]
api_version=1
increment=slope*t+quadratic*t^2
derivative=slope+2*quadratic*t
parameter_ids=slope;quadratic
parameter_units=Y/X;Y/X^2
parameter_meanings=Starting derivative of the response with respect to the physical predictor;Coefficient of the squared regional span
parameter_domains=real;real
initial_parameters=1;0.1
initialization=Set dimensional initial slopes and shape coefficients from the observed regimes; set separate finite breakpoint search bounds. Defaults are placeholders. Use reviewed multistart when multiple minima are plausible.
uncertainty=The joint fit includes correlations with other regions and free breakpoints. C1 eliminates this region's independent starting slope. Weak changes, unsupported regions, active bounds and rank deficiency restrict local covariance; it is not a profile interval or a model-selection test.
extrapolation=The first and last increments continue outside observed support; gaps are model predictions. Exponential and polynomial continuations can grow rapidly. Coordinate translation is forbidden.

[documentation]
api_version=1
guide=README.md
api_refs=NUMERIC_API_v1;STATISTICAL_RESULT_SEMANTICS_API_v1

