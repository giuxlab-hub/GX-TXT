[meta]
api_version=1
id=kinetics.arrhenius_temperature_v1
kind=scalar_expression
name=Arrhenius law (prefactor, activation temperature)
version=1.0.0
description=Absolute-temperature law A*exp(-B/T), with B=Ea/R in kelvin. B is activation temperature, not activation energy; no implicit gas-constant or energy-unit conversion is performed.

[parameters]
names=prefactor;activation_temperature
initial=1;2000

[fitting]
api_version=1
expression=prefactor*exp(-activation_temperature/x)
predictor=x
method_class=regression
parameter_units=Y;X
parameter_meanings=Strictly positive pre-exponential factor in response units;Signed activation temperature Ea/R in kelvin
parameter_domains=positive;real
input_domain=positive_real
required_x_unit=K
translation_policy=forbid_translation
initialization=Use strictly positive absolute temperatures in K and reviewed prefactor/activation-temperature values. Convert Celsius data explicitly before binding. Negative apparent activation temperature is permitted and must be scientifically justified.
derivatives=Native automatic differentiation; positive predictor domain also applies to ODR-adjusted coordinates. No logarithmic response transform is applied.
uncertainty=Fit residuals and sigma in the original response units. CORE local inference eligibility applies; temperature-error ODR uses separately declared absolute axis uncertainties.
extrapolation=Only strictly positive absolute temperatures are valid. No coordinate translation is allowed. Extrapolation assumes the same activated process and constant parameters.

[documentation]
api_version=1
guide=README.md
api_refs=NUMERIC_API_v1;STATISTICAL_RESULT_SEMANTICS_API_v1
