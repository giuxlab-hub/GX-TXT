[meta]
api_version=1
id=diode.shockley_series_v1
kind=scalar_expression
name=Shockley diode with series resistance
version=1.0.0
description=Implicit ideal diode I=Is*expm1((V-I*Rs)/Vt). Vt is effective thermal voltage n*k*T/q, not temperature or ideality factor separately. No breakdown, shunt or self-heating model is implied.

[parameters]
names=saturation_current;thermal_voltage;series_resistance
initial=1e-12;0.026;1

[fitting]
api_version=1
expression=shockley_series(x,saturation_current,thermal_voltage,series_resistance)
predictor=x
method_class=regression
parameter_units=Y;X;X/Y
parameter_meanings=Strictly positive saturation current in A;Strictly positive effective thermal voltage n*k*T/q in V;Nonnegative series resistance in V/A
parameter_domains=positive;positive;nonnegative
input_domain=finite_real
required_x_unit=V
required_y_unit=A
translation_policy=forbid_translation
initialization=Review saturation current, effective thermal voltage and resistance in SI units; use physical parameter scales and forward data covering the relevant regimes. Do not fit n and T independently through this descriptor.
derivatives=Stable monotone implicit evaluation with analytic derivatives from the diode equation, including the zero-series-resistance and near-zero-voltage limits; one shared Ceres optimizer.
uncertainty=CORE rank, constraints, noise and convergence eligibility apply. Parameters can be strongly correlated; Rs=0 is a boundary where ordinary unconstrained intervals are unavailable.
extrapolation=Ideal diode equation only; reverse breakdown, shunt leakage, temperature dependence and self-heating are outside this model. Absolute V/A axes and zero coordinate translations are required.

[documentation]
api_version=1
guide=README.md
api_refs=NUMERIC_API_v1;STATISTICAL_RESULT_SEMANTICS_API_v1
