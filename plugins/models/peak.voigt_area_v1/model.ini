[meta]
api_version=1
id=peak.voigt_area_v1
kind=scalar_expression
name=Voigt peak (area, Gaussian sigma, Lorentzian HWHM)
version=1.0.0
description=Convolution of normalized Gaussian and Lorentzian profiles. Area is integrated signal, not peak height. Gamma is Lorentzian HWHM, not FWHM.

[parameters]
names=area;center;sigma;gamma
initial=1;0;1;1

[fitting]
api_version=1
expression=area*voigt_profile(x-center,sigma,gamma)
predictor=x
method_class=regression
parameter_units=Y*X;X;X;X
parameter_meanings=Signed integrated peak area;Peak center;Strictly positive Gaussian standard width;Nonnegative Lorentzian half width at half maximum
parameter_domains=real;real;positive;nonnegative
input_domain=finite_real
initialization=Review area, center and both widths in source units. Positive sigma is required; gamma=0 gives the Gaussian limit. Use the separate Lorentzian card for sigma=0.
derivatives=Octave Faddeeva value with analytic physical derivatives; differentiated asymptotic tails avoid cancellation; shared Ceres differentiation handles composition.
uncertainty=Local covariance and pointwise propagation require CORE rank, convergence, constraints and noise eligibility. Widths may be strongly correlated. At gamma=0 ordinary unconstrained intervals are unavailable.
extrapolation=Finite-real profile evaluation is allowed; tail extrapolation is a model assumption, not measured support. Add a separate baseline explicitly.

[documentation]
api_version=1
guide=README.md
api_refs=NUMERIC_API_v1;STATISTICAL_RESULT_SEMANTICS_API_v1
