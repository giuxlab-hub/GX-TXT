[meta]
api_version=1
id=demo.numeric.minimization
kind=analysis
group=Generic analysis / Numerical examples
name=Numerical 1D Minimization Demo
version=1.0.2
selectable=1
default_enabled=0
core=0
enabled_key=
run_key=
runner=standard_octave
order=793
depends=math.numeric
description=External reference module demonstrating public Dataset interpolation composed with NUMERIC_API_v1 one-dimensional bounded minimization, Canonical Dataset publication and plot.dataset visualization.
config_hint=Use the 1D Minimization Session Generator, import raw/minimization_1d.csv as table.generic, bind X and f(X), choose bounds inside the selected Dataset range, then run.

[inputs]
contracts=table.generic

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=table.generic

[bindings]
roles=x;function

[binding.x]
label=Independent X variable
required=1
semantic_role=independent

[binding.function]
label=Function Y variable
required=1

[outputs]
files=minimization_metrics.ini;minimization_report.txt
datasets=table.generic

[runner]
script=plugins/modules/demo.numeric.minimization/runtime/demo_numeric_minimization.m

[config]
fields=selection;nonfinite_policy;interpolation_method;lower_bound;upper_bound;tolerance;max_iterations;output_dataset_id

[config.selection]
type=selection
label=Data selection (optional X interval)
required=0
source_role=primary
selection_types=x_range

[config.nonfinite_policy]
type=choice
label=NaN / Inf policy
default=error
values=error;omit
required=1

[config.interpolation_method]
type=choice
label=Public interpolation method
default=linear
values=linear;pchip;spline
required=1

[config.lower_bound]
type=double
label=Lower minimization bound
default=-3
required=1

[config.upper_bound]
type=double
label=Upper minimization bound
default=5
required=1

[config.tolerance]
type=double
label=Minimizer absolute X tolerance
default=1e-10
required=1

[config.max_iterations]
type=integer
label=Maximum minimizer iterations
default=400
required=1

[config.output_dataset_id]
type=string
label=Minimum result Dataset ID
default=demo.numeric.minimization.result
required=1

[documentation]
api_version=1
guide=MANUAL.md
api_refs=MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;DATASET_METADATA_API_v1;DATASET_SELECTION_API_v1;DATASET_VARIABLE_SCHEMA_API_v3;TABLE_STREAM_API_v3;DATASET_PUBLICATION_API_v2;NUMERIC_API_v1;PROGRESS_API_v1;PLOT_DATASET_API_v2;PLOT_DATASET_OCTAVE_BRIDGE_v1;PLUGIN_INSTALL_API_v1;SESSION_GENERATOR_LIBRARY_API_v1;UNIT_REGISTRY_API_v1;DOCUMENTATION_API_v1
examples=session_generators/gxtxt_numerical_examples_minimization_1d_1.0.0.zip
changelog=CHANGELOG.md
