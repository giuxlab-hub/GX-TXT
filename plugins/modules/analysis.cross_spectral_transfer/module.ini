[meta]
api_version=1
id=analysis.cross_spectral_transfer
kind=analysis
group=Generic analysis / Spectral
name=Cross-Spectral & Transfer Function Analysis
version=1.1.3
selectable=1
default_enabled=0
core=0
runner=standard_octave
order=310
depends=math.numeric
description=Dataset-native cross-spectral analysis for two synchronously sampled signals. A GX-TXT Temporal Window Set defines the averaging windows. The module publishes auto spectra, complex cross spectrum, H1/H2 transfer-function estimates and magnitude-squared coherence on one common frequency axis.
config_hint=QUICK GUIDE: bind one time variable plus Input X and Output Y from the same Dataset. Select an existing Temporal Window Set. Each window produces X/Y FFTs; the module averages Sxx, Syy and Sxy=conj(X)*Y, then derives H1=Sxy/Sxx, H2=Syy/conj(Sxy), gain, phase and coherence. H1 is normally preferred when output-side noise dominates; H2 is useful when input-side noise is more important. Plot variants can compare H1/H2, linear/dB views, phase wrapping and presentation settings without repeating the spectral calculation. See MANUAL.md.

[inputs]
contracts=timeseries.table;table.generic

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=timeseries.table;table.generic

[bindings]
roles=time;input_signal;output_signal

[binding.time]
label=Time / temporal variable
required=1
semantic_role=independent

[binding.input_signal]
label=Input signal X
required=1
semantic_role=measured

[binding.output_signal]
label=Output signal Y
required=1
semantic_role=measured

[outputs]
files=cross_spectral_report.txt;automatic_graphs.ini
datasets=spectrum.table

[render_cache]
api_version=1
rerender_from_cache=1

[config]
fields=run_mode;temporal_set;window;detrend;nfft_mode;nfft;workers

[config.run_mode]
type=choice
label=Run mode
default=auto
values=auto;recalculate;render_only
required=1

[config.temporal_set]
type=temporal_set
label=Temporal Window Set
required=1
source_role=primary
temporal_types=window_set

[config.window]
type=choice
label=FFT weighting window
default=hann
values=rectangular;hann;hamming;blackman;blackman_harris;flat_top
required=1

[config.detrend]
type=choice
label=Pre-FFT detrend / DC handling
default=mean
values=none;mean;linear
required=1

[config.nfft_mode]
type=choice
label=NFFT mode
default=auto
values=auto;explicit
required=1

[config.nfft]
type=integer
label=Explicit NFFT (used only when NFFT mode = explicit)
default=4096
required=1

[config.workers]
type=string
label=Parallel workers (auto, serial, or positive integer)
default=auto
required=1

[automatic_graphs]
provider=plot.dataset
api=PLOT_DATASET_API_v2
persistent_variants=1


[runner]
script=plugins/modules/analysis.cross_spectral_transfer/runtime/analysis_cross_spectral_transfer.m

[documentation]
api_version=1
guide=MANUAL.md
api_refs=MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;ANALYSIS_SOURCE_METADATA_RUNTIME_v1;CANONICAL_DATASET_API_v2;TABLE_STREAM_API_v3;DATASET_VARIABLE_SCHEMA_API_v3;TEMPORAL_SET_API_v1;DATASET_PUBLICATION_API_v2;DATASET_PUBLICATION_V2_OCTAVE_BINDING;PARALLEL_EXECUTION_API_v1;GRAPH_PROVIDER_API_v1;PLOT_DATASET_API_v2;NUMERIC_API_v1;PLUGIN_INSTALL_API_v1;PROGRESS_API_v1
author=GX-TXT
changelog=CHANGELOG.md
