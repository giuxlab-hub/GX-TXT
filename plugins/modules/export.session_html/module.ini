[meta]
api_version=1
id=export.session_html
kind=export
group=Session / Export
name=Session HTML Export
version=1.0.4
selectable=0
default_enabled=1
core=1
runner=service
order=900
description=Exports the current GX-TXT Session as a self-contained read-only offline HTML website for teaching, review and archival browsing.
config_hint=Use Session Tools -> Export Session to HTML... while a Session is open.

[inputs]
contracts=

[outputs]
files=index.html

[graphs]
ids=

[public_apis]
ids=SESSION_HTML_EXPORT_API_v1

[public_api.SESSION_HTML_EXPORT_API_v1]
public_contract=schema gxtxt.public_api_documentation.v1 purpose {Trusted host current Session offline read-only presentation export; chooses a new output directory/ZIP, preserves original scientific Session, creates files synchronously and does not rerun analysis. Failed partial output is not guaranteed removed.} context {Inert provider-owned trusted-host documentation only. No provider activation, scientific work, Script/SDK authorization or generic invocation is granted.} operations {export {command ::SessionHtmlExport::export arguments {destinationParent {makeZip 1}} parameters {destinationParent {type {filesystem parent directory} description {Trusted host output parent for a new Session-name-html directory and optional ZIP; existing targets reject.}} makeZip {type {Tcl boolean} description {Default1 also writes a ZIP;0 leaves an offline HTML directory only.}}} result {type {offline export result dictionary} description {directory/zip/file_count/dataset_count/graph_count as helper output strings; zip empty if disabled. Synchronous file writes, no scientific Session clone.}} context {trusted host service. Trusted host current Session offline read-only presentation export; chooses a new output directory/ZIP, preserves original scientific Session, creates files synchronously and does not rerun analysis. Failed partial output is not guaranteed removed.}}}
api_version=1
name=Session HTML Export API
entrypoint=api/session_html_export_api_v1.tcl
namespace=::SessionHtmlExport
capabilities=session_export;offline_html

[session_actions]
api_version=1
ids=export_html

[session_action.export_html]
name=Export Session to HTML...
public_api=SESSION_HTML_EXPORT_API_v1
command=::SessionHtmlExport::guiExport
requires_session=1
order=100

[documentation]
api_version=1
