[meta]
api_version=1
id=acq.pdf_document
kind=acquisition
group=Acquisition / Documents
name=PDF Document Import
version=1.0.1
selectable=0
default_enabled=1
core=1
enabled_key=
run_key=
runner=standard_tcl
order=155
depends=
description=Always-available PDF acquisition; imports a verified PDF as one opaque canonical document.pdf Dataset while preserving original bytes. Nonfatal PDF parser warnings are retained as inspection warnings; no OCR, extraction, rasterization, repair or optimization is performed by this module.
config_hint=Select one or more PDF documents. Each source becomes one independent document.pdf Dataset. Dataset IDs are editable in the standard source batch table; original filenames remain provenance metadata.

[inputs]
contracts=raw.pdf

[outputs]
datasets=document.pdf
files=datasets/*;metadata/datasets.ini;metadata/datasets/*

[contracts]
provided=document.pdf

[contract.document.pdf]
description=Verified preserved PDF document represented as a canonical opaque binary Dataset. Consumers may rely on valid preserved PDF bytes, stable Dataset identity, provenance/integrity, PDF format identity and page count; text layers, raster pages and optional document metadata are not implied.

[config]
fields=dataset_id

[config.dataset_id]
type=string
label=Default Dataset ID
default=document.pdf
required=1

[runner]
handler=pdf_document

[acquisition_handler]
api_version=1
script=runtime/acquisition_handler.tcl
inspect_proc=::AcqPdfDocument::inspect
import_proc=::AcqPdfDocument::import
dataset_preview_proc=::AcqPdfDocument::datasetPreview
file_label=PDF documents
file_patterns=*.pdf
supports_batch=1
source_kind=binary
variable_mapping=none
capabilities=batch;dataset_preview
formats=document.pdf

[acquisition_format.document.pdf]
description=Portable Document Format document validated from content and structure.
mime=application/pdf
extensions=*.pdf
canonical_formats=pdf

[documentation]
api_version=1
guide=MANUAL.md
api_refs=MODULE_API_v1;ACQUISITION_HANDLER_PLUGIN_API_v1;DATASET_API_v1;DATASET_METADATA_API_v1;BINARY_DATASET_FOUNDATION_v1;PREVIEW_DESCRIPTOR_API_v1;PLUGIN_INSTALL_API_v1;CONTRACT_REGISTRY_API_v1;DOCUMENTATION_API_v1
examples=
changelog=CHANGELOG.md
