[meta]
api_version=1
id=acq.image_binary
kind=acquisition
group=Acquisition / Images
name=Image importer
version=1.2.0
selectable=1
default_enabled=0
core=1
enabled_key=
run_key=
runner=standard_tcl
order=150
depends=
description=Imports PNG, JPEG, BMP and TIFF files as opaque binary canonical image.raster datasets and publishes structured image/container metadata through Dataset Metadata API v1. Recognition is content-based using format signatures; extension mismatches are warnings and raw bytes remain authoritative. Pixel arrays are not intentionally decoded by the importer.
config_hint=Select one or more supported image files. The importer verifies the file signature, stores a provenance-anchored binary image.raster dataset, reads available technical and embedded metadata from the exact RAW snapshot, and publishes it through Dataset Metadata API v1.

[inputs]
contracts=raw.image

[outputs]
datasets=image.raster
files=datasets/*;metadata/datasets.ini;metadata/datasets/*

[contracts]
provided=image.raster

[contract.image.raster]
description=Canonical opaque binary raster image dataset. Pixel decoding and image analysis are consumer responsibilities.

[config]
fields=dataset_id

[config.dataset_id]
type=string
label=Dataset ID
default=image.sample
required=1

[runner]
handler=image_binary

[acquisition_handler]
api_version=1
script=runtime/acquisition_handler.tcl
inspect_proc=::AcqImageBinary::inspect
import_proc=::AcqImageBinary::import
file_label=Image files
file_patterns=*.png;*.jpg;*.jpeg;*.bmp;*.tiff;*.tif
supports_batch=1
source_kind=binary
variable_mapping=none

[documentation]
api_version=1
guide=README.md
api_refs=MODULE_API_v1;ACQUISITION_HANDLER_PLUGIN_API_v1;DATASET_API_v1;DATASET_METADATA_API_v1;BINARY_DATASET_FOUNDATION_v1;PREVIEW_DESCRIPTOR_API_v1;PLUGIN_INSTALL_API_v1;DOCUMENTATION_API_v1
changelog=CHANGELOG.md
