[meta]
api_version=1
id=demo.numeric.interpolation
kind=analysis
group=Generic analysis / Numerical examples
name=Numerical Interpolation Demo
version=1.0.4
selectable=1
default_enabled=0
core=0
enabled_key=
run_key=
runner=standard_octave
order=785
depends=math.numeric
description=External reference module demonstrating Dataset-native interpolation and resampling through math.numeric NUMERIC_API_v1, canonical derived Dataset publication, deterministic reference validation, automatic GX-TXT graphs and plot.dataset compatibility.
config_hint=Use the canonical GX-TXT Numerical Examples / Mathematics / Interpolation Session. Import raw/interpolation.csv as a table.generic Dataset, bind the independent x variable and sampled y variable, then run the module. The default 201-point grid is deterministic.

[inputs]
contracts=table.generic

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=table.generic

[bindings]
roles=x;y

[binding.x]
label=Independent X variable
required=1
semantic_role=independent

[binding.y]
label=Sampled Y variable
required=1
semantic_role=measured

[outputs]
files=interpolation_metrics.ini;interpolation_report.txt;render_cache.mat
datasets=table.generic

[graphs]
provider_api_version=1
ids=demo.numeric.interpolation.curves;demo.numeric.interpolation.errors
default_ids=demo.numeric.interpolation.curves;demo.numeric.interpolation.errors
rerender=standard_octave

[graph.demo.numeric.interpolation.curves]
name=Interpolation curves
default_enabled=1
file=01_interpolation_curves.png
supports_legend=1
legend_editor=standard
legend_placements=inside;above;below;left;right;manual
legend_layouts=row;stacked;wrapped
config_fields=title;x_label;y_label;line_width;source_marker_size

[graph.demo.numeric.interpolation.curves.config.title]
type=string
label=Plot title
default=Interpolation demo - samples, reference and interpolants

[graph.demo.numeric.interpolation.curves.config.x_label]
type=string
label=X-axis label (auto = source variable and unit)
default=auto

[graph.demo.numeric.interpolation.curves.config.y_label]
type=string
label=Y-axis label (auto = source variable and unit)
default=auto

[graph.demo.numeric.interpolation.curves.config.line_width]
type=double
label=Curve line width
default=1.5

[graph.demo.numeric.interpolation.curves.config.source_marker_size]
type=double
label=Source sample marker size
default=6

[graph.demo.numeric.interpolation.errors]
name=Interpolation errors
default_enabled=1
file=02_interpolation_errors.png
supports_legend=1
legend_editor=standard
legend_placements=inside;above;below;left;right;manual
legend_layouts=row;stacked;wrapped
config_fields=title;x_label;y_label;line_width

[graph.demo.numeric.interpolation.errors.config.title]
type=string
label=Plot title
default=Interpolation demo - error against analytical reference

[graph.demo.numeric.interpolation.errors.config.x_label]
type=string
label=X-axis label (auto = source variable and unit)
default=auto

[graph.demo.numeric.interpolation.errors.config.y_label]
type=string
label=Y-axis label (auto = source Y unit)
default=auto

[graph.demo.numeric.interpolation.errors.config.line_width]
type=double
label=Error line width
default=1.4

[runner]
script=plugins/modules/demo.numeric.interpolation/runtime/demo_numeric_interpolation.m
rerender_script=plugins/modules/demo.numeric.interpolation/runtime/demo_numeric_interpolation_rerender.m

[config]
fields=output_dataset_id;query_point_count

[config.output_dataset_id]
type=string
label=Output Dataset ID
default=demo.numeric.interpolation.result
required=1

[config.query_point_count]
type=integer
label=Uniform query point count
default=201
required=1

[documentation]
api_version=1
guide=MANUAL.md
api_refs=MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;DATASET_VARIABLE_SCHEMA_API_v3;TABLE_STREAM_API_v3;DATASET_PUBLICATION_API_v2;NUMERIC_API_v1;PROGRESS_API_v1;GRAPH_PROVIDER_API_v1;PLOT_MODULE_API_v1;PLOT_DATASET_API_v1;PLUGIN_INSTALL_API_v1;DOCUMENTATION_API_v1
examples=
changelog=
