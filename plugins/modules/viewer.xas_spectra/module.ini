ts {artifact destinationDir} parameters {artifact {type {owned Plot artifact path} description {Actual existing graph artifact resolved by the Plot-v3 owner; source/point identity is not inferred from filename.}} destinationDir {type {trusted caller-owned output directory} description {Explicit host artifact/snapshot destination, not a restricted-client path grant or canonical Dataset identity.}}} result {type {detached capture receipt dictionary} description {Existing v3 captureForArtifact result with retained source identity; host-owned destination only.}} context {trusted host service. Canonical spectrum.scientific/family source with stable Dataset/Variable meaning delegates legacy Plot-v3 lifecycle/editor/detached artifacts. No renderer/private panel store or claimed v4 migration; artifact/host paths are not restricted-client grants.}} writePointIndex {command ::GX::XASViewer::writePointIndex arguments {artifact destination} parameters {artifact {type {owned Plot artifact path} description {Actual existing graph artifact resolved by the Plot-v3 owner; source/point identity is not inferred from filename.}} destination {type {new trusted output file path} description {Caller-owned host destination; existing file rejects, no canonical Dataset is implicitly published.}}} result {type {point-index file path string} description {Returns exact newly written destination after original v3 2D point-index creation; an existing destination or nonowned/3D artifact rejects.}} context {trusted host service. Canonical spectrum.scientific/family source with stable Dataset/Variable meaning delegates legacy Plot-v3 lifecycle/editor/detached artifacts. No renderer/private panel store or claimed v4 migration; artifact/host paths are not restricted-client grants.}} renderDetachedSnapshot {command ::GX::XASViewer::renderDetachedSnapshot arguments {cloneDir graphId} parameters {cloneDir {type {owned detached snapshot directory} description {Existing snapshot.h5/presentation.ini pair owned by the caller clone; no arbitrary source-preparation replacement.}} graphId {type {declared Graph ID} description {Existing descriptor-declared graph identity; keep module and base/Variant identity distinct.}}} result {type {rendered artifact path string} description {Returns cloneDir/graph.png after original v3 snapshot renderer verifies nonempty output; no source Dataset reread during detached rendering.}} context {trusted host service. Canonical spectrum.scientific/family source with stable Dataset/Variable meaning delegates legacy Plot-v3 lifecycle/editor/detached artifacts. No renderer/private panel store or claimed v4 migration; artifact/host paths are not restricted-client grants.}}}
