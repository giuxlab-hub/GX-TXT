; GX-TXT XAS pre-edge/edge-step normalization
; SPDX-License-Identifier: GPL-3.0-or-later
[meta]
api_version=1
id=analysis.xas.normalize
kind=analysis
group=Generic analysis / Spectral
name=XAS normalization
version=1.0.2
selectable=1
default_enabled=0
core=0
runner=standard_octave
order=365
depends=math.numeric
description=Pre-edge and post-edge normalization of XAS spectra and spectrum families using the public NUMERIC_API_v1.
config_hint=Select a spectrum.scientific or spectrum.family Dataset. Automatic E0 and fit windows are conservative Larch/Athena-style defaults and are always reported; choose manual values when experiment knowledge requires them.

[inputs]
contracts=spectrum.scientific;spectrum.family

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=spectrum.scientific;spectrum.family

[outputs]
files=xas_normalization_report.txt;xas_normalization_diagnostics.csv
datasets=spectrum.scientific;spectrum.family;table.generic

[config]
fields=e0_mode;e0_eV;pre1_eV;pre2_eV;norm1_eV;norm2_eV;normalization_order;derivative_smoothing_points;output_representation;failed_member_policy;output_dataset_id

[config.e0_mode]
type=choice
label=E0
default=auto
values=auto;manual
required=1

[config.e0_eV]
type=string
label=Manual E0 [eV]
default=
required=0

[config.pre1_eV]
type=string
label=Pre-edge lower offset from E0 [eV] (blank = auto)
default=
required=0

[config.pre2_eV]
type=string
label=Pre-edge upper offset from E0 [eV] (blank = auto)
default=
required=0

[config.norm1_eV]
type=string
label=Post-edge lower offset from E0 [eV] (blank = auto)
default=
required=0

[config.norm2_eV]
type=string
label=Post-edge upper offset from E0 [eV] (blank = auto)
default=
required=0

[config.normalization_order]
type=choice
label=Post-edge polynomial order
default=auto
values=auto;0;1;2
required=1

[config.derivative_smoothing_points]
type=integer
label=Automatic E0 derivative smoothing points
default=5
required=1

[config.output_representation]
type=choice
label=Normalized output
default=normalized
values=normalized;flattened
required=1

[config.failed_member_policy]
type=choice
label=Family member normalization failure
default=skip_with_report
values=skip_with_report;error
required=1

[config.output_dataset_id]
type=string
label=Output Dataset ID
default=xas.normalized
required=1

[runner]
script=plugins/modules/analysis.xas.normalize/runtime/analysis_xas_normalize.m

[documentation]
api_version=1
guide=MANUAL.md
changelog=CHANGELOG.md
api_refs=NUMERIC_API_v1;CANONICAL_DATASET_API_v2;TABLE_STREAM_API_v3;DATASET_PUBLICATION_API_v2;UNIT_REGISTRY_API_v1;SCIENTIFIC_SPECTRUM_API_v1;SPECTRAL_FAMILY_API_v1
