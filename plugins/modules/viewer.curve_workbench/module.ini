[meta]
api_version=1
id=viewer.curve_workbench
kind=viewer
group=Viewers
name=Curve Workbench
version=2.21.0
selectable=0
default_enabled=1
core=0
runner=service
order=861
depends=math.numeric
description=Construct, edit, compare, compose and publish planar scientific X/Y curves from one or more Datasets.
config_hint=Add a Dataset with X and Y; Filter, Family and Order are optional.

[inputs]
contracts=table.generic;timeseries.table;curve_family.table

[outputs]
datasets=table.generic

[viewers]
api_version=1
ids=curve_workbench

[viewer.curve_workbench]
name=Curve Workbench
backend=curve_workbench_tk
activation_api=CURVE_WORKBENCH_API_v1
capabilities=explicit_scientific_axis_declaration;mouse_canvas;ordinary_xy;curve_family;multi_source;source_identity;point_edit;composition;spline;residuals;undo_redo;dataset_publication

[public_apis]
ids=CURVE_WORKBENCH_API_v1

[public_api.CURVE_WORKBENCH_API_v1]
api_version=1
name=Curve Workbench backend
entrypoint=api/curve_workbench_api_v1.tcl
namespace=::GX::CurveWorkbench
capabilities=explicit_scientific_axis_declaration;viewer_backend;canonical_source_rows;mouse_edit;native2d_geometry;spline;residual_comparison;dataset_publication

[documentation]
api_version=1
guide=MANUAL.md
api_refs=VIEWER_PROVIDER_API_v1;SESSION_INSPECTION_API_v1;DATASET_VARIABLE_SCHEMA_API_v3;TABLE_STREAM_API_v3;NUMERIC_API_v1;DATASET_PUBLICATION_API_v2;DATASET_METADATA_API_v1

[workspace_actions]
api_version=1
ids=parameters
[workspace_action.parameters]
name=Parameters...
provider=curve_workbench
public_api=CURVE_WORKBENCH_API_v1
command=::GX::CurveWorkbench::parametersAction

[configuration]
api_version=1
entrypoint=api/curve_workbench_settings.tcl
[config]
fields=shortcuts
[config.shortcuts]
configuration_id=modules.curve_workbench.shortcuts
type=string
label=Command shortcuts
default=
persistent_default=1
application=immediate
validator=::GX::CurveWorkbench::_shortcutSettingsValidate
structured_fields=::GX::CurveWorkbench::_shortcutSettingsFields
description=Edit command keys individually. Ctrl/Shift and letters, Delete or F2-F12; conflicts and reserved text keys are rejected.

[statistical_results]
api_version=1
semantics_api=STATISTICAL_RESULT_SEMANTICS_API_v1
publication_required=0
boundary=api/curve_workbench_comparison_v4.tcl
