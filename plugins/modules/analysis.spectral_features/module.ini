[meta]
api_version=1
id=analysis.spectral_features
kind=analysis
group=Generic analysis / Spectral
name=Spectral Features
version=1.1.0
selectable=1
default_enabled=0
core=1
runner=standard_octave
order=360
depends=math.numeric
description=Dataset-native descriptive analysis of an existing one-sided spectrum. Generic grid/reduction operations use public NUMERIC_API_v1; feature definitions remain analysis semantics; result graphs are persistent plot.dataset variants.
config_hint=Select an existing spectrum.table Dataset, bind Frequency and one non-negative spectral value variable, then tell the module whether that value is amplitude, power, or PSD. The module derives a power-equivalent distribution, publishes reusable summary and distribution Datasets, and does not recompute the source FFT. See MANUAL.md.

[inputs]
contracts=spectrum.table

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=spectrum.table

[bindings]
roles=frequency;value

[binding.frequency]
label=Frequency
required=1
semantic_role=independent

[binding.value]
label=Spectral value
required=1
semantic_role=measured

[outputs]
files=spectral_features_metrics.ini;spectral_features_report.txt;automatic_graphs.ini
datasets=table.generic

[config]
fields=input_semantics;exclude_dc;output_dataset_id

[config.input_semantics]
type=choice
label=Input spectral semantics
default=amplitude
values=amplitude;power;psd
required=1

[config.exclude_dc]
type=choice
label=Exclude DC bin from descriptors
default=yes
values=yes;no
required=1

[config.output_dataset_id]
type=string
label=Spectral-features result Dataset ID
default=spectral_features.summary
required=1

[automatic_graphs]
provider=plot.dataset
api=PLOT_DATASET_API_v2
persistent_variants=1
requires_capabilities=series_kind_line

[runner]
script=plugins/modules/analysis.spectral_features/runtime/analysis_spectral_features.m

[documentation]
api_version=1
guide=MANUAL.md
api_refs=MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;DATASET_VARIABLE_SCHEMA_API_v3;TABLE_STREAM_API_v3;DATASET_PUBLICATION_API_v2;PROGRESS_API_v1;GRAPH_PROVIDER_API_v1;PLOT_DATASET_API_v2;NUMERIC_API_v1;PLUGIN_INSTALL_API_v1;SESSION_GENERATOR_LIBRARY_API_v1;UNIT_REGISTRY_API_v1;DOCUMENTATION_API_v1
examples=session_generators/gxtxt_numerical_examples_spectral_features_1.0.0.zip
changelog=CHANGELOG.md
