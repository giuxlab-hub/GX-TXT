[meta]
api_version=1
id=analysis.statistics.distribution
kind=analysis
group=Statistics
name=Empirical Distribution
version=1.0.1
selectable=1
default_enabled=0
core=0
runner=standard_octave
order=440
depends=math.numeric
summary=Histogram, frequency table, ECDF and quantiles for a numeric Dataset variable.
description=Explicit reproducible bins, optional Dataset Selection, public numerical operations and reusable published results.
config_hint=Choose a numeric variable and an explicit bin rule.

[inputs]
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table
[analysis_sources]
api_version=1
ids=primary
dynamic=0
[analysis_source.primary]
required=1
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table
[outputs]
files=distribution_report.txt;distribution_summary.ini;automatic_graphs.ini
datasets=table.generic
[config]
fields=variable;selection;nonfinite_policy;bin_mode;bin_count;bin_width;bin_edges;quantile_probabilities;output_dataset_prefix;render_graphs
[config.variable]
type=variable
label=Numeric variable
source=primary
required=1
[config.selection]
type=selection
label=Data selection (optional X interval)
source_role=primary
selection_types=x_range;rectangle
required=0
[config.nonfinite_policy]
type=choice
label=NaN / Inf policy
default=omit
values=omit;error
required=1
[config.bin_mode]
type=choice
label=Explicit bin rule
default=count
values=count;width;edges
required=1
[config.bin_count]
type=integer
label=Bin count (count mode)
default=10
[config.bin_width]
type=number
label=Bin width (width mode)
default=1
[config.bin_edges]
type=string
label=Bin edges, semicolon-separated (edges mode)
default=
[config.quantile_probabilities]
type=string
label=Quantile probabilities, semicolon-separated
default=0;0.25;0.5;0.75;1
[config.output_dataset_prefix]
type=string
label=Output Dataset ID prefix
default=statistics.distribution
required=1
[config.render_graphs]
type=boolean
label=Create histogram and ECDF graphs
default=1
required=1
[runner]
script=plugins/modules/analysis.statistics.distribution/runtime/analysis_statistics_distribution.m
[documentation]
api_version=1
guide=MANUAL.md
api_refs=MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;ANALYSIS_SOURCE_ACCESS_RUNTIME_v2;DATASET_SELECTION_API_v1;TABLE_STREAM_API_v3;DATASET_PUBLICATION_API_v2;NUMERIC_API_v1;PLOT_DATASET_API_v2
changelog=CHANGELOG.md
