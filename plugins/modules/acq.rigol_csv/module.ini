[meta]
api_version=1
id=acq.rigol_csv
kind=acquisition
group=Instruments / Oscilloscopes
name=Rigol oscilloscope CSV import
version=2.0.0
selectable=0
default_enabled=1
core=0
enabled_key=
run_key=
runner=standard_tcl
order=10
depends=
description=Native Standard Module API importer for Rigol oscilloscope CSV exports. It reuses the proven streaming Octave CSV worker but receives all configuration through its descriptor and the canonical variable map.
config_hint=Choose parser/layout settings here, then define the imported variables in the Variables tab. Instrument metadata is optional and is added explicitly in Instrumentation.

[inputs]
contracts=raw.csv

[outputs]
datasets=timeseries.table
files=raw/*;channels/*;metadata/datasets.ini

[graphs]
ids=

[config]
fields=parser;delimiter;header_rows;sequence_col;time_col;tstart;dt;make_rigol_split;make_canonical_split;chunk_rows;raw_fields;drop_trailing_fields;strict_sequence

[config.parser]
type=choice
label=Rigol / sequence parser
default=rigol_ds1000z
values=rigol_ds1000z;generic_sequence;generic_time
required=1

[config.delimiter]
type=choice
label=CSV delimiter
default=comma
values=comma;semicolon;tab
required=1

[config.header_rows]
type=integer
label=Header rows
default=2
required=1

[config.sequence_col]
type=integer
label=Sequence column
default=1
required=1

[config.time_col]
type=integer
label=Time column
default=1
required=1

[config.tstart]
type=string
label=Manual tStart [s]
default=
required=0

[config.dt]
type=string
label=Manual dt [s]
default=
required=0

[config.make_rigol_split]
type=boolean
label=Generate sequence + signal extract
default=1
required=1

[config.make_canonical_split]
type=boolean
label=Generate time_s + value canonical CSV
default=1
required=1

[config.chunk_rows]
type=integer
label=CSV rows per block
default=250000
required=1

[config.raw_fields]
type=integer
label=Raw fields per record (0=auto)
default=0
required=1

[config.drop_trailing_fields]
type=integer
label=Trailing fields to ignore
default=0
required=1

[config.strict_sequence]
type=boolean
label=Strict sequence check (+1)
default=1
required=1

[runner]
handler=rigol_csv_plugin

[acquisition_handler]
api_version=1
script=runtime/acquisition_handler.tcl
inspect_proc=::RigolCsv::inspect
import_proc=::RigolCsv::import
file_label=Rigol oscilloscope CSV files
file_patterns=*.csv;*.txt;*.dat
supports_batch=1
variable_mapping=required

[documentation]
api_version=1
guide=MANUAL.md
api_refs=MODULE_API_v1;ACQUISITION_HANDLER_PLUGIN_API_v1;CONFIGURATION_API_v1;DATASET_API_v1;PLUGIN_INSTALL_API_v1;INSTRUMENT_MODULE_API_v1
examples=
changelog=CHANGELOG.md
