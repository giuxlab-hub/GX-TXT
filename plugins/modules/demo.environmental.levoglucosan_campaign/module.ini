[meta]
api_version=1
id=demo.environmental.levoglucosan_campaign
kind=analysis
group=Scientific demonstrations / Environmental Chemistry
name=Sardinia Levoglucosan Campaign Demo
version=1.2.2
selectable=1
default_enabled=0
core=0
runner=standard_octave
order=795
depends=math.numeric;plot.dataset
description=Configurable analysis suite for the deterministic synthetic Sardinia levoglucosan campaign: campaign summary, seasonality, wildfire events, uncertainty/QC, cross-site relationships, anomaly detection, spatial analysis, canonical derived Datasets, selectable 2D graph groups, and optional 3D spatial views.
config_hint=Generate the bundled Sardinia Levoglucosan Campaign Session and run Analysis. Output groups can be enabled or disabled independently. The generated Session already contains the canonical Dataset, Variable Schema v3, Dataset Metadata, primary Analysis Source and stable bindings.

[inputs]
contracts=table.generic

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=table.generic
dataset_id=demo.environmental.levoglucosan.source

[outputs]
files=levoglucosan_campaign_report.txt;levoglucosan_campaign_metrics.ini;automatic_graphs.ini;analysis_outputs.ini
datasets=table.generic

[config]
fields=output_campaign_summary;output_seasonality;output_fire_events;output_uncertainty_qc;output_cross_site;output_anomaly_detection;output_spatial_analysis;render_2d_graphs;render_3d_graphs;qc_cv_threshold_percent;anomaly_window_days;anomaly_z_threshold;cross_site_max_lag_days

[config.output_campaign_summary]
type=boolean
label=Output: campaign summary
default=1
required=1

[config.output_seasonality]
type=boolean
label=Output: seasonality
default=1
required=1

[config.output_fire_events]
type=boolean
label=Output: wildfire events and relationships
default=1
required=1

[config.output_uncertainty_qc]
type=boolean
label=Output: measurement uncertainty and QC
default=1
required=1

[config.output_cross_site]
type=boolean
label=Output: cross-site relationships
default=1
required=1

[config.output_anomaly_detection]
type=boolean
label=Output: anomaly detection
default=1
required=1

[config.output_spatial_analysis]
type=boolean
label=Output: spatial analysis
default=1
required=1

[config.render_2d_graphs]
type=boolean
label=Render selected automatic 2D graphs
default=1
required=1

[config.render_3d_graphs]
type=boolean
label=Render 3D spatial views
default=1
required=1

[config.qc_cv_threshold_percent]
type=double
label=QC high-CV threshold [%]
default=10
required=1

[config.anomaly_window_days]
type=integer
label=Anomaly baseline moving-median window [days]
default=21
required=1

[config.anomaly_z_threshold]
type=double
label=Positive robust anomaly-score threshold
default=4
required=1

[config.cross_site_max_lag_days]
type=integer
label=Cross-site lag range [days]
default=2
required=1

[bindings]
roles=day_of_year;month;site_id;replicate_id;levoglucosan;fire_event_id;fire_exposure;fire_distance;latitude;longitude;elevation;below_lod;below_loq

[binding.day_of_year]
label=Day of year / temporal coordinate
required=1
semantic_role=independent

[binding.month]
label=Month number
required=1
semantic_role=independent

[binding.site_id]
label=Site ID (numeric 1..4)
required=1
semantic_role=group

[binding.replicate_id]
label=Technical replicate ID (numeric 1..3)
required=1
semantic_role=group

[binding.levoglucosan]
label=Levoglucosan concentration in aqueous extract
required=1
semantic_role=concentration

[binding.fire_event_id]
label=Fire event ID (0 = none)
required=1
semantic_role=group

[binding.fire_exposure]
label=Fire exposure index
required=1
semantic_role=independent

[binding.fire_distance]
label=Nearest active fire distance
required=1
semantic_role=independent

[binding.latitude]
label=Latitude
required=1
semantic_role=coordinate

[binding.longitude]
label=Longitude
required=1
semantic_role=coordinate


[binding.elevation]
label=Site elevation
required=0
semantic_role=coordinate

[binding.below_lod]
label=Below-LOD flag
required=1
semantic_role=generic

[binding.below_loq]
label=Below-LOQ flag
required=1
semantic_role=generic

[runner]
script=plugins/modules/demo.environmental.levoglucosan_campaign/runtime/demo_environmental_levoglucosan_campaign.m
rerender_script=

[documentation]
api_version=1
guide=MANUAL.md
api_refs=MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;ANALYSIS_SOURCE_METADATA_RUNTIME_v1;TABLE_STREAM_API_v3;DATASET_PUBLICATION_API_v2;NUMERIC_API_v1;PLOT_DATASET_API_v2;PLUGIN_INSTALL_API_v1;SESSION_GENERATOR_LIBRARY_API_v1;DOCUMENTATION_API_v1
examples=session_generators/sardinia_levoglucosan_campaign.zip
changelog=CHANGELOG.md
