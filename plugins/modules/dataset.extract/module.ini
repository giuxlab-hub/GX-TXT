[meta]
api_version=1
id=dataset.extract
kind=analysis
group=Generic analysis / Table transforms
name=Dataset Extract
version=1.3.0
core=1
selectable=1
default_enabled=0
enabled_key=
run_key=
runner=standard_octave
order=225
depends=
description=Publishes one exact-ID derived Dataset through CORE Dataset Transform, from a primary Dataset or independent multi-source Selection members. Preserves complete rows or explicit X/Y traces and all source/member lineage.
config_hint=All rows uses the primary Dataset. Selected/Unselected accepts a saved Selection, including multiple sources from Graphs. All/Trace controls projection. Every run publishes one new requested Dataset ID.

[inputs]
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=0
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table

[outputs]
files=extract_report.txt;extract_provenance.ini
datasets=table.generic;timeseries.table;curve_family.table;spectrum.table

[graphs]
ids=

[runner]
script=plugins/modules/dataset.extract/runtime/dataset_extract.m
rerender_script=

[config]
fields=row_mode;selection;column_mode;output_dataset_id

[config.row_mode]
type=choice
label=Rows
default=selected
values=all;selected;unselected
required=1

[config.selection]
type=selection
label=Dataset selection (Selected/Unselected rows only)
required=0
source_role=primary
selection_types=x_range;rectangle;members
multiple_sources=1

[config.column_mode]
type=choice
label=Variables
default=all
values=all;trace
required=1

[config.output_dataset_id]
type=string
label=Output Dataset ID
default=dataset.extracted
required=1

[bindings]
roles=trace_x;trace_y

[binding.trace_x]
label=Trace X variable (Trace mode only)
required=0
semantic_role=independent

[binding.trace_y]
label=Trace Y variable (Trace mode only)
required=0

[documentation]
api_version=1
guide=README.md
api_refs=MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;DATASET_SELECTION_API_v1;DATASET_VARIABLE_SCHEMA_API_v2;TABLE_STREAM_API_v2;DATASET_PUBLICATION_API_v2;DATASET_TRANSFORM_API_v1;PROGRESS_API_v1;PLUGIN_INSTALL_API_v1;DOCUMENTATION_API_v1
examples=
changelog=CHANGELOG.md
