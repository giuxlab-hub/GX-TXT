[meta]
api_version=1
id=viewer.3d_workbench
kind=viewer
group=Viewers
name=3D Workbench
version=0.3.1
selectable=0
default_enabled=1
core=0
runner=service
order=862
depends=viewer.engine_3d;math.numeric
description=Prepare exact solids and complete meshes with the shared Native3D engine and explicit Dataset publication.
[inputs]
contracts=table.generic;curve_family.table;geometry.mesh;model.cad
[outputs]
datasets=geometry.mesh;model.cad
[viewers]
api_version=1
ids=workbench_3d
[viewer.workbench_3d]
name=3D Workbench
backend=workbench_3d_native
supported_primitives=triangle_mesh;geometry;surface;points;trajectory;isosurface;volume
artifact_formats=stl;obj;step;stp;vtp;vtu;vti
capabilities=camera;clipping;opacity;native;lod;cache;session_persistence;multilayer;scalar;vector
activation_api=WORKBENCH_3D_API_v1
short_title=3D Workbench
semantic_group=geometry
group_title=3D & Geometry
icon=icons/workbench_3d.png

[public_apis]
ids=WORKBENCH_3D_API_v1
[public_api.WORKBENCH_3D_API_v1]
api_version=1
name=3D Workbench controller
entrypoint=api/workbench_3d_api_v1.tcl
namespace=::GX::Workbench3D
capabilities=viewer_backend;native3d;document_resources;explicit_publication
[documentation]
api_version=1
guide=MANUAL.md
api_refs=NATIVE_3D_ENGINE_API_v1;NATIVE_3D_GEOMETRY_API_v1;INTERACTIVE_DOCUMENT_API_v1;CURVE_SOURCE_API_v1;DATASET_FILE_PUBLICATION_API_v1;UI_FIELD_API_v1

[statistical_results]
