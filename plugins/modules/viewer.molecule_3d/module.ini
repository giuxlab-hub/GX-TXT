[meta]
api_version=1
id=viewer.molecule_3d
kind=viewer
group=Viewers
name=Molecule Viewer
version=1.0.1
selectable=0
default_enabled=1
core=0
runner=service
order=859
depends=acq.molecule_structure;viewer.native_3d
description=Dedicated molecular structure viewer with source-preserving import, PubChem lookup, CC0 reference examples and geometric measurements.
config_hint=Open or install a molecular Dataset, select atoms in the table or projection, then render ball-and-stick or space-filling geometry in Native 3D.

[inputs]
contracts=molecular.structure

[outputs]
datasets=

[viewers]
api_version=1
ids=molecule_3d

[viewer.molecule_3d]
name=Molecule Viewer
backend=molecule_3d_tk
backend_script=runtime/molecule_viewer.tcl
supported_primitives=points;surface
capabilities=structure;selection;measurement;conformers;source_provenance;session_persistence
short_title=Molecules
semantic_group=geometry
group_title=3D & Geometry
icon=icons/molecule_3d.png

[documentation]
api_version=1
guide=README.md
api_refs=VIEWER_PROVIDER_API_v1;NATIVE_3D_VIEWER_API_v1;SESSION_INSPECTION_API_v1;DATASET_METADATA_API_v1
