[meta]
api_version=1
id=viewer.table_extractor
kind=viewer
group=Viewers
name=Table Extractor
version=1.0.1
selectable=0
default_enabled=1
core=1
runner=service
order=850
depends=
description=Interactive table extraction from canonical Image or PDF Datasets. PDF sources use native positioned text when usable and fall back to raster OCR; all paths converge to one layout model and publish table.generic Datasets.
config_hint=Open from Viewers, select an image.raster or document.pdf Dataset, extract a table, review/edit the reconstructed cells, then publish a normal table.generic Dataset.

[inputs]
contracts=image.raster;document.pdf

[outputs]
datasets=table.generic

[viewers]
api_version=1
ids=table_extractor

[viewer.table_extractor]
name=Table Extractor
backend=table_extractor_tk
activation_api=TABLE_EXTRACTOR_VIEWER_API_v1
capabilities=interactive;image_dataset;pdf_dataset;native_pdf_text;ocr;roi;table_reconstruction;preview_edit;session_persistence;dataset_publication

[public_apis]
ids=TABLE_EXTRACTOR_VIEWER_API_v1

[public_api.TABLE_EXTRACTOR_VIEWER_API_v1]
api_version=1
name=Table Extractor Viewer backend
entrypoint=api/table_extractor_viewer_api_v1.tcl
namespace=::GX::TableExtractor
capabilities=viewer_backend;interactive_documents;dataset_metadata;dataset_publication_v2

[documentation]
api_version=1
guide=MANUAL.md
changelog=CHANGELOG.md
api_refs=VIEWER_PROVIDER_API_v1;INTERACTIVE_DOCUMENT_API_v1;DATASET_API_v1;DATASET_METADATA_API_v1;DATASET_VARIABLE_SCHEMA_API_v3;DATASET_PUBLICATION_API_v2;CONTRACT_REGISTRY_API_v1;PLUGIN_INSTALL_API_v1;PLUGIN_HOST_INDEPENDENCE_RULE_v1
