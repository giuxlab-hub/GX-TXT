; SPDX-License-Identifier: GPL-3.0-or-later
[meta]
api_version=1
id=acq.scientific_measurement
kind=acquisition
group=Acquisition
name=Scientific measurement importer
version=1.0.2
license=GPL-3.0-or-later
selectable=1
default_enabled=1
core=0
runner=standard_tcl
description=Explicit scientific CSV/JCAMP; qualified SIF65567 and PEPE SP; synthetic CFBv3 PRF subset, authentic PRF unverified.
depends=

[runner]
handler=acq_scientific_measurement_managed_cpp_v1

[acquisition_handler]
api_version=1
runtime=managed_cpp
format_profiles_manifest=source/project.json
formats=acq.scientific_measurement/spectral_csv;acq.scientific_measurement/jcamp_dx;acq.scientific_measurement/andor_sif;acq.scientific_measurement/perkinelmer_sp;acq.scientific_measurement/perkinelmer_prf
default_profile=spectral_csv
supports_batch=1
supports_external_raw=1
variable_mapping=optional
capabilities=batch;progress;cooperative_async;cancellation;managed_request;consumable_prepared_buffers
file_label=Scientific measurement importer
file_patterns=*.PRF;*.SP;*.csv;*.dx;*.jcamp;*.jdx;*.prf;*.sif;*.sp;*.txt

[acquisition_format.acq.scientific_measurement/spectral_csv]
description=Explicit spectral CSV
mime=text/plain
extensions=*.csv;*.txt

[acquisition_format.acq.scientific_measurement/jcamp_dx]
description=JCAMP-DX shared CORE source parser
mime=text/plain
extensions=*.jdx;*.dx;*.jcamp

[acquisition_format.acq.scientific_measurement/andor_sif]
description=Andor SIF65567 primary float32
mime=application/octet-stream
extensions=*.sif

[acquisition_format.acq.scientific_measurement/perkinelmer_sp]
description=PerkinElmer PEPE SP constant-interval absorbance
mime=application/octet-stream
extensions=*.sp;*.SP

[acquisition_format.acq.scientific_measurement/perkinelmer_prf]
description=PRF CFBv3 numeric trace · authentic compatibility unverified
mime=application/octet-stream
extensions=*.prf;*.PRF

[config]
fields=format_profile;spectrum_id;display_name;spectrum_kind;x_quantity;x_unit;y_quantity;y_representation;y_unit;x_column;y_column;delimiter;header;sif_axis_mode;sif_calibration_unit;sif_calibration_quantity;sif_unknown_y_unit;sif_unknown_y_quantity;sif_unknown_y_representation;prf_time_unit;prf_signal_unit;prf_signal_quantity

[config.format_profile]
type=choice
label=Format profile
default=spectral_csv
values=spectral_csv;jcamp_dx;andor_sif;perkinelmer_sp;perkinelmer_prf
required=1

[config.spectrum_id]
type=string
label=Scientific identity
default=measurement
required=1

[config.display_name]
type=string
label=Display name
default=Scientific measurement
required=1

[config.spectrum_kind]
type=string
label=Spectrum kind: required CSV / JCAMP source consistency check
default=
required=0

[config.x_quantity]
type=string
label=X quantity: required CSV / JCAMP source consistency check
default=
required=0

[config.x_unit]
type=string
label=X unit: required CSV / JCAMP source consistency check
default=
required=0

[config.y_quantity]
type=string
label=Y quantity: required CSV / JCAMP source consistency check
default=
required=0

[config.y_representation]
type=string
label=Y representation: required CSV / JCAMP source consistency check
default=
required=0

[config.y_unit]
type=string
label=Y unit: required CSV / JCAMP source consistency check
default=
required=0

[config.x_column]
type=string
label=CSV X column name or 1-based index
default=1
required=0

[config.y_column]
type=string
label=CSV Y column name or 1-based index
default=2
required=0

[config.delimiter]
type=string
label=CSV delimiter: auto / comma / semicolon / tab
default=auto
required=0

[config.header]
type=boolean
label=CSV has column header
default=1
required=1

[config.sif_axis_mode]
type=choice
label=SIF coordinate mode
default=pixel
required=1
values=pixel;calibrated

[config.sif_calibration_unit]
type=string
label=Explicit SIF physical calibration source unit
default=
required=0

[config.sif_calibration_quantity]
type=string
label=Explicit SIF physical calibration quantity
default=
required=0

[config.sif_unknown_y_unit]
type=string
label=Unknown SIF signal source unit
default=
required=0

[config.sif_unknown_y_quantity]
type=string
label=Unknown SIF signal quantity
default=
required=0

[config.sif_unknown_y_representation]
type=string
label=Unknown SIF signal representation
default=
required=0

[config.prf_time_unit]
type=string
label=Reviewed PRF numeric time unit s/min/h; no conversion
default=
required=0

[config.prf_signal_unit]
type=string
label=Reviewed PRF signal source unit; no inferred RMS unit
default=
required=0

[config.prf_signal_quantity]
type=string
label=Reviewed PRF signal source quantity
default=
required=0

[outputs]
datasets=measurement.numeric_array;spectrum.scientific;timeseries.table

[documentation]
api_version=1
guide=MANUAL.md
changelog=CHANGELOG.md
api_refs=ACQUISITION_HANDLER_PLUGIN_API_v1;VIEWER_DEVELOPMENT_API_v1

