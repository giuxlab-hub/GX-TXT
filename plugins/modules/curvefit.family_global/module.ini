[meta]
api_version=1
id=curvefit.family_global
kind=analysis
group=Generic analysis / Model fitting
name=Curve Family Fitting
version=12
core=1
selectable=1
default_enabled=0
enabled_key=
run_key=
runner=standard_octave
order=300
depends=math.numeric;plot.dataset
description=Fits or evaluates a parameterized mathematical model on a family of characteristic curves stored as a canonical Dataset. Evaluate mode uses frozen parameters and never runs an optimizer. Scientific outputs use shared Parameter-Set and Model-Domain APIs; five persistent public Plot.dataset variants show fitting and validation results.
config_hint=Fit mode preserves the normal solver workflow. Evaluate mode ignores solver, maximum iterations and tolerance, and uses frozen parameters from manual values or a fit_parameters.csv file. Presentation orientation changes only plotting/grouping, never mathematical model inputs.

[inputs]
contracts=curve_family.table;table.generic
default_dataset=curve_family.primary

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=curve_family.table;table.generic

[outputs]
files=fit_statistics.tcldict;fit_parameters.csv;fit_summary.txt;fit_predictions.csv;fit_metrics_by_family.csv;fit_metrics_by_domain.csv;fit_metrics_by_family_domain.csv;render_cache.mat

[graphs]
