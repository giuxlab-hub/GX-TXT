[config]
fields=dataset_id;model_id;operation_mode;parameter_scopes;parameter_initial_values;parameter_lower_bounds;parameter_upper_bounds;parameter_fixed_mask;parameter_source;fixed_parameter_values;parameter_csv_path;presentation_orientation;solver;max_iter;tolerance;minimum_abs_y_for_relative_error

[config.dataset_id]
type=dataset
label=Input dataset
default=curve_family.primary
required=1
contract=curve_family.table;table.generic

[config.model_id]
type=model
requires_function=1
label=Mathematical model
default=triode.koren_v1
required=1

[config.operation_mode]
type=choice
label=Operation mode
default=fit
values=fit;evaluate
required=1

[config.parameter_source]
type=choice
label=Frozen parameter source
default=manual
values=manual;csv
required=1

[config.parameter_scopes]
type=string
label=Parameter scopes (model order: shared, local or fixed; semicolon-separated)
default=shared
required=1

[config.parameter_initial_values]
type=string
label=Initial values in expanded parameter order (blank uses model defaults)
default=
required=0

[config.parameter_lower_bounds]
type=string
label=Lower bounds in expanded parameter order (blank uses model defaults)
default=
required=0

[config.parameter_upper_bounds]
type=string
label=Upper bounds in expanded parameter order (blank uses model defaults)
default=
required=0

[config.parameter_fixed_mask]
type=string
label=Additional fixed slots in expanded order (0 or 1; blank uses scopes)
default=
required=0

[config.fixed_parameter_values]
type=string
label=Frozen values (expanded order for local parameters; semicolon-separated)
default=
required=0

[config.parameter_csv_path]
type=file
label=Parameter CSV
default=
required=0
must_exist=1
extensions=.csv
dialog_title=Choose parameter set

[config.presentation_orientation]
type=choice
label=Presentation orientation
default=x_by_family
values=x_by_family;family_by_x
required=1

[config.solver]
type=choice
label=Solver
default=auto
values=auto;lsqnonlin;fminsearch
required=1

[config.max_iter]
type=integer
label=Maximum iterations
default=2000
required=1

[config.tolerance]
type=double
label=Tolerance
default=1e-8
required=1

[config.minimum_abs_y_for_relative_error]
type=double
label=Minimum absolute measured Y for relative error
default=1e-12
required=1


[bindings]
roles=x;family;y

[binding.x]
label=Independent X
required=1
preferred_model_field=x_column
semantic_role=independent

[binding.family]
label=Family variable
required=1
preferred_model_field=family_column
semantic_role=family

[binding.y]
label=Measured Y
required=1
preferred_model_field=y_column
semantic_role=measured

