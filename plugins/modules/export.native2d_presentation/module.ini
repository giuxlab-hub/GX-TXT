[meta]
api_version=1
id=export.native2d_presentation
kind=export
group=Export
name=Native2D Presentation Export
version=1.0.0
selectable=1
default_enabled=1
core=0
runner=service
order=865
description=Vector SVG and PNG of the shared Native2D presentation snapshot.

[extensions]
api_version=1
ids=svg;png

[extension.svg]
name=Export SVG
category=exporter
workbenches=viewer.curve_viewer;viewer.curve_workbench;viewer.dataset_curve_fit
mutates=0
public_api=NATIVE2D_EXPORT_API_v1
command=::GX::Native2DExport::svg
required_apis=NATIVE2D_PRESENTATION_SNAPSHOT_v1
output_format=svg

[extension.png]
name=Export PNG
category=exporter
workbenches=viewer.curve_viewer;viewer.curve_workbench;viewer.dataset_curve_fit
mutates=0
public_api=NATIVE2D_EXPORT_API_v1
command=::GX::Native2DExport::png
required_apis=NATIVE2D_PRESENTATION_SNAPSHOT_v1
output_format=png
parameters=scale

[extension.png.parameter.scale]
type=number
label=Image scale
default=1
min=0.25
max=4

[public_apis]
ids=NATIVE2D_EXPORT_API_v1
[public_api.NATIVE2D_EXPORT_API_v1]
api_version=1
name=Native2D snapshot export
entrypoint=api/native2d_export_api_v1.tcl
namespace=::GX::Native2DExport
capabilities=renderer_neutral;png;vector_svg

[documentation]
api_version=1
guide=MANUAL.md
api_refs=WORKBENCH_EXTENSION_API_v1;NATIVE2D_PRESENTATION_SNAPSHOT_v1
