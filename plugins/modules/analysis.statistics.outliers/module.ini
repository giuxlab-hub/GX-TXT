; GX-TXT explicit outlier flagging.
; SPDX-License-Identifier: GPL-3.0-or-later
[meta]
api_version=1
id=analysis.statistics.outliers
kind=analysis
group=Statistics
name=Outlier Flags
version=1.0.1
selectable=1
default_enabled=0
core=0
runner=standard_octave
order=450
depends=math.numeric
summary=Flag outliers with an explicit IQR fence or MAD robust-score rule.
description=Preserves selected source-row identity and publishes scores, limits and flags without modifying observations.
config_hint=Choose a numeric variable, IQR or MAD rule, and a positive multiplier.
[inputs]
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table
[analysis_sources]
api_version=1
ids=primary
dynamic=0
[analysis_source.primary]
required=1
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table
[outputs]
files=outliers_report.txt;outliers_summary.ini;automatic_graphs.ini
datasets=table.generic
[config]
fields=variable;selection;method;multiplier;nonfinite_policy;output_dataset_id
[config.variable]
type=variable
label=Numeric variable
source=primary
required=1
[config.selection]
type=selection
label=Data selection (optional X interval)
source_role=primary
selection_types=x_range;rectangle
required=0
[config.method]
type=choice
label=Flagging rule
default=iqr
values=iqr;mad
required=1
[config.multiplier]
type=number
label=Fence or robust-score threshold
default=1.5
required=1
[config.nonfinite_policy]
type=choice
label=NaN / Inf policy
default=omit
values=omit;error
required=1
[config.output_dataset_id]
type=string
label=Output Dataset ID
default=statistics.outliers.flags
required=1
[runner]
script=plugins/modules/analysis.statistics.outliers/runtime/analysis_statistics_outliers.m
[documentation]
api_version=1
guide=MANUAL.md
api_refs=MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;ANALYSIS_SOURCE_ACCESS_RUNTIME_v2;DATASET_SELECTION_API_v1;TABLE_STREAM_API_v3;DATASET_PUBLICATION_API_v2;NUMERIC_API_v1
changelog=CHANGELOG.md
