on context and original UTF-8 JSON payload.}} context {trusted host service. Current Session and Digitizer-owned configuration Document; source raster SHA, producer format and selected curve must agree. Retained statistical consumers delegate Numeric/Statistical Semantics/Resource/Publication; propagated meaning is not independent accuracy validation.}} curveContext {command ::GX::CurveDigitizerCompanion::curveContext arguments {documentId curveId} parameters {documentId {type {Interactive Document ID} description {Existing Document owned by the named provider; current Session/generation/revision checks belong to the actual Document consumer.}} curveId {type {stable digitizer curve ID} description {Nonempty existing logical curve identity inside the selected Digitizer configuration; not its display label.}}} result {type {curve context dictionary} description {Exact selected stable curve with configuration/source/axes/calibration and Document SHA.}} context {trusted host service. Current Session and Digitizer-owned configuration Document; source raster SHA, producer format and selected curve must agree. Retained statistical consumers delegate Numeric/Statistical Semantics/Resource/Publication; propagated meaning is not independent accuracy validation.}} sourceResolve {command ::GX::CurveDigitizerCompanion::sourceResolve arguments documentId parameters {documentId {type {Interactive Document ID} description {Existing Document owned by the named provider; current Session/generation/revision checks belong to the actual Document consumer.}}} result {type {verified source dictionary} description {Current Dataset ID/path/SHA, contract/media_type and optional metadata; trusted host path only.}} context {trusted host service. Current Session and Digitizer-owned configuration Document; source raster SHA, producer format and selected curve must agree. Retained statistical consumers delegate Numeric/Statistical Semantics/Resource/Publication; propagated meaning is not independent accuracy validation.}} commitPixelPoints {command ::GX::CurveDigitizerCompanion::commitPixelPoints arguments {documentId curveId expectedDocumentSha sessionToken pointsText} parameters {documentId {type {Interactive Document ID} description {Existing Document owned by the named provider; current Session/generation/revision checks belong to the actual Document consumer.}} curveId {type {stable digitizer curve ID} description {Nonempty existing logical curve identity inside the selected Digitizer configuration; not its display label.}} expectedDocumentSha {type {SHA-256 string} description {Exact captured nonempty Document payload digest; an outdated expected digest rejects before point append.}} sessionToken {type {Session lifetime token} description {Captured current Interactive Document Session lifetime token; stale/foreign lifetime rejects.}} pointsText {type {UTF-8 tab-separated raster-point text} description {Lines x<TAB>y or id<TAB>x<TAB>y in original raster pixels; unique IDs and complete valid calibration are required.}}} result {type {Document update receipt dictionary} description {Updated document_id/document_sha256 and curve_id after producer-calibrated raster-point append; not a whole external-processing CAS guarantee.}} context {trusted host service. Current Session and Digitizer-owned configuration Document; source raster SHA, producer format and selected curve must agree. Retained statistical consumers delegate Numeric/Statistical Semantics/Resource/Publication; propagated meaning is not independent accuracy validation.}} validateUncertaintyBinding {command ::GX::CurveDigitizerCompanion::validateUncertaintyBinding arguments binding parameters {binding {type {retained digitization publication-binding dictionary} description {Actual gxtxt.digitizer_publication_binding.v1 resources/meaning/source identities, not caller-invented sigma arrays.}}} result {type {statistical meaning dictionary} description {Validated retained digitization interpretation; does not alone read current source Dataset.}} context {trusted host service. Current Session and Digitizer-owned configuration Document; source raster SHA, producer format and selected curve must agree. Retained statistical consumers delegate Numeric/Statistical Semantics/Resource/Publication; propagated meaning is not independent accuracy validation.}} publicationUncertainty {command ::GX::CurveDigitizerCompanion::publicationUncertainty arguments dataset parameters {dataset {type {canonical Dataset ID} description {Existing current-Session Dataset whose producer/schema/retained identity must meet this operation contract.}}} result {type {dictionary or empty string} description {Actual binding/meaning/source_identity after Dataset payload/Variable/unit checks, or empty when no binding.}} context {trusted host service. Current Session and Digitizer-owned configuration Document; source raster SHA, producer format and selected curve must agree. Retained statistical consumers delegate Numeric/Statistical Semantics/Resource/Publication; propagated meaning is not independent accuracy validation.}} publishCovariance {command ::GX::CurveDigitizerCompanion::publishCovariance arguments {dataset target axis} parameters {dataset {type {canonical Dataset ID} description {Existing current-Session Dataset whose producer/schema/retained identity must meet this operation contract.}} target {type {new output Dataset ID} description {Explicit create-only covariance publication destination; the existing Publication owner rejects collisions.}} axis {type {axis choice x or y} description {Response axis for retained response-only covariance propagation; no full errors-in-variables claim.}}} result {type {canonical publication receipt dictionary} description {New response-only NxN float64 covariance Dataset, retained source binding and fit-plan units; metadata failure after finalize does not undo publication.}} context {trusted host service. Current Session and Digitizer-owned configuration Document; source raster SHA, producer format and selected curve must agree. Retained statistical consumers delegate Numeric/Statistical Semantics/Resource/Publication; propagated meaning is not independent accuracy validation.}} covariancePublication {command ::GX::CurveDigitizerCompanion::covariancePublication arguments dataset parameters {dataset {type {canonical Dataset ID} description {Existing current-Session Dataset whose producer/schema/retained identity must meet this operation contract.}}} result {type {dictionary or empty string} description {Checked retained covariance publication binding or empty when absent; no recomputation.}} context {trusted host service. Current Session and Digitizer-owned configuration Document; source raster SHA, producer format and selected curve must agree. Retained statistical consumers delegate Numeric/Statistical Semantics/Resource/Publication; propagated meaning is not independent accuracy validation.}}}
