[semantic_roles]
ids=curve_series_identifier;curve_series_label;curve_point_index;curve_raster_x;curve_raster_y;curve_point_identifier;uncertainty_standard_x;uncertainty_standard_y;uncertainty_covariance_xy

[semantic_role.curve_series_identifier]
label=Curve identifier
description=Opaque identifier grouping points into curves, regardless of user-facing names.
allowed_value_kinds=text

[semantic_role.curve_series_label]
label=Curve display name
description=Human-readable name of a curve, not suitable for stable grouping.
allowed_value_kinds=text

[semantic_role.curve_point_index]
label=Curve point order
description=Zero-based ordering of points inside a single curve.
allowed_value_kinds=number

[semantic_role.curve_raster_x]
label=Raster pixel X
description=Original source-image pixel-center X coordinate of a digitized point.
allowed_value_kinds=number

[semantic_role.curve_raster_y]
label=Raster pixel Y
description=Original source-image pixel-center Y coordinate of a digitized point.
allowed_value_kinds=number

[semantic_role.curve_point_identifier]
label=Original digitization point identity
description=Stable opaque point ID shared by all calibration realizations; group with calibration identifier when needed.
allowed_value_kinds=text

[semantic_role.uncertainty_standard_x]
label=Physical X standard uncertainty
description=Operator-declared and analytically propagated standard uncertainty in the X variable units.
allowed_value_kinds=number

[semantic_role.uncertainty_standard_y]
label=Physical Y standard uncertainty
description=Operator-declared and analytically propagated standard uncertainty in the Y variable units.
allowed_value_kinds=number

[semantic_role.uncertainty_covariance_xy]
label=Within-point physical XY covariance
description=Covariance within an XY point; units are the product of X and Y physical units.
allowed_value_kinds=number

