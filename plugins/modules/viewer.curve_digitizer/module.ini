capabilities=published_dataset_calibration;source_integrity;pixel_to_scientific_transform;scientific_to_pixel_transform;batch_transform;calibration_fingerprint;uncertainty_reporting;local_jacobian;scale_bar_provenance;typed_read;multiple_calibration_realizations;per_realization_transform
public_contract=schema gxtxt.public_api_documentation.v1 purpose {Read published calibration manifests and apply their retained pixel/scientific mapping without modifying the Dataset or GUI configuration.} context {Trusted Tcl host after modulePublicApiActivate viewer.curve_digitizer CURVE_DIGITIZER_CALIBRATION_API_v1; no direct Python/Octave registration or typed C++ method.} operations {read {command ::GX::CurveDigitizerCalibration::read arguments {datasetId {session ""}} parameters {datasetId {type DatasetID description {Stable ID of the published Curve Digitizer Dataset.}} session {type SessionPath description {Optional explicit Session; empty uses the current Session.}}} result {type CalibrationManifestDictionary description {Validated published calibration manifest, including declared axes, units and source integrity.}} context {Published Digitizer Dataset in explicit/current Session.}} hasCalibration {command ::GX::CurveDigitizerCalibration::hasCalibration arguments {datasetId {session ""}} parameters {datasetId {type DatasetID description {Stable ID of the published Curve Digitizer Dataset.}} session {type SessionPath description {Optional explicit Session; empty uses the current Session.}}} result {type Boolean description {Metadata-tag/version presence; catches metadata errors and does not prove full manifest/transform validation.}} context {Explicit/current Session; false when metadata cannot be read.}} schema {command ::GX::CurveDigitizerCalibration::schema arguments {} parameters {} result {type APISchemaDictionary description {API/version, manifest fields/types, all eight methods, point/direction/measurement/fingerprint conventions.}} context {No Session required.}} replicates {command ::GX::CurveDigitizerCalibration::replicates arguments datasetId parameters {datasetId {type DatasetID description {Stable ID of the published Curve Digitizer Dataset.}}} result {type CalibrationMeasurementList description {Published calibration measurement dictionaries from the current Session.}} context {Current Session and published Digitizer Dataset.}} transformPoints {command ::GX::CurveDigitizerCalibration::transformPoints arguments {datasetId points direction {measurementId ""}} parameters {datasetId {type DatasetID description {Stable ID of the published Curve Digitizer Dataset.}} points {type XYPointList description {List of finite two-coordinate points; source pixels or declared scientific axis units according to direction.}} direction {type DirectionEnum description {pixel_to_scientific or scientific_to_pixel.}} measurementId {type MeasurementID description {Optional stable published calibration measurement ID; empty uses the base manifest.}}} result {type XYPointList description {Complete transformed XY list in original raster pixels or each declared scientific axis unit; error returns no partial list.}} context {Current Session, supported published pixel geometry and selected base/measurement calibration.}} identity {command ::GX::CurveDigitizerCalibration::identity arguments {datasetId {measurementId ""}} parameters {datasetId {type DatasetID description {Stable ID of the published Curve Digitizer Dataset.}} measurementId {type MeasurementID description {Optional stable published calibration measurement ID; empty uses the base manifest.}}} result {type CalibrationIdentityDictionary description {available=1 with calibration_id/sha256/source_sha256, or available=0/reason=legacy_fingerprint_unavailable/dataset_id.}} context {Current Session; optional published measurement calibration.}} jacobian {command ::GX::CurveDigitizerCalibration::jacobian arguments {datasetId points} parameters {datasetId {type DatasetID description {Stable ID of the published Curve Digitizer Dataset.}} points {type XYPointList description {List of finite two-coordinate points in the retained source-image raster pixel coordinates.}}} result {type JacobianRecordList description {Per-point valid=1, point_px, scientific_point, jacobian and determinant; rows use scientific axis units per pixel.}} context {Current Session; base published calibration, no measurementId parameter.}} pointUncertainty {command ::GX::CurveDigitizerCalibration::pointUncertainty arguments {datasetId points} parameters {datasetId {type DatasetID description {Stable ID of the published Curve Digitizer Dataset.}} points {type XYPointList description {List of finite two-coordinate points in the retained source-image raster pixel coordinates.}}} result {type UncertaintyRecordList description {Per-point unavailable record or declared isotropic pixel-sigma propagation in each actual scientific axis unit.}} context {Current Session; base calibration and its declared uncertainty assumptions.}}}

[public_api.CURVE_DIGITIZER_DATASET_SCHEMA_API_v1]
public_contract=schema gxtxt.public_api_documentation.v1 purpose {Published Digitizer Dataset in the live current Session; producer metadata, stable Variable IDs, rank/dtype/dimensions and explicit role/unit meanings are authoritative. Reads never rewrite canonical source.} context {Inert provider-owned trusted-host documentation only. No provider activation, scientific work, Script/SDK authorization or generic invocation is granted.} operations {read {command ::GX::CurveDigitizerDataset::read arguments {datasetId {session ""}} parameters {datasetId {type {canonical Dataset ID} description {Exact existing Dataset in the current Session; source contract, Variable identities and lifetime are checked by this family, never inferred from a path.}} session {type {Session path or empty string} description {Omitted/empty uses current Session; an explicit Session must satisfy the live-Session admission documented for this producer.}}} result {type {semantic manifest dictionary} description {Producer schema/version/mode/grouping, stable columns/Variables/role meanings/units, legacy status and raster availability.}} context {trusted host service. Published Digitizer Dataset in the live current Session; producer metadata, stable Variable IDs, rank/dtype/dimensions and explicit role/unit meanings are authoritative. Reads never rewrite canonical source.}} column {command ::GX::CurveDigitizerDataset::column arguments {datasetId semanticRole {session ""}} parameters {datasetId {type {canonical Dataset ID} description {Exact existing Dataset in the current Session; source contract, Variable identities and lifetime are checked by this family, never inferred from a path.}} semanticRole {type {published semantic-role string} description {Actual producer role key such as x/y/curve_key/point_order, resolved to stable Variable identity rather than labels.}} session {type {Session path or empty string} description {Omitted/empty uses current Session; an explicit Session must satisfy the live-Session admission documented for this producer.}}} result {type {Variable ID string} description {Actual stable Variable ID for semanticRole; missing role raises.}} context {trusted host service. Published Digitizer Dataset in the live current Session; producer metadata, stable Variable IDs, rank/dtype/dimensions and explicit role/unit meanings are authoritative. Reads never rewrite canonical source.}} hasSchema {command ::GX::CurveDigitizerDataset::hasSchema arguments {datasetId {session ""}} parameters {datasetId {type {canonical Dataset ID} description {Exact existing Dataset in the current Session; source contract, Variable identities and lifetime are checked by this family, never inferred from a path.}} session {type {Session path or empty string} description {Omitted/empty uses current Session; an explicit Session must satisfy the live-Session admission documented for this producer.}}} result {type {Tcl boolean} description {1 when complete read succeeds; catches any read failure as0.}} context {trusted host service. Published Digitizer Dataset in the live current Session; producer metadata, stable Variable IDs, rank/dtype/dimensions and explicit role/unit meanings are authoritative. Reads never rewrite canonical source.}} schema {command ::GX::CurveDigitizerDataset::schema arguments {} parameters {} result {type {schema dictionary} description {API/version, role/type/grouping conventions and all five public methods.}} context {trusted host service. Metadata/capability inspection of the already loaded public owner. No scientific Dataset or active GUI is required by this metadata method; capabilities do not establish language admission or runtime availability.}} rasterPoints {command ::GX::CurveDigitizerDataset::rasterPoints arguments {datasetId {curveKey ""} {start 0} {count 10000} {calibrationKey ""}} parameters {datasetId {type {canonical Dataset ID} description {Exact existing Dataset in the current Session; source contract, Variable identities and lifetime are checked by this family, never inferred from a path.}} curveKey {type {exact curve grouping key or empty string} description {Optional exact curve-key filter applied after the bounded canonical row-range read; empty disables it.}} start {type {nonnegative integer canonical row ordinal} description {Zero-based canonical Dataset row start, not a per-curve result offset.}} count {type {integer row-read count} description {Requested canonical range count1..100000, default10000; continue by consumed_rows, not filtered point count.}} calibrationKey {type {exact calibration-realization key or empty string} description {Optional exact calibration-key filter applied after reading; absence of that role yields no matching rows.}}} result {type {row-page dictionary} description {dataset_id/start/consumed_rows/points/coordinate_reference=original_source_image_pixel_centers. Filters run after range read.}} context {trusted host service. Published Digitizer Dataset in the live current Session; producer metadata, stable Variable IDs, rank/dtype/dimensions and explicit role/unit meanings are authoritative. Reads never rewrite canonical source.}}}
