[meta]
api_version=1
id=viewer.curve_digitizer
kind=viewer
group=Viewers
name=Curve Digitalizer
version=2.0.3
selectable=0
default_enabled=1
core=1
runner=service
order=840
depends=
description=GX-TXT-native interactive curve digitization from canonical Image Datasets with Session-persistent configurations and direct Dataset publication.
config_hint=Configure shared settings under Configuration > Modules > Curve Digitalizer. Scientific digitization profiles are Session Interactive Documents; open the Viewer from Viewers.


; Configuration API v1: declared without activating the Viewer.
[configuration]
entrypoint=api/configuration_schema.tcl

[config]
fields=show_point_numbers;show_scale_overlay;show_calibration_corners;snap_enabled;snap_radius;scale_edge;y_direction;scale_length;scale_unit;auto_catalog_check;verification_marker_size;verification_marker_width;verification_marker_color;publication_layout;publication_name_template;processing_compare;processing_sync_views;processing_show_curve_overlays;processing_live_preview;processing_filter_mode;canvas_background;image_opacity

[config.show_point_numbers]
type=boolean
label=Show point numbers
default=0
persistent_default=1
application=immediate
description=Point index labels overlaid on the source image.

[config.show_scale_overlay]
type=boolean
label=Show scale bar overlay
default=1
persistent_default=1
application=immediate
description=Display the image scale bar reference overlay.

[config.show_calibration_corners]
type=boolean
label=Show calibration corners
default=1
persistent_default=1
application=immediate
description=Display the four image calibration corner markers.

[config.snap_enabled]
type=boolean
label=Snap points to darkest pixel
default=0
persistent_default=1
application=immediate
description=Use the local darkest pixel when inserting or moving points.

[config.snap_radius]
type=integer
label=Snapping radius in pixels
default=3
persistent_default=1
application=immediate
description=Radius for the darkest-pixel search, from zero to 25 pixels.
min=0
max=25

[config.scale_edge]
type=choice
label=Scale bar tick reference
default=center
persistent_default=1
application=immediate
description=Default interpretation of the microscope scale bar endpoints.
values=center;inner;outer

[config.y_direction]
type=choice
label=Full image Y direction
default=Upward (Cartesian)
persistent_default=1
application=immediate
description=Default Y-axis direction for new full-image calibrations.
values=Upward (Cartesian);Downward (image pixels)

[config.scale_length]
type=double
label=Default scale bar length
default=10
persistent_default=1
application=immediate
description=Default physical length before detecting a new scale bar.
min=0.000000000001

[config.scale_unit]
type=choice
label=Default scale bar unit
default=µm
persistent_default=1
application=immediate
description=Unit shown before calibrating a new scale bar.
values=µm;nm;mm;cm;m;pm;Å;um;in;ft

[config.auto_catalog_check]
type=boolean
label=Automatic Dataset catalog refresh
default=1
persistent_default=1
application=immediate
description=Automatically check for Dataset catalog changes every five seconds.

[config.verification_marker_size]
type=integer
label=Calibration verification X size (screen pixels)
default=14
min=4
max=64
persistent_default=1
application=immediate

[config.verification_marker_width]
type=integer
label=Calibration verification X line width (screen pixels)
default=2
min=1
max=12
persistent_default=1
application=immediate

[config.verification_marker_color]
type=string
label=Calibration verification X color (#RRGGBB)
default=#ff3030
persistent_default=1
application=immediate
description=Hexadecimal color for the temporary calibration verification crosshair.

[config.publication_layout]
type=choice
label=Calibration publication layout
default=separate
values=separate;combined
persistent_default=1
application=immediate
description=Separate creates one Dataset per selected calibration; combined requires calibration-aware consumers and adds a calibration key column.

[config.publication_name_template]
type=string
label=Dataset naming template
validator=::GX::CurveDigitizerSettings::validateNameTemplate
default=[name].[calibration].curves
persistent_default=1
application=immediate
description=Tokens: [name], [calibration], [calibration_id], [configuration], [index], [mode]. See the Curve Digitalizer manual.

[config.processing_compare]
type=boolean
label=Compare original and processed images
default=0
persistent_default=1
application=immediate
description=Show original and processed raster in two resizable independent viewports while Image Processing is active.

[config.processing_sync_views]
type=boolean
label=Synchronize comparison pan and zoom
default=0
persistent_default=1
application=immediate
description=Keep both image viewports centered on the same source raster coordinate with matching magnification.

[config.processing_show_curve_overlays]
type=boolean
label=Show curve overlays in image comparison
default=1
persistent_default=1
application=immediate
description=Show read-only digitized curve point markers in both comparison viewports.

[config.processing_live_preview]
type=boolean
label=Automatically preview image processing
default=1
persistent_default=1
application=immediate
description=Debounce slider changes and update the processed image automatically when ImageMagick is available.

[config.processing_filter_mode]
type=choice
label=Image filter order mode
default=standard
values=standard;advanced
persistent_default=1
application=immediate
description=Standard uses a fixed order; Advanced permits reordering and preserves legacy repeated operations.

[config.canvas_background]
type=string
label=Default canvas background (#RRGGBB)
default=#303030
validator=::GX::CurveDigitizerSettings::validateCanvasColor
persistent_default=1
application=immediate
description=Default appearance for newly created Curve Digitalizer configurations. Each configuration keeps an independent override; scientific pixels remain unchanged.

[config.image_opacity]
type=integer
label=Default image opacity (%)
default=100
min=0
max=100
persistent_default=1
application=immediate
description=Default source opacity for newly created configurations. Current-configuration opacity is saved in its Interactive Document; overlays remain fully opaque.

[inputs]
contracts=image.raster

[outputs]
datasets=table.generic;curve_family.table;image.raster

[viewers]
api_version=1
ids=curve_digitizer

[viewer.curve_digitizer]
name=Curve Digitalizer
backend=curve_digitizer_tk
activation_api=CURVE_DIGITIZER_VIEWER_API_v1
capabilities=interactive;reviewed_physical_uncertainty;retained_uncertainty_factors;menu_navigation;viewer_settings;core_module_configuration;integrated_help;gx_markup_rendered_help;image_dataset;calibration;full_image_auto_calibration;scale_bar_calibration;calibration_manifest;linear_axes;log_axes;multiple_curves;undo_redo;session_persistence;dataset_publication;semantic_curve_columns;dataset_catalog_revision_watch;dataset_namespace_browser;canvas_namespace_picker;compact_source_toolbar;calibration_batch_transform;calibration_fingerprint;raster_point_columns;calibration_local_jacobian;calibration_repeated_measurements;calibration_measurement_manager;temporary_verification_marker;calibration_publication_multi_select;calibration_aware_combined_dataset;configurable_dataset_naming;image_processing;image_comparison_split_view;independent_pan_zoom;synchronized_pan_zoom;curve_edit_tab_guard;filter_sliders;standard_advanced_filter_order;geometry_preserving_enhancement;processed_image_publication;processed_image_public_api;script_bridge_image_processing;assisted_tracing;multi_guide_points;proposal_point_editing;proposal_segment_acceptance;local_segment_recalculation;grid_penalized_ridge_tracing;trace_processed_image;automatic_filter_suggestion;quality_diagnostics;canvas_appearance;configuration_local_canvas_appearance

[public_apis]
ids=CURVE_DIGITIZER_VIEWER_API_v1;CURVE_DIGITIZER_COMPANION_API_v1;CURVE_DIGITIZER_CALIBRATION_API_v1;CURVE_DIGITIZER_DATASET_SCHEMA_API_v1;CURVE_DIGITIZER_IMAGE_PROCESSING_API_v1;CURVE_DIGITIZER_QUALITY_API_v2;CURVE_DIGITIZER_UNCERTAINTY_API_v1

[public_api.CURVE_DIGITIZER_VIEWER_API_v1]
api_version=1
name=Curve Digitalizer Viewer backend
entrypoint=api/curve_digitizer_viewer_api_v1.tcl
namespace=::GX::CurveDigitizer
capabilities=viewer_backend;interactive_documents;dataset_metadata;unit_registry;semantic_registry;dataset_publication_v2;dataset_catalog_v1;dataset_namespace_v1


[public_api.CURVE_DIGITIZER_COMPANION_API_v1]
api_version=1
name=Curve Digitalizer Companion API
entrypoint=api/curve_digitizer_companion_api_v1.tcl
namespace=::GX::CurveDigitizerCompanion
capabilities=configuration_discovery;curve_context;source_integrity;pixel_point_commit;optimistic_concurrency

[public_api.CURVE_DIGITIZER_CALIBRATION_API_v1]
api_version=1
name=Curve Digitalizer Calibration Manifest API
entrypoint=api/curve_digitizer_calibration_api_v1.tcl
namespace=::GX::CurveDigitizerCalibration
capabilities=published_dataset_calibration;source_integrity;pixel_to_scientific_transform;scientific_to_pixel_transform;batch_transform;calibration_fingerprint;uncertainty_reporting;local_jacobian;scale_bar_provenance;typed_read;multiple_calibration_realizations;per_realization_transform

[public_api.CURVE_DIGITIZER_DATASET_SCHEMA_API_v1]
api_version=1
name=Curve Digitizer Published Dataset Schema API
entrypoint=api/curve_digitizer_dataset_schema_api_v1.tcl
namespace=::GX::CurveDigitizerDataset
capabilities=published_dataset_roles;curve_grouping;independent_curves;numerical_curve_families;raster_point_columns;read_raster_points;legacy_read

[public_api.CURVE_DIGITIZER_IMAGE_PROCESSING_API_v1]
api_version=1
name=Curve Digitalizer Processed Image Provenance API
entrypoint=api/curve_digitizer_image_processing_api_v1.tcl
namespace=::GX::CurveDigitizerImage
capabilities=processed_image_manifest;ordered_image_processing;geometry_preserved;verified_source_lineage;script_bridge_python;script_bridge_octave

[semantic_roles]
ids=curve_series_identifier;curve_series_label;curve_point_index;curve_raster_x;curve_raster_y;curve_point_identifier;uncertainty_standard_x;uncertainty_standard_y;uncertainty_covariance_xy

[semantic_role.curve_series_identifier]
label=Curve identifier
description=Opaque identifier grouping points into curves, regardless of user-facing names.
allowed_value_kinds=text

[semantic_role.curve_series_label]
label=Curve display name
description=Human-readable name of a curve, not suitable for stable grouping.
allowed_value_kinds=text

[semantic_role.curve_point_index]
label=Curve point order
description=Zero-based ordering of points inside a single curve.
allowed_value_kinds=number

[semantic_role.curve_raster_x]
label=Raster pixel X
description=Original source-image pixel-center X coordinate of a digitized point.
allowed_value_kinds=number

[semantic_role.curve_raster_y]
label=Raster pixel Y
description=Original source-image pixel-center Y coordinate of a digitized point.
allowed_value_kinds=number

[semantic_role.curve_point_identifier]
label=Original digitization point identity
description=Stable opaque point ID shared by all calibration realizations; group with calibration identifier when needed.
allowed_value_kinds=text

[semantic_role.uncertainty_standard_x]
label=Physical X standard uncertainty
description=Operator-declared and analytically propagated standard uncertainty in the X variable units.
allowed_value_kinds=number

[semantic_role.uncertainty_standard_y]
label=Physical Y standard uncertainty
description=Operator-declared and analytically propagated standard uncertainty in the Y variable units.
allowed_value_kinds=number

[semantic_role.uncertainty_covariance_xy]
label=Within-point physical XY covariance
description=Covariance within an XY point; units are the product of X and Y physical units.
allowed_value_kinds=number

[public_api.CURVE_DIGITIZER_QUALITY_API_v2]
api_version=2
name=Curve Digitizer Quality Diagnostics API
entrypoint=api/curve_digitizer_quality_api_v2.tcl
namespace=::GX::CurveDigitizerQuality
capabilities=published_quality_report_v2;source_integrity;per_curve_diagnostics;per_segment_raster_geometry;local_image_evidence;multi_calibration_population;script_bridge

[public_api.CURVE_DIGITIZER_UNCERTAINTY_API_v1]
api_version=1
name=Curve Digitizer Reviewed Physical Uncertainty API
entrypoint=api/curve_digitizer_uncertainty_api_v1.tcl
namespace=::GX::CurveDigitizerUncertainty
capabilities=published_physical_uncertainty;pixel_and_calibration_error_model;physical_override;low_rank_covariance_factors;core_numeric_propagation;core_statistical_semantics;managed_covariance_hdf5;fitter_gls_binding;script_bridge

