[meta]
api_version=1
id=viewer.curve_digitizer
kind=viewer
group=Viewers
name=Curve Digitalizer
version=1.2.4
selectable=0
default_enabled=1
core=1
runner=service
order=840
depends=math.numeric
description=GX-TXT-native interactive curve digitization from canonical Image Datasets with Session-persistent configurations and direct Dataset publication.
config_hint=Open from Viewers. The source is an Image Dataset in the current Session; digitization state is saved with the Session.

[inputs]
contracts=image.raster

[outputs]
datasets=table.generic;curve_family.table

[viewers]
api_version=1
ids=curve_digitizer

[viewer.curve_digitizer]
name=Curve Digitalizer
backend=curve_digitizer_tk
activation_api=CURVE_DIGITIZER_VIEWER_API_v1
capabilities=interactive;image_dataset;calibration;linear_axes;log_axes;multiple_curves;undo_redo;session_persistence;dataset_publication

[public_apis]
ids=CURVE_DIGITIZER_VIEWER_API_v1;CURVE_DIGITIZER_COMPANION_API_v1

[public_api.CURVE_DIGITIZER_VIEWER_API_v1]
api_version=1
name=Curve Digitalizer Viewer backend
entrypoint=api/curve_digitizer_viewer_api_v1.tcl
namespace=::GX::CurveDigitizer
capabilities=viewer_backend;interactive_documents;dataset_metadata;unit_registry;semantic_registry;dataset_publication_v2


[public_api.CURVE_DIGITIZER_COMPANION_API_v1]
api_version=1
name=Curve Digitalizer Companion API
entrypoint=api/curve_digitizer_companion_api_v1.tcl
namespace=::GX::CurveDigitizerCompanion
capabilities=configuration_discovery;curve_context;source_integrity;pixel_point_commit;optimistic_concurrency;uncertainty_review;publication_uncertainty;response_covariance_publication;script_bridge

[documentation]
api_version=1
guide=MANUAL.md
changelog=CHANGELOG.md
api_refs=VIEWER_PROVIDER_API_v1;INTERACTIVE_DOCUMENT_API_v1;DATASET_API_v1;DATASET_METADATA_API_v1;DATASET_VARIABLE_SCHEMA_API_v3;DATASET_PUBLICATION_API_v2;CONTRACT_REGISTRY_API_v1;UNIT_REGISTRY_API_v1;SEMANTIC_REGISTRY_API_v1;PLUGIN_INSTALL_API_v1;PLUGIN_HOST_INDEPENDENCE_RULE_v1

[statistical_results]
api_version=1
semantics_api=STATISTICAL_RESULT_SEMANTICS_API_v1
boundary=api/curve_digitizer_uncertainty_v1.tcl
publication_validation=::GX::CurveDigitizerCompanion::validateUncertaintyBinding
