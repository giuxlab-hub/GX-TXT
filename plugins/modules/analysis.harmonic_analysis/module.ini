[meta]
api_version=1
id=analysis.harmonic_analysis
kind=analysis
group=Generic analysis / Spectral
name=Harmonic Analysis
version=1.2.0
selectable=1
default_enabled=0
core=1
runner=standard_octave
order=340
depends=math.numeric
description=Dataset-native harmonic analysis of an existing linear amplitude spectrum. Generic grid/reduction operations use public NUMERIC_API_v1 and scientific result graphs are persistent plot.dataset variants.
config_hint=Use an existing spectrum.table Dataset such as the output of FFT Spectrum & Error Analysis. Bind Frequency and Amplitude, choose automatic or explicit fundamental detection, set the highest harmonic order and the local search half-width, then run. This module analyses the spectrum; it does not recompute an FFT. See MANUAL.md.

[inputs]
contracts=spectrum.table

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=spectrum.table

[bindings]
roles=frequency;amplitude

[binding.frequency]
label=Frequency
required=1
semantic_role=independent

[binding.amplitude]
label=Amplitude spectrum
required=1
semantic_role=measured

[outputs]
files=harmonic_analysis_metrics.ini;harmonic_analysis_report.txt;automatic_graphs.ini
datasets=table.generic

[config]
fields=fundamental_mode;fundamental_frequency;max_harmonic;search_half_width_bins;exclude_dc_bins;output_dataset_id

[config.fundamental_mode]
type=choice
label=Fundamental detection
default=auto_peak
values=auto_peak;explicit
required=1

[config.fundamental_frequency]
type=string
label=Explicit fundamental frequency (used only when mode = explicit)
default=
required=0

[config.max_harmonic]
type=integer
label=Highest harmonic order
default=10
required=1

[config.search_half_width_bins]
type=integer
label=Local harmonic search half-width [bins]
default=2
required=1

[config.exclude_dc_bins]
type=integer
label=Low-frequency bins excluded from automatic fundamental search
default=1
required=1

[config.output_dataset_id]
type=string
label=Harmonic result Dataset ID
default=harmonic_analysis.result
required=1

[automatic_graphs]
provider=plot.dataset
api=PLOT_DATASET_API_v2
persistent_variants=1
requires_capabilities=series_kind_bar

[runner]
script=plugins/modules/analysis.harmonic_analysis/runtime/analysis_harmonic_analysis.m

[documentation]
api_version=1
guide=MANUAL.md
api_refs=MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;DATASET_VARIABLE_SCHEMA_API_v3;TABLE_STREAM_API_v3;DATASET_PUBLICATION_API_v2;PROGRESS_API_v1;GRAPH_PROVIDER_API_v1;PLOT_DATASET_API_v2;NUMERIC_API_v1;PLUGIN_INSTALL_API_v1;SESSION_GENERATOR_LIBRARY_API_v1;UNIT_REGISTRY_API_v1;DOCUMENTATION_API_v1
examples=session_generators/gxtxt_numerical_examples_harmonic_analysis_1.0.0.zip
changelog=CHANGELOG.md

[statistical_results]
semantics_api=STATISTICAL_RESULT_SEMANTICS_API_v1
version=1
boundary=runtime/analysis_harmonic_analysis_main.m
