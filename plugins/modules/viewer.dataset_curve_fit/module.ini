[meta]
api_version=1
id=viewer.dataset_curve_fit
kind=viewer
group=Viewers
name=Dataset Curve Fit
version=0.46.0
selectable=0
default_enabled=1
core=0
runner=service
order=862
depends=math.numeric;curvefit.family_global
description=Fit canonical Dataset curves or physical z=f(x,y) surfaces through the public Numerical API and common CORE interpretation.
config_hint=Choose canonical Variables and a physical model; preview and accept. Use Fit > Physical surface fit for matched XYZ rows or Y-by-X grids.

[inputs]
contracts=table.generic;timeseries.table;curve_family.table

[outputs]
files=csv;dataset

[viewers]
