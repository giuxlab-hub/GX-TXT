backend=dataset_surface_fit_tk
activation_api=DATASET_CURVE_FIT_API_v1
capabilities=physical_surface_fitting;canonical_nd_source;retained_surface_queries;sampled_surface_publication;public_native3d_render;validated_statistics;workspace_history

[viewer.dataset_curve_fit]
