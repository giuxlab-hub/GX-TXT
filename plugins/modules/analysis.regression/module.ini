; GX-TXT production linear and polynomial regression.
; SPDX-License-Identifier: GPL-3.0-or-later
[meta]
api_version=1
id=analysis.regression
kind=analysis
group=Scientific Analysis
name=Regression
version=1.1.0
selectable=1
default_enabled=0
core=0
runner=standard_octave
order=490
depends=math.numeric
summary=Ordinary, weighted and polynomial regression with diagnostics and plots.
description=Fits selected numeric X/Y variables through public NUMERIC_API and publishes fit, coefficients, covariance and metrics.
config_hint=Choose X and Y, linear or polynomial fit, and an explicit weight model if a weight variable is supplied.
[inputs]
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table
[analysis_sources]
api_version=1
ids=primary
dynamic=0
[analysis_source.primary]
required=1
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table
[outputs]
files=regression_report.txt;regression_summary.ini;statistical_results.tcldict;automatic_graphs.ini
datasets=table.generic
[config]
fields=x_variable;y_variable;weight_variable;selection;fit_model;polynomial_degree;weight_model;noise_model;nonfinite_policy;rank_policy;output_dataset_prefix;render_graphs
[config.x_variable]
type=variable
label=Independent X variable
source=primary
required=1
[config.y_variable]
type=variable
label=Measured Y variable
source=primary
required=1
[config.weight_variable]
type=variable
label=Statistical weight or measurement uncertainty (optional)
source=primary
required=0
[config.selection]
type=selection
label=Data selection (optional X interval)
source_role=primary
selection_types=x_range;rectangle
required=0
[config.fit_model]
type=choice
label=Regression model
default=linear
values=linear;polynomial
required=1
[config.polynomial_degree]
type=integer
label=Polynomial degree (polynomial mode)
default=2
[config.weight_model]
type=choice
label=Explicit weight semantics
default=none
values=none;statistical_weight;inverse_variance_uncertainty
required=1
[config.nonfinite_policy]
type=choice
label=NaN / Inf policy
default=omit
values=omit;error
required=1
[config.noise_model]
type=choice
label=Measurement noise assumption (required for chi-squared interpretation)
default=unspecified
values=unspecified;independent_gaussian_known_sigma
required=1
[config.rank_policy]
type=choice
label=Rank-deficient fit policy
default=error
values=error;minimum_norm
required=1
[config.output_dataset_prefix]
type=string
label=Output Dataset ID prefix
default=analysis.regression
required=1
[config.render_graphs]
type=boolean
label=Create fit and residual graphs
default=1
required=1
[runner]
script=plugins/modules/analysis.regression/runtime/analysis_regression.m
[documentation]
api_version=1
guide=MANUAL.md
api_refs=STATISTICAL_RESULT_SEMANTICS_API_v1;MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;ANALYSIS_SOURCE_ACCESS_RUNTIME_v2;DATASET_SELECTION_API_v1;TABLE_STREAM_API_v3;DATASET_PUBLICATION_API_v2;NUMERIC_API_v1;UNIT_REGISTRY_API_v1;PLOT_DATASET_API_v2
changelog=CHANGELOG.md

[statistical_results]
publication_required=1
semantics_api=STATISTICAL_RESULT_SEMANTICS_API_v1
boundary=runtime/analysis_regression_main.m
publication_validator=CORE datasetPublicationV2Prepare
