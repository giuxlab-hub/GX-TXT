[meta]
api_version=1
id=viewer.nmr_multidimensional
kind=viewer
group=Viewers
name=Multidimensional NMR Viewer
version=1.0.0
selectable=0
default_enabled=1
core=0
runner=service
order=859
depends=acq.nmr_multidimensional
description=Dedicated 2-D contour and true 3-D orthogonal-slice NMR workbench with ppm crosshair, projections and Dataset extraction.
config_hint=Open an acquired NMRPipe Dataset; choose the F-axis plane, navigate coordinates, inspect peaks and publish a profile or plane.

[inputs]
contracts=spectrum.nmr_multidimensional

[outputs]
datasets=table.generic

[viewers]
api_version=1
ids=nmr_multidimensional

[viewer.nmr_multidimensional]
name=Multidimensional NMR Viewer
backend=nmr_multidimensional_tk
backend_script=runtime/viewer_backend.tcl
capabilities=contour;positive_negative;crosshair;slices;projections;orthogonal_3d_planes;dataset_publication;session_persistence;source_provenance

[documentation]
api_version=1
guide=README.md
api_refs=VIEWER_PROVIDER_API_v1;DATASET_PUBLICATION_API_v2;DATASET_METADATA_API_v1
