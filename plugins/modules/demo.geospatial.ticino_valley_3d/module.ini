[meta]
api_version=1
id=demo.geospatial.ticino_valley_3d
kind=analysis
group=Scientific demonstrations / Geospatial
name=Ticino Valley 3D Cartography Demo
version=2.0.0
selectable=1
default_enabled=0
core=0
runner=standard_octave
order=796
depends=math.numeric;plot.dataset
description=Offline public Plot.dataset views of Ticino terrain, river, settlements, population, four land-cover fractions, and explicitly synthetic hydraulics.
config_hint=Generate the Ticino Valley 3D Session, import its four raw CSVs as table.generic Datasets with IDs ticino_valley_grid, ticino_river_centerline, ticino_valley_settlements, and ticino_hydraulic_demo, then select them as the four Analysis Sources.

[inputs]
contracts=table.generic

[analysis_sources]
api_version=1
ids=primary;river;settlements;hydraulic
dynamic=0

[analysis_source.primary]
required=1
contracts=table.generic
dataset_id=ticino_valley_grid

[analysis_source.river]
required=1
contracts=table.generic
dataset_id=ticino_river_centerline

[analysis_source.settlements]
required=1
contracts=table.generic
dataset_id=ticino_valley_settlements

[analysis_source.hydraulic]
required=1
contracts=table.generic
dataset_id=ticino_hydraulic_demo

[outputs]
files=ticino_valley_report.txt;ticino_valley_metrics.ini;render_cache.mat

[render_cache]
api_version=1
rerender_from_cache=1

[graphs]
provider_api_version=1
ids=demo.geospatial.ticino_valley_3d.terrain;demo.geospatial.ticino_valley_3d.river;demo.geospatial.ticino_valley_3d.settlements;demo.geospatial.ticino_valley_3d.population;demo.geospatial.ticino_valley_3d.landcover_built;demo.geospatial.ticino_valley_3d.landcover_forest;demo.geospatial.ticino_valley_3d.landcover_agriculture;demo.geospatial.ticino_valley_3d.landcover_water;demo.geospatial.ticino_valley_3d.hydraulic
default_ids=demo.geospatial.ticino_valley_3d.terrain;demo.geospatial.ticino_valley_3d.river;demo.geospatial.ticino_valley_3d.settlements;demo.geospatial.ticino_valley_3d.population;demo.geospatial.ticino_valley_3d.landcover_built;demo.geospatial.ticino_valley_3d.landcover_forest;demo.geospatial.ticino_valley_3d.landcover_agriculture;demo.geospatial.ticino_valley_3d.landcover_water;demo.geospatial.ticino_valley_3d.hydraulic
rerender=standard_octave

