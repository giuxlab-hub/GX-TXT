[meta]
api_version=1
id=analysis.statistics.correlation
kind=analysis
group=Statistics
name=Covariance and Correlation
version=1.0.1
selectable=1
default_enabled=0
core=0
runner=standard_octave
order=430
depends=math.numeric
summary=Pairwise covariance, Pearson and Spearman correlation for numeric Dataset variables.
description=Reads stable Dataset variables through Analysis Source and Table Stream APIs, applies an optional Dataset Selection and explicit pairwise or listwise missing-data policy, and publishes a pair table and persistent correlation heatmap.
config_hint=Select at least two numeric variables, choose pairwise or listwise missing-data handling, then run.

[inputs]
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table

[outputs]
files=correlation_report.txt;correlation_summary.ini;automatic_graphs.ini
datasets=table.generic

[config]
fields=variables;selection;missing_policy;nonfinite_policy;output_dataset_id;render_graphs

[config.variables]
type=table
dynamic=1
label=Variables
min_rows=2
columns=variable

[config.variables.variable]
type=variable
label=Numeric variable
source=primary
required=1

[config.selection]
type=selection
label=Data selection (optional X interval)
required=0
source_role=primary
selection_types=x_range;rectangle

[config.missing_policy]
type=choice
label=Missing-pair policy
default=pairwise
values=pairwise;listwise
required=1

[config.nonfinite_policy]
type=choice
label=NaN / Inf policy
default=omit
values=omit;error
required=1

[config.output_dataset_id]
type=string
label=Pairwise results Dataset ID
default=statistics.correlation.pairs
required=1

[config.render_graphs]
type=boolean
label=Create correlation heatmap
default=1
required=1

[runner]
script=plugins/modules/analysis.statistics.correlation/runtime/analysis_statistics_correlation.m

[documentation]
api_version=1
guide=MANUAL.md
api_refs=MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;ANALYSIS_SOURCE_ACCESS_RUNTIME_v2;DATASET_VARIABLE_SCHEMA_API_v3;DATASET_SELECTION_API_v1;REPEATABLE_CONFIG_API_v1;TABLE_STREAM_API_v3;DATASET_PUBLICATION_API_v2;DATASET_PUBLICATION_V2_OCTAVE_BINDING;NUMERIC_API_v1;UNIT_REGISTRY_API_v1;PLOT_DATASET_API_v2;PLOT_DATASET_OCTAVE_BRIDGE_v1
changelog=CHANGELOG.md
