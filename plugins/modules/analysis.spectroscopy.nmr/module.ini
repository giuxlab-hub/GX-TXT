[meta]
api_version=1
id=analysis.spectroscopy.nmr
kind=analysis
group=Generic analysis / Spectral
name=NMR Spectrum Analysis
version=1.0.0
selectable=1
default_enabled=1
core=0
runner=standard_octave
order=355
depends=math.numeric
description=Analyze measured one-dimensional NMR Datasets with explicit baseline, normalization, peak and integration settings.
config_hint=Bind chemical shift and intensity, choose a ppm region and integration bounds, and review phase/reference metadata before interpreting peaks.

[inputs]
contracts=spectrum.scientific

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=spectrum.scientific

[bindings]
roles=spectral_x;spectral_y

[binding.spectral_x]
label=Chemical shift [ppm]
required=1
semantic_role=independent

[binding.spectral_y]
label=Measured NMR intensity
required=1
semantic_role=measured

[outputs]
files=nmr_analysis_report.txt
datasets=spectrum.scientific;table.generic

[config]
fields=region_min_ppm;region_max_ppm;baseline_method;peak_min_prominence;peak_min_distance_ppm;peak_search_max_points;integrate_min_ppm;integrate_max_ppm;max_analysis_points

[config.region_min_ppm]
type=number
label=Lower chemical shift [ppm]
default=-5
required=1

[config.region_max_ppm]
type=number
label=Upper chemical shift [ppm]
default=220
required=1

[config.baseline_method]
type=choice
label=Baseline
default=linear
values=none;constant;linear
required=1

[config.peak_min_prominence]
type=number
label=Peak prominence [normalized]
default=0.05
required=1

[config.peak_min_distance_ppm]
type=number
label=Minimum peak separation [ppm]
default=0.15
required=1

[config.peak_search_max_points]
type=integer
label=Peak search samples (extrema preserving)
default=8192
required=1

[config.integrate_min_ppm]
type=number
label=Integration lower bound [ppm]
default=0
required=1

[config.integrate_max_ppm]
type=number
label=Integration upper bound [ppm]
default=220
required=1

[config.max_analysis_points]
type=integer
label=Maximum analysis samples (full-resolution default)
default=131072
required=1

[runner]
script=plugins/modules/analysis.spectroscopy.nmr/runtime/analysis_spectroscopy_nmr.m

[documentation]
api_version=1
guide=README.md
api_refs=SCIENTIFIC_SPECTRUM_API_v1;NUMERIC_API_v1;DATASET_PUBLICATION_API_v2;PLOT_DATASET_API_v3
