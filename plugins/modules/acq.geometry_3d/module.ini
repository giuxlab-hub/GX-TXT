[meta]
api_version=1
id=acq.geometry_3d
kind=acquisition
group=Acquisition / 3D Geometry
name=3D Geometry Import
version=1.1.0
selectable=1
default_enabled=1
core=0
runner=standard_tcl
order=157
depends=
description=Imports STL, OBJ, STEP/STP, VTU, VTP and VTI sources as independent canonical Datasets, preserving original bytes and structured geometry or scalar-grid metadata. No viewer or native CAD library is required for import.
config_hint=Select one or more 3D sources and edit their Dataset IDs in the standard batch table. Geometry is not converted to CSV. VTI is opened with an explicit scalar array and isovalue in Native 3D.

[inputs]
contracts=raw.geometry

[outputs]
datasets=geometry.mesh;model.cad;field.scalar_3d
files=datasets/*;metadata/datasets.ini;metadata/datasets/*

[contracts]
provided=geometry.mesh;model.cad;field.scalar_3d

[contract.geometry.mesh]
description=Opaque source-preserving serialized mesh or unstructured grid. The Dataset format selects the reader; geometry/field arrays are not tabular Dataset variables. Validation scope and format metadata are explicit.

[contract.model.cad]
description=Opaque source-preserving CAD exchange model. CAD entities and embedded units remain in the original payload; no tessellation or geometry decoding is implied by acquisition.

[contract.field.scalar_3d]
description=Opaque source-preserving regular 3D scalar grid with origin, spacing, extent and array declarations. The VTI payload remains authoritative; values are decoded by the native VTK reader.

[config]
fields=dataset_id

[config.dataset_id]
type=string
label=Default Dataset ID
default=geometry.model
required=1

[runner]
handler=geometry_3d

[acquisition_handler]
api_version=1
script=runtime/acquisition_handler.tcl
inspect_proc=::AcqGeometry3D::inspect
import_proc=::AcqGeometry3D::import
begin_proc=::AcqGeometry3D::begin
step_proc=::AcqGeometry3D::step
cancel_proc=::AcqGeometry3D::cancel
dataset_preview_proc=::AcqGeometry3D::datasetPreview
file_label=3D geometry and VTK XML files
file_patterns=*.stl;*.STL;*.obj;*.OBJ;*.step;*.STEP;*.stp;*.STP;*.vtu;*.VTU;*.vtp;*.VTP;*.vti;*.VTI
supports_batch=1
source_kind=binary
variable_mapping=none
capabilities=batch;progress;dataset_preview;cooperative_async;cancellation
formats=geometry3d.stl;geometry3d.obj;geometry3d.step;geometry3d.vtu;geometry3d.vtp;geometry3d.vti

; The declaration below is generated from portable/formats.json by the build
; tool. It is static installer metadata, not a private runtime registry.
[acquisition_format.geometry3d.stl]
description=STL triangle mesh
mime=application/sla
extensions=*.stl
canonical_formats=stl

[acquisition_format.geometry3d.obj]
description=Wavefront OBJ geometry
mime=model/obj
extensions=*.obj
canonical_formats=obj

[acquisition_format.geometry3d.step]
description=STEP CAD model
mime=model/step
extensions=*.step;*.stp
canonical_formats=step

[acquisition_format.geometry3d.vtu]
description=VTK XML unstructured grid
mime=application/vnd.vtk
extensions=*.vtu
canonical_formats=vtu

[acquisition_format.geometry3d.vtp]
description=VTK XML polydata
mime=application/vnd.vtk
extensions=*.vtp
canonical_formats=vtp

[acquisition_format.geometry3d.vti]
description=VTK XML 3D scalar image
mime=application/vnd.vtk
extensions=*.vti
canonical_formats=vti

[documentation]
api_version=1
guide=MANUAL.md
changelog=CHANGELOG.md
api_refs=MODULE_API_v1;ACQUISITION_HANDLER_PLUGIN_API_v1;DATASET_METADATA_API_v1;PREVIEW_DESCRIPTOR_API_v1;PLUGIN_INSTALL_API_v1;CONTRACT_REGISTRY_API_v1
