[meta]
api_version=1
id=analysis.definition_demo
kind=analysis
group=Generic analysis / API examples
name=Scientific Analysis API Demo
version=1
selectable=1
default_enabled=0
enabled_key=
run_key=
runner=standard_octave
order=900
depends=
description=Small reference plugin showing how a module can delegate tabular calculations, comparison, normalization, export and plotting to Scientific Analysis Definition API v1.
config_hint=Import an analog_chain_comparison.csv file as a generic table dataset (contract table.generic), select the example definition and run. The module runtime itself contains no scientific implementation.

[inputs]
contracts=table.generic
default_dataset=ir.chain.summary

[outputs]
files=analysis_result.csv;analysis_summary.txt;01_analysis_definition_demo.png;render_cache.mat

[render_cache]
api_version=1
rerender_from_cache=0

[graphs]
provider_api_version=1
ids=analysis.demo.ir_chain
default_ids=analysis.demo.ir_chain
rerender=

[graph.analysis.demo.ir_chain]
name=Scientific Analysis API example
file=01_analysis_definition_demo.png
default_enabled=1
supports_legend=1
legend_editor=standard
legend_placements=inside;above;below;left;right;manual
legend_layouts=row;stacked;wrapped
config_fields=title

[graph.analysis.demo.ir_chain.config.title]
type=string
label=Plot title
default=Scientific Analysis API example - IR analog chain

[runner]
script=plugins/modules/analysis.definition_demo/runtime/analysis_definition_demo.m
rerender_script=

[config]
fields=dataset_id;analysis_definition_id

[config.dataset_id]
type=dataset
label=Input table dataset
default=ir.chain.summary
required=1
contract=table.generic

[config.analysis_definition_id]
type=analysis_definition
label=Analysis definition
default=example.ir_chain_metrics_v1
required=1
scope=all
kind=tabular
capabilities=expression;compare;normalize;plot;export

[documentation]
api_version=1
guide=README.md
api_refs=MODULE_API_v1;SCIENTIFIC_ANALYSIS_DEFINITION_API_v1;RENDER_CACHE_API_v1
examples=
changelog=
