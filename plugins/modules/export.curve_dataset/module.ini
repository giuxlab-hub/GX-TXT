[meta]
api_version=1
id=export.curve_dataset
kind=export
group=Export
name=Scientific Curve Dataset Publisher
version=1.0.0
selectable=1
default_enabled=1
core=0
runner=service
order=867
description=Publish one frozen exact Curve Source as an independent canonical Dataset.
[extensions]
api_version=1
ids=publish
[extension.publish]
name=Publish selected as Dataset…
category=utility
workbenches=viewer.curve_viewer
selection_kinds=curve_source
mutates=0
public_api=CURVE_DATASET_EXPORT_API_v1
command=::GX::CurveDatasetExport::publish
required_apis=CURVE_SOURCE_API_v1;DATASET_PUBLICATION_API_v2
parameters=dataset_id;display_name
[extension.publish.parameter.dataset_id]
type=string
label=Output Dataset ID (create only)
required=1
[extension.publish.parameter.display_name]
type=string
label=Display name (optional)
default=
[public_apis]
ids=CURVE_DATASET_EXPORT_API_v1
[public_api.CURVE_DATASET_EXPORT_API_v1]
public_contract=schema gxtxt.public_api_documentation.v1 purpose {Current live Workbench Extension invocation; frozen exact Curve Source descriptor/request, Session token and Document generation/revision must agree. Publish creates a new canonical Dataset and does not modify the source Viewer.} context {Inert provider-owned trusted-host documentation only. No provider activation, scientific work, Script/SDK authorization or generic invocation is granted.} operations {apiInfo {command ::GX::CurveDatasetExport::apiInfo arguments {} parameters {} result {type dictionary description {API/version/provider and exact-source publication capability description.}} context {trusted host service. Metadata/capability inspection of the already loaded public owner. No scientific Dataset or active GUI is required by this metadata method; capabilities do not establish language admission or runtime availability.}} publish {command ::GX::CurveDatasetExport::publish arguments context parameters {context {type {Workbench Extension invocation dictionary} description {Host-captured document_id/workbench_id/revision/parameters and curve_source selection containing frozen descriptor/request/Session token/Document generation.}}} result {type {publication receipt dictionary} description {status ok, dataset_id, canonical receipt, exact_rows and provenance after create-only finalize.}} context {trusted host service. Current live Workbench Extension invocation; frozen exact Curve Source descriptor/request, Session token and Document generation/revision must agree. Publish creates a new canonical Dataset and does not modify the source Viewer.}}}
api_version=1
name=Exact scientific Curve Source publication
entrypoint=api/curve_dataset_export_api_v1.tcl
namespace=::GX::CurveDatasetExport
capabilities=exact_curve_source;canonical_publication;source_lineage;create_only
[documentation]
api_version=1
guide=MANUAL.md
api_refs=CURVE_SOURCE_API_v1;DATASET_TRANSFORM_API_v1;DATASET_PUBLICATION_API_v2;WORKBENCH_EXTENSION_API_v1;UNIT_REGISTRY_API_v1;CURVE_DATASET_EXPORT_API_v1
