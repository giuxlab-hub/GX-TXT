[meta]
api_version=1
id=demo.numeric.root_finding
kind=analysis
group=Generic analysis / Numerical examples
name=Numerical Root Finding Demo
version=1.0.2
selectable=1
default_enabled=0
core=0
enabled_key=
run_key=
runner=standard_octave
order=792
depends=math.numeric
description=External reference module demonstrating Dataset-aware public interpolation composed with the public NUMERIC_API_v1 callback-based root solver, canonical root publication and plot.dataset visualization.
config_hint=Use the Root Finding Session Generator, import raw/root_finding.csv as table.generic, bind X and f(X), keep or edit the explicit root-search intervals, then run.

[inputs]
contracts=table.generic

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=table.generic

[bindings]
roles=x;function

[binding.x]
label=Independent X variable
required=1
semantic_role=independent

[binding.function]
label=Function Y variable
required=1

[outputs]
files=root_finding_metrics.ini;root_finding_report.txt
datasets=table.generic

[runner]
script=plugins/modules/demo.numeric.root_finding/runtime/demo_numeric_root_finding.m

[config]
fields=selection;nonfinite_policy;interpolation_method;search_intervals;tolerance;max_iterations;output_dataset_id

[config.selection]
type=selection
label=Data selection (optional X interval)
required=0
source_role=primary
selection_types=x_range

[config.nonfinite_policy]
type=choice
label=NaN / Inf policy
default=error
values=error;omit
required=1

[config.interpolation_method]
type=choice
label=Public interpolation method
default=linear
values=linear;pchip;spline
required=1

[config.search_intervals]
type=string
label=Explicit root-search intervals
default=-3,-1;0,1;2,4
required=1

[config.tolerance]
type=double
label=Root solver absolute X tolerance
default=1e-10
required=1

[config.max_iterations]
type=integer
label=Maximum root-solver iterations
default=400
required=1

[config.output_dataset_id]
type=string
label=Root result Dataset ID
default=demo.numeric.root_finding.roots
required=1

[documentation]
api_version=1
guide=MANUAL.md
api_refs=MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;DATASET_METADATA_API_v1;DATASET_SELECTION_API_v1;DATASET_VARIABLE_SCHEMA_API_v3;TABLE_STREAM_API_v3;DATASET_PUBLICATION_API_v2;NUMERIC_API_v1;PROGRESS_API_v1;PLOT_DATASET_API_v2;PLOT_DATASET_OCTAVE_BRIDGE_v1;PLUGIN_INSTALL_API_v1;SESSION_GENERATOR_LIBRARY_API_v1;UNIT_REGISTRY_API_v1;DOCUMENTATION_API_v1
examples=session_generators/gxtxt_numerical_examples_root_finding_1.0.0.zip
changelog=CHANGELOG.md
