[meta]
api_version=1
id=viewer.scientific_image_inspector
kind=viewer
group=Viewers
name=Scientific Image Inspector
version=0.4.2
selectable=1
default_enabled=0
core=0
runner=service
order=848
depends=
description=Workspace-specific sidebar, ROI context operations, Basic and Advanced non-destructive image editor and article figure studio, with Native2D viewport, annotations, multi-panel composition and ImageMagick processing.
config_hint=Open from Viewers with a blank canvas; choose an image.raster Dataset or open a named Workspace. Nothing loads automatically.

[config]
fields=sidebar_tabs;annotation_coordinates

[config.sidebar_tabs]
type=string
label=Stacked Image Inspector sidebar panels
default=simple,figure
persistent_default=1
application=immediate
description=Initial sidebar defaults for new Workspace drafts; opening a named Workspace restores its saved visible sections.

[workspaces]
ids=scientific_image_inspector

[workspace.scientific_image_inspector]
entrypoint=api/workspace_provider.tcl
type=Scientific Image Inspector
schema=scientific_image_inspector.recipe
version=1.0
validate=::GX::SII::workspaceValidate
open=::GX::SII::workspaceProviderOpen

[inputs]
contracts=image.raster

[outputs]
datasets=image.raster

[viewers]
api_version=1
ids=scientific_image_inspector

[viewer.scientific_image_inspector]
name=Scientific Image Inspector
backend=scientific_image_inspector_tk
activation_api=SCIENTIFIC_IMAGE_INSPECTOR_API_v1
capabilities=basic_editor;advanced_editor;task_presets;image_dataset;metadata;roi;histogram;pixel;operation_catalog;non_destructive;undo_redo;explicit_publication;interactive_documents;native2d_viewport;article_figures;annotations;publication_manifest;single_canvas
short_title=Image Inspector
semantic_group=images
group_title=Imaging & Documents
icon=icons/scientific_image_inspector.png

[public_apis]
ids=SCIENTIFIC_IMAGE_INSPECTOR_API_v1

[public_api.SCIENTIFIC_IMAGE_INSPECTOR_API_v1]
public_contract=schema gxtxt.public_api_documentation.v1 purpose {Inspect the existing public Scientific Image Inspector metadata and documented retained-manifest/catalog dispatch. Reading this inert documentation does not activate or execute the provider.} context {Trusted Tcl host where the existing provider is already loaded. No Python/Octave Script Bridge registration or direct C++ SDK wrapper is established. Current Session, canonical files and configured ImageMagick are required where the existing manual says so; gui_required=0 does not remove those requirements.} operations {apiInfo {command ::GX::SII::apiInfo arguments {} parameters {} result {type APIMetadataDictionary description {api_id, manifest_schema scientific_image_inspector.manifest.v1, operations {manifest_get manifest_summary annotations_json inspect catalog capabilities}, gui_required 0. This return declares neither api_version nor machine-readable argument/result schemas.}} context {Existing loaded trusted Tcl provider; this metadata call does not expose lazy GUI callbacks or authorize Script/SDK access.}} apiCall {command ::GX::SII::apiCall arguments {operation args} parameters {operation {type DocumentedOperationID description {Exactly the documented dispatch names: manifest_get, manifest_summary, annotations_json, inspect, catalog, capabilities. Unknown operations raise Tcl errors.}} args {type TclArgumentList description {manifest_get/manifest_summary/annotations_json/inspect: exactly one dataset_id. catalog: optional query, default empty; native catalogList arity rejects extra arguments. capabilities: no arguments needed; current dispatcher ignores extra arguments.}}} result {type OperationSpecificValue description {manifest_get: validated retained manifest dictionary. manifest_summary: dictionary dataset_id/schema/sources/operation_count/panel_count/annotation_count/output/workspace_id. annotations_json: scientific_image_inspector.annotations.v1 JSON Tcl string in top-left-origin image pixels. inspect: current raster/container/engine facts. catalog: sorted operation specification list filtered case-insensitively in ID/family/label/about. capabilities: raw engine version/formats/colorspaces/channels/filters/policy/delegates text dictionary; cached help text is not returned.}} context {Trusted loaded Tcl provider. The first retained Dataset operations require the current Session and canonical files. inspect and capabilities execute configured ImageMagick processes; this documentation is not an inert runtime-availability guarantee. Wrong fixed arities raise Tcl errors. No Script Bridge/SDK grant or generic foreign-host invocation is introduced.}}}
api_version=1
name=Scientific Image Inspector API
entrypoint=api/scientific_image_inspector_api_v1.tcl
namespace=::GX::SII
capabilities=viewer_backend;image_inspection;operation_discovery;validated_processing;histograms;dataset_publication;manifest_lookup

[documentation]
api_version=1
guide=MANUAL.md
changelog=CHANGELOG.md
api_refs=VIEWER_PROVIDER_API_v1;DATASET_FILE_PUBLICATION_API_v1;DATASET_METADATA_API_v1;SESSION_INSPECTION_API_v1;INTERACTIVE_DOCUMENT_API_v1;SESSION_WORKSPACE_API_v1;CONFIGURATION_API_v1;DOCUMENTATION_API_v1;MODULE_API_v1

[config.annotation_coordinates]
type=boolean
label=Show exact annotation coordinates
default=0
persistent_default=1
application=immediate
description=Show numerical image-pixel fields in the Annotation editor only when requested.
