[meta]
api_version=1
id=viewer.curve_viewer
kind=viewer
group=Viewers
name=Curve Viewer
version=0.4.1
selectable=0
default_enabled=1
core=0
runner=service
order=860
description=Read-only additive Dataset curve presentation through the shared Curve Source and Native2D authorities.

[inputs]
contracts=table.generic;timeseries.table;curve_family.table

[viewers]
api_version=1
ids=curve_viewer

[viewer.curve_viewer]
name=Curve Viewer
backend=curve_viewer_tk
activation_api=CURVE_VIEWER_API_v1
capabilities=read_only;multi_source;source_identity;bounded_display;exact_preview;native2d_presentation;zoom_pan;session_persistence
short_title=Curve Viewer
semantic_group=curves
group_title=Curves & Digitization
icon=icons/curve_viewer.png

[public_apis]
ids=CURVE_VIEWER_API_v1

[public_api.CURVE_VIEWER_API_v1]
public_contract=schema gxtxt.public_api_documentation.v1 purpose {Existing trusted Tk/Native2D source Viewer and current Session/Document lifetime. Source tokens/native display ownership stay with the owning host; source payloads remain read-only. GUI callbacks are not generic Script/SDK access.} context {Inert provider-owned trusted-host documentation only. No provider activation, scientific work, Script/SDK authorization or generic invocation is granted.} operations {datasetIds {command ::GX::CurveViewer::datasetIds arguments {} parameters {} result {type {list of Dataset ID strings} description {Registry heuristic: at least two rank-one nonliteral-string Variables; not complete numeric admission.}} context {trusted host service. Existing trusted Tk/Native2D source Viewer and current Session/Document lifetime. Source tokens/native display ownership stay with the owning host; source payloads remain read-only. GUI callbacks are not generic Script/SDK access.}} open {command ::GX::CurveViewer::open arguments {{context {}}} parameters {context {type {Viewer open-context dictionary} description {Provider-specific existing Workspace/Document/Dataset selection fields described in this operation context; no direct source path or arbitrary callback.}}} result {type {Tk window path} description {.curve_viewer opened/reused; may begin asynchronous saved-source restore.}} context {trusted host service. Existing trusted Tk/Native2D source Viewer and current Session/Document lifetime. Source tokens/native display ownership stay with the owning host; source payloads remain read-only. GUI callbacks are not generic Script/SDK access.}} viewerDispatch {command ::GX::CurveViewer::viewerDispatch arguments {action scene} parameters {action {type {Viewer lifecycle action string} description {Actual backend operation; open/rerender support or ignored action semantics are explicitly stated by this operation.}} scene {type {resolved Viewer scene dictionary} description {Host-supplied Viewer scene; only documented open_context fields are consumed, or explicitly ignored by this backend.}}} result {type {Tk window path} description {Returns open result for open/rerender using scene.open_context.}} context {trusted host service. Existing trusted Tk/Native2D source Viewer and current Session/Document lifetime. Source tokens/native display ownership stay with the owning host; source payloads remain read-only. GUI callbacks are not generic Script/SDK access.}} snapshot {command ::GX::CurveViewer::snapshot arguments w parameters {w {type {owned Tk Viewer window path} description {Existing provider-owned live window/state; a callback argument does not create standalone foreign-window authority.}}} result {type {Native2D presentation snapshot dictionary} description {Existing shared NATIVE2D_PRESENTATION_SNAPSHOT_v1 device/display snapshot with real axis labels/units/legend; not full canonical arrays.}} context {owning Viewer presentation callback. Existing trusted Tk/Native2D source Viewer and current Session/Document lifetime. Source tokens/native display ownership stay with the owning host; source payloads remain read-only. GUI callbacks are not generic Script/SDK access.}} add {command ::GX::CurveViewer::add arguments {w record {token ""} {prepared {}}} parameters {w {type {owned Tk Viewer window path} description {Existing provider-owned live window/state; a callback argument does not create standalone foreign-window authority.}} record {type {frozen Curve Source definition dictionary} description {Owning Curve Viewer source record including logical ID/request/name/style/visibility and actual frozen source/display identity.}} token {type {owned Curve Source token or empty string} description {Optional live canonical source token consumed by the owning Viewer on success; no foreign raw handle permission.}} prepared {type {host-owned display/cache-restore dictionary or empty} description {Optional actual prepared source display; any native display ID must already belong to this exact Viewer scene. Not a generic Script input.}}} result {type {logical source-record ID string} description {Adopts exact source/display record in existing owned Viewer; successful token/native display ownership transfers to that host. Initial scope failure precedes token cleanup.}} context {owning Viewer source-adoption callback. Existing trusted Tk/Native2D source Viewer and current Session/Document lifetime. Source tokens/native display ownership stay with the owning host; source payloads remain read-only. GUI callbacks are not generic Script/SDK access.}}}
api_version=1
name=Read-only Curve Viewer
entrypoint=api/curve_viewer_api_v1.tcl
namespace=::GX::CurveViewer
capabilities=read_only;curve_source;native2d_presentation;interactive_document

[documentation]
api_version=1
guide=MANUAL.md
api_refs=CURVE_SOURCE_API_v1;DATASET_PREVIEW_API_v1;DATASET_CATALOG_v1;INTERACTIVE_DOCUMENT_API_v1;SESSION_WORKSPACE_API_v1;DATASET_SCIENTIFIC_PROFILE_API_v1;WORKBENCH_EXTENSION_API_v1;CURVE_VIEWER_API_v1

[workspaces]
api_version=1
ids=curve_viewer
[workspace.curve_viewer]
entrypoint=api/workspace_provider.tcl
type=Curve Viewer
schema=gxtxt.curve_viewer.viewer
version=1.0
validate=::GX::CurveViewer::workspaceValidate
open=::GX::CurveViewer::workspaceOpen

[configuration]
api_version=1
entrypoint=api/curve_viewer_settings.tcl
[config]
fields=shortcuts;labels;history_strip
[config.shortcuts]
configuration_id=modules.curve_viewer.shortcuts
type=string
label=Command shortcuts
default=
persistent_default=1
application=immediate
validator=::GX::CurveViewer::_shortcutsValidate
structured_fields=::GX::CurveViewer::_shortcutFields
[config.labels]
configuration_id=modules.curve_viewer.labels
type=string
label=Legend and automatic labels
default=
persistent_default=1
application=immediate
validator=::GX::CurveViewer::_labelValidate
structured_fields=::GX::CurveViewer::_labelFields
description=Presentation-only automatic labels and legend visibility. Manual per-curve labels remain in the current Workspace.
[config.history_strip]
configuration_id=modules.curve_viewer.history_strip
type=string
label=Description / History strip
default=
persistent_default=1
application=immediate
validator=::GX::scientificHistoryStripValidate
structured_fields=::GX::scientificHistoryStripFields
