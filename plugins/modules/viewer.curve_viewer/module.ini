[meta]
api_version=1
id=viewer.curve_viewer
kind=viewer
group=Viewers
name=Curve Viewer
version=0.4.0
selectable=0
default_enabled=1
core=0
runner=service
order=860
description=Read-only additive Dataset curve presentation through the shared Curve Source and Native2D authorities.

[inputs]
contracts=table.generic;timeseries.table;curve_family.table

[viewers]
api_version=1
ids=curve_viewer

[viewer.curve_viewer]
name=Curve Viewer
backend=curve_viewer_tk
activation_api=CURVE_VIEWER_API_v1
capabilities=read_only;multi_source;source_identity;bounded_display;exact_preview;native2d_presentation;zoom_pan;session_persistence

[public_apis]
ids=CURVE_VIEWER_API_v1

[public_api.CURVE_VIEWER_API_v1]
api_version=1
name=Read-only Curve Viewer
entrypoint=api/curve_viewer_api_v1.tcl
namespace=::GX::CurveViewer
capabilities=read_only;curve_source;native2d_presentation;interactive_document

[documentation]
api_version=1
guide=MANUAL.md
api_refs=CURVE_SOURCE_API_v1;DATASET_PREVIEW_API_v1;DATASET_CATALOG_API_v1;INTERACTIVE_DOCUMENT_API_v1;SESSION_WORKSPACE_API_v1;DATASET_SCIENTIFIC_PROFILE_API_v1;WORKBENCH_EXTENSION_API_v1

[workspaces]
api_version=1
ids=curve_viewer
[workspace.curve_viewer]
entrypoint=api/workspace_provider.tcl
type=Curve Viewer
schema=gxtxt.curve_viewer.viewer
version=1.0
validate=::GX::CurveViewer::workspaceValidate
open=::GX::CurveViewer::workspaceOpen

[configuration]
api_version=1
entrypoint=api/curve_viewer_settings.tcl
[config]
fields=shortcuts;labels;history_strip
[config.shortcuts]
configuration_id=modules.curve_viewer.shortcuts
type=string
label=Command shortcuts
default=
persistent_default=1
application=immediate
validator=::GX::CurveViewer::_shortcutsValidate
structured_fields=::GX::CurveViewer::_shortcutFields
[config.labels]
configuration_id=modules.curve_viewer.labels
type=string
label=Legend and automatic labels
default=
persistent_default=1
application=immediate
validator=::GX::CurveViewer::_labelValidate
structured_fields=::GX::CurveViewer::_labelFields
description=Presentation-only automatic labels and legend visibility. Manual per-curve labels remain in the current Workspace.
[config.history_strip]
configuration_id=modules.curve_viewer.history_strip
type=string
label=Description / History strip
default=
persistent_default=1
application=immediate
validator=::GX::scientificHistoryStripValidate
structured_fields=::GX::scientificHistoryStripFields
