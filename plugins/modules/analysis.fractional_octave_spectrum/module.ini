[meta]
api_version=1
id=analysis.fractional_octave_spectrum
kind=analysis
group=Generic analysis / Spectral
name=Fractional-Octave Band Analysis
version=1.2.0
selectable=1
default_enabled=0
core=1
runner=standard_octave
order=330
depends=math.numeric;plot.dataset
description=Integrates a linear power spectral density into exact base-10 fractional-octave bands and publishes canonical band data. Scientific result graphs are persistent plot.dataset variants using exact Dataset-bound X interval bars.
config_hint=QUICK GUIDE: select a spectral Dataset, bind Frequency and a LINEAR PSD expressed per Hz, then choose 1, 3 or 6 bands per octave. Auto range uses only complete bands covered by the source spectrum. Exact band centres follow the base-10 fractional-octave definition around 1 kHz. Band power is the PSD integral over each band; Band RMS is sqrt(power). Band level uses the configured RMS reference. This is FFT/PSD band integration, not an IEC 61260 instrument-class filter-bank certification. See MANUAL.md and the bundled student Session Generator.

[inputs]
contracts=spectrum.table;table.generic

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=spectrum.table;table.generic

[bindings]
roles=frequency;psd

[binding.frequency]
label=Frequency variable
required=1
semantic_role=independent

[binding.psd]
label=Linear PSD (power per Hz)
required=1
semantic_role=measured

[outputs]
files=fractional_octave_report.txt;automatic_graphs.ini
datasets=spectrum.table

[config]
fields=bands_per_octave;range_mode;minimum_frequency_hz;maximum_frequency_hz;reference_rms

[config.bands_per_octave]
type=choice
label=Bands per octave
default=3
values=1;3;6
required=1

[config.range_mode]
type=choice
label=Frequency range
default=auto
values=auto;explicit
required=1

[config.minimum_frequency_hz]
type=number
label=Minimum frequency [Hz] (explicit range only)
default=20
required=1

[config.maximum_frequency_hz]
type=number
label=Maximum frequency [Hz] (explicit range only)
default=20000
required=1

[config.reference_rms]
type=number
label=RMS reference for band level (same unit as source signal)
default=1
required=1

[automatic_graphs]
provider=plot.dataset
api=PLOT_DATASET_API_v2
persistent_variants=1
requires_capabilities=series_kind_bar;bar_x_bounds

[runner]
script=plugins/modules/analysis.fractional_octave_spectrum/runtime/analysis_fractional_octave_spectrum.m

[documentation]
api_version=1
guide=MANUAL.md
api_refs=STATISTICAL_RESULT_SEMANTICS_API_v1;NUMERIC_API_v1;MODULE_API_v1;ANALYSIS_SOURCE_METADATA_RUNTIME_v1;CANONICAL_DATASET_API_v2;TABLE_STREAM_API_v3;DATASET_VARIABLE_SCHEMA_API_v3;DATASET_PUBLICATION_API_v2;DATASET_PUBLICATION_V2_OCTAVE_BINDING;GRAPH_PROVIDER_API_v1;PLOT_DATASET_API_v2;PLUGIN_INSTALL_API_v1;PROGRESS_API_v1
author=GX-TXT
changelog=CHANGELOG.md

[statistical_results]
api_version=1
semantics_api=STATISTICAL_RESULT_SEMANTICS_API_v1
boundary=runtime/analysis_fractional_octave_spectrum_main.m
publication_validation=gxtxt_publication_v2_open
publication_required=1
