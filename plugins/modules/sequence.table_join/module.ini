[meta]
api_version=1
id=sequence.table_join
kind=analysis
group=Generic analysis / Table transforms
name=Sequential Table Join
version=3
core=1
selectable=1
default_enabled=0
enabled_key=
run_key=
runner=standard_octave
order=220
depends=
description=Concatenates two or more compatible non-overlapping time-series datasets. Input order is ignored: segments are sorted by their absolute-time column and the result is published as a new canonical timeseries.table dataset.
config_hint=Choose the first dataset as primary, use + Add source for every additional segment, and select the datasets in any order. Gaps are preserved; overlaps and duplicate boundary timestamps are rejected.

[inputs]
contracts=timeseries.table

[analysis_sources]
api_version=1
ids=primary
dynamic=1

[analysis_source.primary]
required=1
contracts=timeseries.table

[outputs]
files=joined_sequence.csv;join_report.txt
datasets=timeseries.table

[graphs]
ids=

[runner]
script=plugins/modules/sequence.table_join/runtime/sequence_table_join.m
rerender_script=

[config]
fields=output_dataset_id;absolute_time_column;relative_time_column

[config.output_dataset_id]
type=string
label=Output Dataset ID
default=sequence.joined
required=1

[config.absolute_time_column]
type=string
label=Absolute time column
default=timestamp_s
required=1

[config.relative_time_column]
type=string
label=Global relative-time column (blank = preserve input unchanged)
default=time_s
required=0

[documentation]
api_version=1
guide=README.md
api_refs=MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;DATASET_PUBLICATION_API_v1;DATASET_API_v1
examples=
changelog=CHANGELOG.md
