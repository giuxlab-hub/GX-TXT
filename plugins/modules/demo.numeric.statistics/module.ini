[meta]
api_version=1
id=demo.numeric.statistics
kind=analysis
group=Generic analysis / Numerical examples
name=Numerical Statistics Demo
version=1.0.1
selectable=1
default_enabled=0
core=0
enabled_key=
run_key=
runner=standard_octave
order=789
depends=math.numeric
description=External reference module demonstrating descriptive and weighted Dataset statistics through math.numeric NUMERIC_API_v1, explicit non-finite policy, canonical result publication and automatic GX-TXT graphing.
config_hint=Use the portable Statistics Session Generator in GX-TXT Numerical Examples, import raw/statistics_demo.csv as table.generic, bind Value and optionally Weight, then run Descriptive or Weighted mode.

[inputs]
contracts=table.generic

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=table.generic

[bindings]
roles=value;weight

[binding.value]
label=Value variable
required=1
semantic_role=measured

[binding.weight]
label=Weight variable (weighted mode)
required=0
semantic_role=weight

[outputs]
files=statistics_metrics.ini;statistics_report.txt;render_cache.mat
datasets=table.generic

[graphs]
provider_api_version=1
ids=demo.numeric.statistics.values
default_ids=demo.numeric.statistics.values
rerender=standard_octave

[graph.demo.numeric.statistics.values]
name=Values with mean and median
file=01_statistics_values.png
default_enabled=1
supports_legend=1
legend_editor=standard
legend_placements=inside;above;below;left;right;manual
legend_layouts=row;stacked;wrapped
config_fields=title;x_label;y_label;line_width;marker_size

[graph.demo.numeric.statistics.values.config.title]
type=string
label=Plot title
default=Statistics demo - values with mean and median

[graph.demo.numeric.statistics.values.config.x_label]
type=string
label=X-axis label
default=Included observation

[graph.demo.numeric.statistics.values.config.y_label]
type=string
label=Y-axis label (auto = value variable and unit)
default=auto

[graph.demo.numeric.statistics.values.config.line_width]
type=double
label=Reference line width
default=1.4

[graph.demo.numeric.statistics.values.config.marker_size]
type=double
label=Value marker size
default=5

[runner]
script=plugins/modules/demo.numeric.statistics/runtime/demo_numeric_statistics.m
rerender_script=plugins/modules/demo.numeric.statistics/runtime/demo_numeric_statistics_rerender.m

[config]
fields=selection;mode;nonfinite_policy;output_dataset_id

[config.selection]
type=selection
label=Data selection (optional X interval)
required=0
source_role=primary
selection_types=x_range

[config.mode]
type=choice
label=Statistics mode
default=descriptive
values=descriptive;weighted
required=1

[config.nonfinite_policy]
type=choice
label=NaN / Inf policy
default=omit
values=omit;error
required=1

[config.output_dataset_id]
type=string
label=Summary Dataset ID
default=demo.numeric.statistics.result
required=1

[documentation]
api_version=1
guide=MANUAL.md
api_refs=MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;DATASET_METADATA_API_v1;DATASET_SELECTION_API_v1;DATASET_VARIABLE_SCHEMA_API_v3;TABLE_STREAM_API_v3;DATASET_PUBLICATION_API_v2;NUMERIC_API_v1;PROGRESS_API_v1;GRAPH_PROVIDER_API_v1;PLOT_MODULE_API_v1;PLOT_DATASET_API_v1;PLUGIN_INSTALL_API_v1;SESSION_GENERATOR_LIBRARY_API_v1;UNIT_REGISTRY_API_v1;DOCUMENTATION_API_v1
examples=session_generators/gxtxt_numerical_examples_statistics_1.0.0.zip
changelog=CHANGELOG.md
