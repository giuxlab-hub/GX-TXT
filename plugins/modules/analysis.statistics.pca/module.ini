; GX-TXT focused principal-component analysis.
; SPDX-License-Identifier: GPL-3.0-or-later
[meta]
api_version=1
id=analysis.statistics.pca
kind=analysis
group=Statistics
name=Principal Component Analysis
version=1.0.1
selectable=1
default_enabled=0
core=0
runner=standard_octave
order=500
depends=math.numeric
summary=Centered or standardized PCA through public matrix SVD.
description=Publishes source-row-aligned scores, loadings, explained variance and scaling parameters.
config_hint=Choose at least two numeric variables, centering/scaling, and a component count or explained-variance target.
[inputs]
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table
[analysis_sources]
api_version=1
ids=primary
dynamic=0
[analysis_source.primary]
required=1
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table
[outputs]
files=pca_report.txt;pca_summary.ini;automatic_graphs.ini
datasets=table.generic
[config]
fields=variables;selection;center;scaling;component_mode;component_count;variance_target;missing_policy;output_dataset_prefix;render_graphs
[config.variables]
type=table
dynamic=1
label=Numeric variables
min_rows=2
columns=variable
[config.variables.variable]
type=variable
label=Numeric variable
source=primary
required=1
[config.selection]
type=selection
label=Data selection (optional X interval)
source_role=primary
selection_types=x_range;rectangle
required=0
[config.center]
type=boolean
label=Subtract variable means
default=1
required=1
[config.scaling]
type=choice
label=Variable scaling
default=standardize
values=none;standardize
required=1
[config.component_mode]
type=choice
label=Component selection
default=count
values=count;variance_target
required=1
[config.component_count]
type=integer
label=Number of components
default=2
[config.variance_target]
type=number
label=Cumulative explained-variance target
default=0.95
[config.missing_policy]
type=choice
label=Missing row policy
default=listwise_omit
values=listwise_omit;error
required=1
[config.output_dataset_prefix]
type=string
label=Output Dataset ID prefix
default=statistics.pca
required=1
[config.render_graphs]
type=boolean
label=Create scree, score and loading graphs
default=1
required=1
[runner]
script=plugins/modules/analysis.statistics.pca/runtime/analysis_statistics_pca.m
[documentation]
api_version=1
guide=MANUAL.md
api_refs=MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;ANALYSIS_SOURCE_ACCESS_RUNTIME_v2;DATASET_SELECTION_API_v1;TABLE_STREAM_API_v3;DATASET_PUBLICATION_API_v2;NUMERIC_API_v1;UNIT_REGISTRY_API_v1;PLOT_DATASET_API_v2
changelog=CHANGELOG.md
