[meta]
api_version=1
id=viewer.crystal_structure
kind=viewer
group=Viewers
name=Crystal Chemistry Viewer
version=1.0.1
selectable=0
default_enabled=1
core=0
runner=service
order=859
depends=viewer.native_3d
description=Dedicated crystal chemistry and electron-density viewer for CIF structures and Gaussian CUBE scalar fields.
config_hint=Choose a COD library crystal or imported CIF/CUBE Dataset; expand symmetry and supercells, inspect sites, measure geometry and overlay density.

[inputs]
contracts=structure.crystal;field.scalar_3d

[outputs]
datasets=structure.crystal;field.scalar_3d

[viewers]
api_version=1
ids=crystal_structure

[viewer.crystal_structure]
name=Crystal Chemistry Viewer
backend=crystal_chemistry_tk
backend_script=runtime/crystal_chemistry_viewer.tcl
capabilities=cif;cube;library;symmetry;supercell;site_inspection;geometry_measurement;density_isosurface;slice;contour;source_provenance;session_persistence

[documentation]
api_version=1
guide=README.md
api_refs=VIEWER_PROVIDER_API_v1;DATASET_FILE_PUBLICATION_API_v1;DATASET_METADATA_API_v1;NATIVE_3D_VIEWER_API_v1
