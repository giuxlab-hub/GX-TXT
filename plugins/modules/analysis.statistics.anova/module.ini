[meta]
api_version=1
id=analysis.statistics.anova
kind=analysis
group=Statistics
name=One-way ANOVA
version=1.1.0
selectable=1
default_enabled=0
core=0
runner=standard_octave
order=480
depends=math.numeric
summary=Ordinary or Welch one-way group comparison with group summaries.
description=Reads numeric values and text/numeric groups from one Dataset, then publishes public NUMERIC_API ANOVA results.
config_hint=Choose a numeric value, a group variable, and ordinary or Welch one-way ANOVA explicitly.
[inputs]
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table
[analysis_sources]
api_version=1
ids=primary
dynamic=0
[analysis_source.primary]
required=1
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table
[outputs]
files=anova_report.txt;anova_summary.ini;automatic_graphs.ini
datasets=table.generic
[config]
fields=value_variable;group_variable;selection;method;nonfinite_policy;output_dataset_prefix;render_graphs
[config.value_variable]
type=variable
label=Numeric measurement
source=primary
required=1
[config.group_variable]
type=variable
label=Group variable (text or numeric)
source=primary
required=1
[config.selection]
type=selection
label=Data selection (optional X interval)
source_role=primary
selection_types=x_range;rectangle
required=0
[config.method]
type=choice
label=Group comparison method
default=ordinary
values=ordinary;welch
required=1
[config.nonfinite_policy]
type=choice
label=NaN / Inf and missing group policy
default=omit
values=omit;error
required=1
[config.output_dataset_prefix]
type=string
label=Output Dataset ID prefix
default=statistics.anova
required=1
[config.render_graphs]
type=boolean
label=Create group-mean graph
default=1
required=1
[runner]
script=plugins/modules/analysis.statistics.anova/runtime/analysis_statistics_anova.m
[documentation]
api_version=1
guide=MANUAL.md
api_refs=STATISTICAL_RESULT_SEMANTICS_API_v1;MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;ANALYSIS_SOURCE_ACCESS_RUNTIME_v2;DATASET_SELECTION_API_v1;TABLE_STREAM_API_v3;DATASET_PUBLICATION_API_v2;NUMERIC_API_v1;PLOT_DATASET_API_v2
changelog=CHANGELOG.md

[statistical_results]
api_version=1
semantics_api=STATISTICAL_RESULT_SEMANTICS_API_v1
boundary=runtime/analysis_statistics_anova_main.m
publication_validation=gxtxt_publication_v2_open
publication_required=1
