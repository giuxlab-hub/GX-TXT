; GX-TXT production UV/Vis single-spectrum and elapsed-time exploration
; SPDX-License-Identifier: GPL-3.0-or-later
[meta]
api_version=1
id=analysis.spectroscopy.uvvis_exploration
kind=analysis
group=Generic analysis / Spectral
name=UV/Vis Spectrum and Time-Series Exploration
version=1.0.2
selectable=1
default_enabled=0
core=1
runner=standard_octave
order=356
depends=math.numeric
description=Inspect one UV/Vis spectrum or an elapsed-time Spectral Family with optional blank correction, processing, peak/response extraction and reusable Datasets.
config_hint=Bind a scientific Spectrum for single-spectrum mode or an elapsed-time Spectral Family for time-series mode. Confirm the ordinate, blank role, wavelength and processing settings before Run.

[inputs]
contracts=spectrum.scientific;spectrum.family

[analysis_sources]
api_version=1
ids=primary;blank
dynamic=0

[analysis_source.primary]
required=1
contracts=spectrum.scientific;spectrum.family

[analysis_source.blank]
required=0
contracts=spectrum.scientific

[outputs]
files=uvvis_exploration_report.md;01_uvvis_exploration.png;render_cache.mat
datasets=table.generic;spectrum.scientific;spectrum.family

[config]
fields=workflow;selected_wavelength_nm;blank_correction;baseline_method;smoothing_method;smoothing_window;normalization;peak_min_prominence

[config.workflow]
type=choice
label=Workflow
default=single_spectrum
values=single_spectrum;time_series
required=1

[config.selected_wavelength_nm]
type=string
label=Analytical wavelength [nm]
default=322
required=1

[config.blank_correction]
type=choice
label=Blank correction
default=none
values=none;subtract_blank_absorbance
required=1

[config.baseline_method]
type=choice
label=Baseline method
default=none
values=none;linear;polynomial
required=1

[config.smoothing_method]
type=choice
label=Smoothing method
default=none
values=none;moving_mean;local_polynomial;savitzky_golay
required=1

[config.smoothing_window]
type=integer
label=Smoothing window (odd)
default=9
required=1

[config.normalization]
type=choice
label=Normalization
default=none
values=none;unit_vector;mean_center_unit_vector
required=1

[config.peak_min_prominence]
type=string
label=Minimum peak prominence
default=0.005
required=1

[graphs]
provider_api_version=1
ids=analysis.spectroscopy.uvvis_exploration.response
default_ids=analysis.spectroscopy.uvvis_exploration.response
rerender=standard_octave

[graph.analysis.spectroscopy.uvvis_exploration.response]
supports_variants=1
variant_data_model=module_cache
name=UV/Vis processed spectrum or time response
file=01_uvvis_exploration.png
default_enabled=1
supports_legend=1
config_fields=title;x_label;y_label;extra_format

[graph.analysis.spectroscopy.uvvis_exploration.response.config.title]
type=string
label=Graph title (blank = workflow default)
default=

[graph.analysis.spectroscopy.uvvis_exploration.response.config.x_label]
type=string
label=X-axis label (blank = workflow default)
default=

[graph.analysis.spectroscopy.uvvis_exploration.response.config.y_label]
type=string
label=Y-axis label (blank = workflow default)
default=

[graph.analysis.spectroscopy.uvvis_exploration.response.config.extra_format]
type=choice
label=Additional output format
default=none
values=none;pdf;svg

[runner]
script=plugins/modules/analysis.spectroscopy.uvvis_exploration/runtime/analysis_spectroscopy_uvvis_exploration.m
rerender_script=plugins/modules/analysis.spectroscopy.uvvis_exploration/runtime/analysis_spectroscopy_uvvis_exploration_rerender.m

[documentation]
api_version=1
guide=MANUAL.md
api_refs=SCIENTIFIC_SPECTRUM_API_v1;SPECTRAL_FAMILY_API_v1;NUMERIC_API_v1;DATASET_PUBLICATION_API_v2
