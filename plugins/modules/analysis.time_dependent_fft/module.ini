[meta]
api_version=1
id=analysis.time_dependent_fft
kind=analysis
group=Generic analysis / Spectral
name=Time-Dependent FFT
version=1.3.3
selectable=1
default_enabled=0
core=1
enabled_key=
run_key=
runner=standard_octave
order=305
depends=math.numeric
description=Dataset-native time-dependent FFT analysis over a GX-TXT Temporal Window Set. The complete ordered time-frequency Dataset remains the primary scientific result. Plotting is a separate cached stage: overview, 3D surface and one-file-per-window spectra can be regenerated without repeating the FFT when the scientific cache is still valid.
config_hint=QUICK GUIDE: Window size is how much signal each FFT sees; Step is how far the next window starts. Example: 10 s window + 5 s step = 50% overlap. Samples means counts of samples, Duration means physical time. Run mode Auto reuses an existing compatible FFT result and only redraws plots; Recalculate forces all FFT workers; Render only refuses to calculate and uses the existing cache. Time-frequency overview = one 2D map. 3D surface = one global time-frequency surface. Window spectrum plots = one separate file for every selected temporal window (All means 55 windows -> 55 files), plus a stable preview artifact. Window selection can be All, an index range, a list such as 1,5,12-20, or a time range. Maximum displayed bins/windows affect only rendering, never the scientific Dataset. Separate per-window CSV export is optional and is OFF by default because it can be expensive. Use Variants... on any offered graph to keep multiple persistent plot configurations over the same FFT result without recalculating. See MANUAL.md for the detailed guide.

[inputs]
contracts=timeseries.table;table.generic

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=timeseries.table;table.generic

[bindings]
roles=time;signal

[binding.time]
label=Time / temporal variable
required=1
semantic_role=independent

[binding.signal]
label=Signal variable
required=1
semantic_role=measured

[outputs]
files=time_dependent_fft_report.txt;plot_dataset_recipe.txt;window_plot_index.txt;split_export_index.txt;render_cache.mat
datasets=table.generic

[render_cache]
api_version=1
rerender_from_cache=1

[config]
fields=run_mode;temporal_set;window;detrend;nfft_mode;nfft;spectral_representation;workers;split_export


[config.run_mode]
type=choice
label=Run mode
default=auto
values=auto;recalculate;render_only
required=1

[config.temporal_set]
type=temporal_set
label=Temporal Window Set
required=1
source_role=primary
temporal_types=window_set

[config.window]
type=choice
label=FFT weighting window
default=hann
values=rectangular;hann;hamming;blackman;blackman_harris;flat_top
required=1

[config.detrend]
type=choice
label=Pre-FFT detrend / DC handling
default=mean
values=none;mean;linear
required=1

[config.nfft_mode]
type=choice
label=NFFT mode
default=auto
values=auto;explicit
required=1

[config.nfft]
type=integer
label=Explicit NFFT (used only when NFFT mode = explicit)
default=4096
required=1

[config.spectral_representation]
type=choice
label=Spectral representation
default=amplitude
values=amplitude;psd;amplitude_db
required=1

[config.workers]
type=string
label=Parallel workers (auto, serial, or positive integer)
default=auto
required=1

[config.split_export]
type=choice
label=Separate per-window data export
default=none
values=none;selected_windows;all_windows
required=1

[graphs]
provider_api_version=1
ids=analysis.time_dependent_fft.time_frequency_2d;analysis.time_dependent_fft.time_frequency_surface;analysis.time_dependent_fft.window_spectra
# Overview and 3-D surface use the compact render cache. Window spectrum plots remain opt-in because they may create many files.
default_ids=analysis.time_dependent_fft.time_frequency_2d;analysis.time_dependent_fft.time_frequency_surface
rerender=standard_octave

