[meta]
license=GPL-3.0-or-later
api_version=1
id=analysis.octave_script
kind=analysis
group=Scripting / Advanced
name=Octave Script
version=1.7.0
selectable=1
default_enabled=0
core=1
enabled_key=
run_key=
runner=standard_octave
ui_surface_id=
ui_replaced_by_core=1
order=795
depends=
summary=Develop and run researcher-authored GNU Octave scripts against registered GX-TXT public APIs through the generic Octave Script Bridge.
description=Provides a Script Registry backed Octave Workspace Viewer and a standard analysis runner that executes exact verified Session scripts. User code discovers and invokes script-callable GX-TXT public APIs through OCTAVE_SCRIPT_BRIDGE_API_v1.
config_hint=Create and save a Session script in the Workspace, then select session:<script_id> here. Reusable User scripts can be assigned to the Session. External .m files remain available in external_file mode.

[inputs]
contracts=

[analysis_sources]
api_version=1
ids=primary
dynamic=1

[analysis_source.primary]
required=0
contracts=

[outputs]
files=octave_script_run_report.txt;executed_script.m

[runner]
script=plugins/modules/analysis.octave_script/runtime/analysis_octave_script.m

[config]
fields=source_mode;registered_script;script_file;working_directory;include_script_directory;arguments;required_apis

[config.source_mode]
type=choice
label=Script source mode
values=registered_script;external_file
default=registered_script
required=1

[config.registered_script]
type=registered_script
label=Session registered script
default=
required=0

[config.script_file]
type=file
label=Octave script (.m)
default=
required=0
must_exist=1
extensions=.m
dialog_title=Choose Octave script

[config.working_directory]
type=path
label=Working directory (optional)
default=
required=0
must_exist=1
path_kind=directory
dialog_title=Choose script working directory

[config.include_script_directory]
type=boolean
label=Add source script directory to Octave path (external files only)
default=1
required=0

[config.arguments]
type=string
label=Script arguments / parameters (free-form text)
default=
required=0

[config.required_apis]
type=string
label=Required GX-TXT API IDs (semicolon-separated)
default=
required=0

