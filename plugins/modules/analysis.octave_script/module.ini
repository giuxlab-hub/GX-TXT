[public_api.OCTAVE_SCRIPT_EDITOR_API_v1]
public_contract=schema gxtxt.public_api_documentation.v1 purpose {Existing Script Registry owns executable Octave identity/source/SHA. Obsolete Workspace creation, update, restore and conversion are unsupported. Metadata-only recognition and explicitly confirmed deletion remain available. Reading or saving registered source does not execute it.} context {Inert provider-owned trusted-host documentation only. No provider activation, scientific work, Script/SDK authorization or generic invocation is granted.} operations {workspaceList {command ::GX::OctaveScriptEditor::workspaceList arguments {} parameters {} result {type {list of script metadata dictionaries} description {Language-filtered existing Registry records with stable User/Session references.}} context {Trusted host operation. Script Registry retains its existing source and execution authority. No obsolete Workspace conversion or persistence route is supported.}} workspaceRead {command ::GX::OctaveScriptEditor::workspaceRead arguments reference parameters {reference {type {Script Registry reference} description {Stable user:<id>/session:<id> Script Registry reference. Obsolete legacy references reject.}}} result {type {script metadata/source dictionary} description {Language-checked Script Registry metadata with actual UTF-8 entrypoint source, verified source/composite SHA and admitted Project metadata when applicable.}} context {Trusted host operation. Script Registry retains its existing source and execution authority. No obsolete Workspace conversion or persistence route is supported.}} workspaceSave {command ::GX::OctaveScriptEditor::workspaceSave arguments {reference expectedSha scope scriptId name description code {arguments {}} {properties {}}} parameters {reference {type {Script Registry reference} description {Stable user:<id>/session:<id>; projects retain the same qualified Registry identity.}} expectedSha {type {expected SHA-256 string} description {Prior exact Registry source/composite SHA for optimistic update/delete.}} scope {type {Script Registry scope choice} description {user or session; save-copy/create policy stays with the existing Registry owner.}} scriptId {type {stable Script Registry ID} description {Validated logical script ID; existing scope/ID cannot be changed by update.}} name {type {display name string} description {Human-readable record name; does not replace its stable logical identity.}} description {type {description string} description {Script metadata text passed to the existing Registry owner.}} code {type {UTF-8 executable script source string} description {Actual one-file language source stored through Script Registry; saving does not execute it. Use CORE Project Save All for complete project trees.}} arguments {type {script default-argument string} description {Octave default argument text retained by the Registry/legacy payload; not evaluated by documentation discovery.}} properties {type dictionary description {Optional version, required_apis, parameters and expected_revision; revision pins same-source metadata edits} required 0 default {}}} result {type {Script Registry receipt dictionary} description {Exact created/updated script identity/reference/revision/SHA through existing Registry; no execution.}} context {Trusted host operation. Script Registry retains its existing source and execution authority. No obsolete Workspace conversion or persistence route is supported.}} workspaceDelete {command ::GX::OctaveScriptEditor::workspaceDelete arguments {reference expectedSha} parameters {reference {type {Script Registry reference} description {Stable user:<id>/session:<id>, or legacy:<DocumentID> for the retained compatibility deletion path.}} expectedSha {type {expected SHA-256 string} description {Prior exact Registry source/composite SHA for optimistic update/delete.}}} result {type {empty Tcl result or legacy Document ID string} description {Registered removal requires the exact current source SHA and succeeds with an empty Tcl result. legacy:<id> returns the deleted Document ID; legacy expectedSha may be empty, otherwise its case-insensitive prior SHA must match.}} context {Trusted host operation. Script Registry retains its existing source and execution authority. No obsolete Workspace conversion or persistence route is supported.}} documentDelete {command ::GX::OctaveScriptEditor::documentDelete arguments {documentId expectedSha {confirmed 0}} parameters {documentId {type {Interactive Document ID} description {Existing Document owned by the named provider; current Session/generation/revision checks belong to the actual Document consumer.}} expectedSha {type {expected SHA-256 string} description {Required expected obsolete Document SHA; empty or changed values reject.}} confirmed {type boolean description {Must be explicitly true after user confirmation. Metadata-only ownership and exact expected SHA are checked before resource-safe deletion.}}} result {type {Interactive Document ID string} description {Actual deleted owned legacy Document ID. A committed deletion with later resource-cleanup error remains a distinct owner failure.}} context {Trusted host operation. Script Registry retains its existing source and execution authority. No obsolete Workspace conversion or persistence route is supported.}}}
