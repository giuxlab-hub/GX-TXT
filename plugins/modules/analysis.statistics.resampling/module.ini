; GX-TXT reproducible resampling analysis.
; SPDX-License-Identifier: GPL-3.0-or-later
[meta]
api_version=1
id=analysis.statistics.resampling
kind=analysis
group=Statistics
name=Resampling Inference
version=1.1.0
selectable=1
default_enabled=0
core=0
runner=standard_octave
order=510
depends=math.numeric
summary=Bootstrap scalar confidence intervals and two-group permutation inference.
description=Uses seeded public resampling indices and publishes the complete replicate distribution and summary.
config_hint=Select a bootstrap statistic or a paired/unpaired permutation comparison, seed and iteration count.
[inputs]
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table
[analysis_sources]
api_version=1
ids=primary
dynamic=0
[analysis_source.primary]
required=1
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table
[outputs]
files=resampling_report.txt;resampling_summary.ini;automatic_graphs.ini
datasets=table.generic
[config]
fields=first_variable;second_variable;selection;method;statistic;alternative;confidence;replicates;seed;nonfinite_policy;output_dataset_prefix
[config.first_variable]
type=variable
label=First numeric sample
source=primary
required=1
[config.second_variable]
type=variable
label=Second numeric sample (permutation only)
source=primary
required=0
[config.selection]
type=selection
label=Data selection (optional X interval)
source_role=primary
selection_types=x_range;rectangle
required=0
[config.method]
type=choice
label=Resampling method
default=bootstrap
values=bootstrap;permutation_independent;permutation_paired
required=1
[config.statistic]
type=choice
label=Bootstrap scalar statistic
default=mean
values=mean;median;sample_sd
required=1
[config.alternative]
type=choice
label=Permutation alternative
default=two_sided
values=two_sided;greater;less
required=1
[config.confidence]
type=number
label=Bootstrap confidence level
default=0.95
required=1
[config.replicates]
type=integer
label=Replicates / permutations
default=1000
required=1
[config.seed]
type=integer
label=Random seed (1 to 2147483646)
default=1
required=1
[config.nonfinite_policy]
type=choice
label=NaN / Inf policy
default=omit
values=omit;error
required=1
[config.output_dataset_prefix]
type=string
label=Output Dataset prefix
default=statistics.resampling
required=1
[runner]
script=plugins/modules/analysis.statistics.resampling/runtime/analysis_statistics_resampling.m
[documentation]
api_version=1
guide=MANUAL.md
api_refs=STATISTICAL_RESULT_SEMANTICS_API_v1;MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;ANALYSIS_SOURCE_ACCESS_RUNTIME_v2;DATASET_SELECTION_API_v1;DATASET_PUBLICATION_API_v2;NUMERIC_API_v1;UNIT_REGISTRY_API_v1
changelog=CHANGELOG.md

[statistical_results]
api_version=1
semantics_api=STATISTICAL_RESULT_SEMANTICS_API_v1
boundary=runtime/analysis_statistics_resampling_main.m
publication_validation=gxtxt_publication_v2_open
publication_required=1
