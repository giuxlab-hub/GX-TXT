[meta]
api_version=1
id=analysis.statistics.descriptive
kind=analysis
group=Statistics
name=Descriptive Statistics
version=1.2.0
selectable=1
default_enabled=0
core=1
enabled_key=
run_key=
runner=standard_octave
order=420
depends=math.numeric
summary=Descriptive statistics for one or more numeric Dataset variables.
description=Computes reusable descriptive statistics through public GX-TXT Dataset, Selection, NUMERIC_API_v1 and Dataset Publication APIs and creates persistent plot.dataset histogram and box/whisker variants without modifying source data.
config_hint=Choose a canonical Dataset, add one or more numeric variables, optionally choose an X-range Dataset Selection, then run. Automatic distribution plots use public plot.dataset variants and respect unit compatibility.

[inputs]
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table

[outputs]
files=descriptive_statistics_report.txt;descriptive_statistics_summary.ini;descriptive_plot_request.ini;automatic_graphs.ini
datasets=table.generic

[config]
fields=variables;selection;nonfinite_policy;percentiles;output_dataset_id;render_graphs;histogram_bins;histogram_normalization;box_whisker_iqr;box_show_outliers

[config.variables]
type=table
dynamic=1
label=Variables
min_rows=1
columns=variable

[config.variables.variable]
type=variable
label=Numeric variable
source=primary
required=1

[config.selection]
type=selection
label=Data selection (optional X interval)
required=0
source_role=primary
selection_types=x_range

[config.nonfinite_policy]
type=choice
label=NaN / Inf policy
default=omit
values=omit;error
required=1

[config.percentiles]
type=string
label=Additional percentiles (0-100, separated by semicolons or commas)
default=5;10;90;95
required=0

[config.output_dataset_id]
type=string
label=Summary Dataset ID
default=statistics.descriptive.summary
required=1

[config.render_graphs]
type=boolean
label=Create automatic distribution plots
default=1
required=1

[config.histogram_bins]
type=string
label=Histogram bins (auto or 2-512)
default=auto
required=1

[config.histogram_normalization]
type=choice
label=Histogram normalization
default=count
values=count;probability;density
required=1

[config.box_whisker_iqr]
type=double
label=Box/whisker IQR multiplier
default=1.5
required=1

[config.box_show_outliers]
type=boolean
label=Show box/whisker outliers
default=1
required=1

[runner]
script=plugins/modules/analysis.statistics.descriptive/runtime/analysis_statistics_descriptive.m

[documentation]
api_version=1
guide=MANUAL.md
api_refs=STATISTICAL_RESULT_SEMANTICS_API_v1;MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;ANALYSIS_SOURCE_ACCESS_RUNTIME_v2;DATASET_VARIABLE_SCHEMA_API_v3;DATASET_SELECTION_API_v1;REPEATABLE_CONFIG_API_v1;TABLE_STREAM_API_v3;DATASET_PUBLICATION_API_v2;DATASET_PUBLICATION_V2_OCTAVE_BINDING;NUMERIC_API_v1;UNIT_REGISTRY_API_v1;PLOT_MODULE_API_v1;PLOT_DATASET_API_v2;PLOT_DATASET_OCTAVE_BRIDGE_v1;PLUGIN_INSTALL_API_v1;PROGRESS_API_v1;SESSION_GENERATOR_LIBRARY_API_v1;DOCUMENTATION_API_v1
examples=session_generators/gxtxt_descriptive_statistics_student_lab_1.0.0.zip
changelog=CHANGELOG.md

[statistical_results]
api_version=1
semantics_api=STATISTICAL_RESULT_SEMANTICS_API_v1
boundary=runtime/analysis_statistics_descriptive_main.m
publication_validation=gxtxt_publication_v2_open
