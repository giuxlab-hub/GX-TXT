[meta]
api_version=1
id=demo.numeric.regression
kind=analysis
group=Generic analysis / Numerical examples
name=Numerical Regression Demo
version=1.0.1
selectable=1
default_enabled=0
core=0
enabled_key=
run_key=
runner=standard_octave
order=788
depends=math.numeric
description=External reference module demonstrating OLS/WLS regression through public math.numeric, canonical fit and coefficient Datasets, and editable Plot.dataset graphs.
config_hint=Generate or import a regression example Dataset, bind X and measured Y, optionally bind reference Y, measurement sigma and an explicit weight variable, choose linear or polynomial mode, then run the module.

[inputs]
contracts=table.generic

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=table.generic

[bindings]
roles=x;measured;reference;sigma;weight

[binding.x]
label=Independent X variable
required=1
semantic_role=independent

[binding.measured]
label=Measured Y variable
required=1
semantic_role=measured

[binding.reference]
label=Reference Y variable (optional)
required=0
semantic_role=reference

[binding.sigma]
label=Measurement standard uncertainty variable (optional)
required=0
semantic_role=uncertainty

[binding.weight]
label=Statistical weight variable (optional)
required=0
semantic_role=weight

