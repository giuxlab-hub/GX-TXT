[config.selection]
type=selection
label=Data selection (optional X interval)
required=0
source_role=primary
selection_types=x_range

[config.fit_mode]
type=choice
label=Regression mode
default=linear
values=linear;polynomial
required=1

[config.polynomial_degree]
type=integer
label=Polynomial degree (polynomial mode)
default=3
required=1

[config.weight_semantics]
type=choice
label=Weight semantics
default=relative
values=relative;inverse_variance
required=1

[config.output_dataset_id]
type=string
label=Output Dataset ID
default=demo.numeric.regression.result
required=1

