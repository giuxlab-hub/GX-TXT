[meta]
api_version=1
id=curve.replicate_analysis
kind=analysis
group=Generic analysis / Statistical characterization
name=Replicate Curve Analysis
version=15.3
selectable=1
default_enabled=0
enabled_key=
run_key=
runner=standard_octave
order=250
depends=math.numeric;plot.dataset
description=Analyzes repeated X/Y curve Datasets from one or more canonical Analysis Sources. Explicit replicate IDs use trace-based ANOVA; unlabeled repeated points use an order-independent local point-cloud estimator without inventing replicate counts. Produces consensus, uncertainty and a fit-ready CSV without physical-model fitting.
config_hint=Normal use: select the primary Dataset, use + Add source for any additional canonical Datasets, bind X/Y and optionally Family, then leave Replicate handling = automatic. If a replicate/curve ID column exists it is used automatically. Otherwise every source/family is treated as an unlabeled repeated-point cloud: all points are preserved, CSV row order is ignored, and no replicate count is guessed from sampling density.

[inputs]
contracts=
default_dataset=curve_family.primary

[analysis_sources]
api_version=1
ids=primary
dynamic=1

[analysis_source.primary]
required=1
contracts=

[outputs]
files=consensus_for_fitting.csv;uncertainty_profile.csv;replicate_statistics.csv;source_statistics.csv;replicate_analysis_summary.txt;render_cache.mat;01_replicate_overlay.status.ini;02_consensus_uncertainty.status.ini;03_uncertainty_components.status.ini;04_family_uncertainty_summary.status.ini
datasets=table.generic

[render_cache]
api_version=1
rerender_from_cache=1

[graphs]
provider_api_version=1
ids=curve.replicate.overlay;curve.replicate.consensus_uncertainty;curve.replicate.uncertainty_components;curve.replicate.family_summary
default_ids=curve.replicate.overlay;curve.replicate.consensus_uncertainty;curve.replicate.uncertainty_components;curve.replicate.family_summary
