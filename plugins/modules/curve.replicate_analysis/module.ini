[config]
fields=include_primary_dataset;replicate_handling;sampling_model;fit_output_grid;fit_output_grid_points;common_grid;grid_points;consensus_center;interpolation;min_trace_points;reset_step_factor;reset_span_fraction

[config.include_primary_dataset]
type=boolean
label=Include primary canonical dataset as a source
default=1
required=1

[config.replicate_handling]
type=choice
label=Repeated-data handling (leave automatic unless using a legacy ordered CSV)
default=automatic
values=automatic;one_curve_per_source_family;legacy_ordered_rows
required=1

[config.min_trace_points]
type=integer
label=Minimum points per accepted trace
default=5
required=1

[config.reset_step_factor]
type=double
label=Legacy x-reset threshold / typical X step
default=5
required=1

[config.reset_span_fraction]
type=double
label=Legacy x-reset threshold / current X span
default=0.35
required=1

[config.common_grid]
type=choice
label=Internal statistical X grid (normally leave pooled_x)
default=pooled_x
values=pooled_x;linspace
required=1

[config.grid_points]
type=integer
label=Internal linspace points (used only if selected above)
default=200
required=1

[config.fit_output_grid]
type=choice
label=Fit CSV point grid (reference_grid recommended; uniform_grid = fixed N)
default=reference_grid
values=reference_grid;uniform_grid
required=1

[config.fit_output_grid_points]
type=integer
label=Fit CSV points per family (uniform_grid, and automatic fallback for unlabeled point clouds)
default=200
required=1

[config.interpolation]
type=choice
label=Interpolation method
default=linear
values=linear
required=1

[config.consensus_center]
type=choice
label=Consensus center written to fit-ready CSV
default=mean
values=mean;median
required=1

[bindings]
roles=x;family;y;replicate

[binding.x]
label=Independent X
required=1
semantic_role=independent

[binding.family]
label=Family / sweep variable (optional)
required=0
semantic_role=family

[binding.y]
label=Measured Y
required=1
semantic_role=dependent

[binding.replicate]
label=Curve / replicate ID (optional; automatic mode detects common column names)
required=0
semantic_role=replicate

