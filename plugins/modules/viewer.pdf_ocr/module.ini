[meta]
api_version=1
id=viewer.pdf_ocr
kind=viewer
group=Viewers
name=PDF OCR Viewer
version=1.0.4
selectable=1
default_enabled=0
core=1
runner=service
order=845
depends=
description=Interactive PDF page viewer, region crop and OCR workflow over canonical document.pdf Datasets. Publishes derived image.raster, document.text and document.pdf Datasets with provenance through public GX-TXT APIs.
config_hint=Open from Viewers. Select a document.pdf Dataset from the current Session, render a page, select a region, run OCR or publish derived image/text/PDF Datasets.

[inputs]
contracts=document.pdf

[outputs]
datasets=image.raster;document.text;document.pdf

[contracts]
provided=document.text

[contract.document.text]
description=Canonical UTF-8 plain-text document Dataset. The payload is text, not a numeric table; no Variable Schema columns are implied.

[viewers]
api_version=1
ids=pdf_ocr

[viewer.pdf_ocr]
name=PDF OCR Viewer
backend=pdf_ocr_tk
activation_api=PDF_OCR_VIEWER_API_v1
capabilities=interactive;pdf_dataset;page_navigation;zoom;pan;roi;crop;ocr;whole_pdf_ocr;session_persistence;dataset_publication
short_title=PDF OCR
semantic_group=images
group_title=Imaging & Documents
icon=icons/pdf_ocr.png

[public_apis]
ids=PDF_OCR_VIEWER_API_v1

[public_api.PDF_OCR_VIEWER_API_v1]
public_contract=schema gxtxt.public_api_documentation.v1 purpose {Viewer activation callback open/rerender; current Session/dependencies required on first launch. Existing-channel focus precedes launch-time Session check. IPC is private; returned PID list is not OCR/scientific/Workspace success.} context {Inert provider-owned trusted-host documentation only. No provider activation, scientific work, Script/SDK authorization or generic invocation is granted.} operations {viewerDispatch {command ::GX::PdfOcrViewer::viewerDispatch arguments {action scene} parameters {action {type {Viewer lifecycle action string} description {Actual backend operation; open/rerender support or ignored action semantics are explicitly stated by this operation.}} scene {type {resolved Viewer scene dictionary} description {Host-supplied Viewer scene; only documented open_context fields are consumed, or explicitly ignored by this backend.}}} result {type {launch/focus receipt dictionary} description {status opened/focused and Tcl channel PID list; not mapped GUI/extraction/publication success.}} context {Viewer Provider callback. Viewer activation callback open/rerender; current Session/dependencies required on first launch. Existing-channel focus precedes launch-time Session check. IPC is private; returned PID list is not OCR/scientific/Workspace success.}}}
api_version=1
name=PDF OCR Viewer backend
entrypoint=api/pdf_ocr_viewer_api_v1.tcl
namespace=::GX::PdfOcrViewer
