[meta]
api_version=1
id=viewer.pdf_ocr
kind=viewer
group=Viewers
name=PDF OCR Viewer
version=1.0.4
selectable=1
default_enabled=0
core=1
runner=service
order=845
depends=
description=Interactive PDF page viewer, region crop and OCR workflow over canonical document.pdf Datasets. Publishes derived image.raster, document.text and document.pdf Datasets with provenance through public GX-TXT APIs.
config_hint=Open from Viewers. Select a document.pdf Dataset from the current Session, render a page, select a region, run OCR or publish derived image/text/PDF Datasets.

[inputs]
contracts=document.pdf

[outputs]
datasets=image.raster;document.text;document.pdf

[contracts]
provided=document.text

[contract.document.text]
description=Canonical UTF-8 plain-text document Dataset. The payload is text, not a numeric table; no Variable Schema columns are implied.

[viewers]
api_version=1
ids=pdf_ocr

[viewer.pdf_ocr]
name=PDF OCR Viewer
backend=pdf_ocr_tk
activation_api=PDF_OCR_VIEWER_API_v1
capabilities=interactive;pdf_dataset;page_navigation;zoom;pan;roi;crop;ocr;whole_pdf_ocr;session_persistence;dataset_publication
short_title=PDF OCR
semantic_group=images
group_title=Imaging & Documents
icon=icons/pdf_ocr.png

[public_apis]
ids=PDF_OCR_VIEWER_API_v1

[public_api.PDF_OCR_VIEWER_API_v1]
api_version=1
name=PDF OCR Viewer backend
entrypoint=api/pdf_ocr_viewer_api_v1.tcl
namespace=::GX::PdfOcrViewer
capabilities=viewer_backend;interactive_documents;dataset_file_publication;dataset_metadata;session_inspection

[documentation]
api_version=1
guide=MANUAL.md
changelog=CHANGELOG.md
api_refs=VIEWER_PROVIDER_API_v1;INTERACTIVE_DOCUMENT_API_v1;DATASET_FILE_PUBLICATION_API_v1;DATASET_METADATA_API_v1;SESSION_INSPECTION_API_v1;CONTRACT_REGISTRY_API_v1;PLUGIN_INSTALL_API_v1
