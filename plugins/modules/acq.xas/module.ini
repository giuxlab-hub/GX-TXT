[meta]
api_version=1
id=acq.xas
kind=acquisition
group=Instruments / Spectroscopy
name=XAS spectra import
version=1.0.1
selectable=0
default_enabled=1
enabled_key=
run_key=
runner=standard_tcl
order=70
depends=math.numeric
description=Imports processed XAS spectra/families and selected raw transmission or fluorescence channels into canonical GX-TXT spectral Datasets.
config_hint=Choose the source layout explicitly. Processed families use Energy plus one spectrum per following column. Raw modes build mu(E) from explicitly selected detector columns.

[inputs]
contracts=raw.xas

[outputs]
datasets=spectrum.scientific;spectrum.family
files=raw/*;datasets/*;metadata/datasets.ini

[config]
fields=input_mode;delimiter;header;header_row;skip_rows;energy_column;energy_unit;first_spectrum_column;last_spectrum_column;single_mu_column;numerator_columns;denominator_columns;nonfinite_policy;chunk_rows

[config.input_mode]
type=choice
label=XAS source layout
default=processed_family
values=processed_family;processed_single;raw_transmission;raw_fluorescence;raw_ratio
required=1

[config.delimiter]
type=choice
label=Text delimiter
default=auto
values=auto;comma;semicolon;tab;whitespace
required=1

[config.header]
type=choice
label=Header
default=absent
values=absent;present
required=1

[config.header_row]
type=integer
label=Header row
default=1
required=1

[config.skip_rows]
type=integer
label=Physical rows before header/data
default=0
required=1

[config.energy_column]
type=integer
label=Energy column
default=1
required=1

[config.energy_unit]
type=choice
label=Energy unit
default=auto
values=auto;eV;keV
required=1

[config.first_spectrum_column]
type=integer
label=First processed spectrum column
default=2
required=1

[config.last_spectrum_column]
type=integer
label=Last processed spectrum column (0 = final column)
default=0
required=1

[config.single_mu_column]
type=integer
label=Processed mu(E) column
default=2
required=1

[config.numerator_columns]
type=string
label=Raw numerator columns (semicolon separated)
default=
required=0

[config.denominator_columns]
type=string
label=Raw denominator columns (semicolon separated)
default=
required=0

[config.nonfinite_policy]
type=choice
label=Invalid/non-finite samples
default=omit_samples
values=omit_samples;error
required=1

[config.chunk_rows]
type=integer
label=Parser rows per block
default=2048
required=1

[runner]
handler=xas_table

[acquisition_handler]
api_version=1
script=runtime/acquisition_handler.tcl
inspect_proc=::XASAcq::inspect
import_proc=::XASAcq::import
file_label=XAS text tables
file_patterns=*.dat;*.txt;*.csv;*.xas
supports_batch=1
variable_mapping=none

[documentation]
api_version=1
guide=MANUAL.md
changelog=CHANGELOG.md
api_refs=ACQUISITION_HANDLER_PLUGIN_API_v1;TABULAR_TEXT_API_v1;DATASET_VARIABLE_SCHEMA_API_v3;DATASET_METADATA_API_v1;SCIENTIFIC_SPECTRUM_API_v1;SPECTRAL_FAMILY_API_v1;NUMERIC_API_v1
