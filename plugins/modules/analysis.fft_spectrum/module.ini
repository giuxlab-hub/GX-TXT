[meta]
api_version=1
id=analysis.fft_spectrum
kind=analysis
group=Generic analysis / Spectral
name=FFT Spectrum & Error Analysis
version=2.2.0
selectable=1
default_enabled=0
core=1
enabled_key=
run_key=
runner=standard_octave
order=300
depends=math.numeric
description=Dataset-native single-signal frequency-domain analysis. Existing Full record, Dataset Selection and Fixed-length block workflows are preserved. Temporal Set mode consumes public Temporal Set API v1 resources and publishes one independent canonical spectrum.table per resolved segment/window member without concatenating separated regions. Time-varying STFT analysis belongs to analysis.spectrogram.
config_hint=Bind the independent sample axis and one signal variable/channel. Full record analyses the complete dataset or the optional Dataset Selection interval. Fixed-length block keeps the existing FFT-length and block-position controls. Temporal Set processes each resolved segment/window independently and uses the Temporal Set parent Selection rather than config.selection. FFT window selects only the weighting function. Published spectra are canonical derived datasets; no intermediate CSV is created.

[inputs]
contracts=timeseries.table

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=timeseries.table

[bindings]
roles=independent;signal

[binding.independent]
label=Independent (uniform sample axis, e.g. time)
required=1
semantic_role=independent

[binding.signal]
label=Signal variable / channel to analyse
required=1
semantic_role=measured

[outputs]
files=fft_metrics.ini;fft_report.txt
datasets=spectrum.table

[config]
fields=selection;temporal_set;window;analysis_mode;fft_length;block_position;block_start_sample;fundamental_mode;fundamental_hz;track_harmonics;spur_search;spur_exclude_bins;detrend

[config.selection]
type=selection
label=Data selection (optional X/time interval)
required=0
source_role=primary
selection_types=x_range

[config.temporal_set]
type=temporal_set
label=Temporal Set (used only in Temporal Set analysis mode)
required=0
source_role=primary
temporal_types=segment_set;window_set

[config.window]
type=choice
label=FFT window
default=hann
values=rectangular;hann;hamming;blackman_harris;flat_top
required=1

[config.analysis_mode]
type=choice
label=Analysis mode
default=full_record
values=full_record;fixed_block;temporal_set
required=1

[config.fft_length]
type=choice
label=FFT length (fixed block; Auto = full record)
default=auto
values=auto;16384;32768;65536;131072;262144;524288;1048576
required=1

[config.block_position]
type=choice
label=Block position (fixed block only)
default=center
values=start;center;explicit
required=1

[config.block_start_sample]
type=integer
label=Explicit block start sample (0-based; fixed block only)
default=0
required=1

[config.fundamental_mode]
type=choice
label=Fundamental frequency
default=auto_peak
values=auto_peak;explicit
required=1

[config.fundamental_hz]
type=string
label=Explicit fundamental [Hz] (used when mode=explicit)
default=

[config.track_harmonics]
type=integer
label=Harmonics to track for THD (2..K)
default=10
required=1

[config.spur_search]
type=choice
label=SFDR spur search
default=all_nonfundamental
values=all_nonfundamental;nonharmonic_only
required=1

[config.spur_exclude_bins]
type=integer
label=Guard bins excluded around each tracked line
default=2
required=1

[config.detrend]
type=choice
label=Pre-FFT detrend
default=mean
values=none;mean;linear
required=1

[runner]
script=plugins/modules/analysis.fft_spectrum/runtime/analysis_fft_spectrum.m

[documentation]
api_version=1
guide=README.md
api_refs=MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;ANALYSIS_SOURCE_METADATA_RUNTIME_v1;ANALYSIS_SOURCE_ACCESS_RUNTIME_v2;CANONICAL_DATASET_API_v2;TABLE_STREAM_API_v3;DATASET_SELECTION_API_v1;TEMPORAL_SET_API_v1;ELAPSED_TIME_CONTRACT_v1;ELAPSED_TIME_REQUESTED_UNIT_API_v1;DATASET_PUBLICATION_API_v2;DATASET_PUBLICATION_V2_OCTAVE_BINDING;DATASET_VARIABLE_SCHEMA_API_v3;SPECTRUM_TABLE_CONTRACT_v1;COMPUTED_DATA_ANNOTATION_API_v1;UNIT_DIMENSION_API_v1;PROGRESS_API_v1;DOCUMENTATION_API_v1
examples=tests/fixtures/coherent_sine_harmonics.expected.md
changelog=CHANGELOG.md
