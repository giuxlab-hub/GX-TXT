[meta]
api_version=1
id=plot.dataset
kind=analysis
group=Generic analysis / Plotting
name=Scientific Dataset Plot
version=4.0.0
selectable=1
default_enabled=0
core=1
enabled_key=
run_key=
runner=standard_octave
order=790
depends=
description=Dataset-native scientific plotter for canonical GX-TXT tables. Public PlotSpec v2 supports Cartesian traces, text and numeric 2-D family grouping, categorical row filtering, explicit point ordering, reversible axis direction, exact X-interval bars, and statistically complete histogram and box/whisker representations. Normal 2D Graph Series retain optional vertically stacked shared-X panels, dataset-aware Table Stream API v3 access, implicit coordinates, dual-Y axes and bounded large-dataset preparation; 3D plotting supports canonical XYZ tables and explicit Y-by-X matrices with bounded reads and physical coordinate preservation.
config_hint=For 2D graphs choose Dataset, X, Y, filter variable/value, primary family variable, secondary parameter variable and ordering variable in Graph Series. Create family series expands one curve per selected family value. Configure... manages vertically stacked shared-X panels and their Y axes. The runtime reads canonical Dataset variables through dataset-aware APIs; physical storage columns are not scientific identity. 3D uses dedicated X/Y/Z bindings; rank-two Z requires exact Y/X axis dimensions and finite cells. Family remains a table binding.

[inputs]
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table;spectrum.family
default_dataset=

[outputs]
files=render_cache.mat;plot_summary.txt

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table;spectrum.family

[render_cache]
api_version=1
rerender_from_cache=1

