[meta]
api_version=1
id=acq.text_document
kind=acquisition
group=Acquisition / Documents
name=Text and Source Code Import
version=1.0.4
selectable=1
default_enabled=1
core=0
runner=standard_tcl
order=158
depends=
description=Imports text documents and source code as independent file-shaped Datasets. Preserves original bytes, detects language and encoding, and stores structured metadata. Source code is never executed.
config_hint=Add one or more sources in the standard batch table. No Variables mapping is required. Encoding and Language overrides apply to Preview and every imported row in the current run. Keep Language on auto for a mixed-language batch.

[inputs]
contracts=raw.text

[outputs]
datasets=document.text;code.source
files=datasets/*;metadata/datasets.ini;metadata/datasets/*

; Plugin-owned declarations: no CORE registry edits. See docs/ARCHITECTURE.md.
[contracts]
provided=document.text;code.source

[contract.document.text]
description=One preserved text file with explicit text.encoding metadata. No numerical columns or executable semantics are implied. Original encoding, BOM and line endings remain unchanged.

[contract.code.source]
description=Source-code specialization of document.text with code.language detection metadata. A language hint does not imply syntactic validity or permission to execute the payload.
parents=document.text

[config]
fields=dataset_id;import_as;language;encoding

[config.dataset_id]
type=string
label=Default Dataset ID
default=document.text
required=1

[config.import_as]
type=choice
label=Import as
default=auto
values=auto;text_document;source_code
required=1

[config.language]
type=choice
label=Language (detection override)
default=auto
values=auto;plaintext;unknown;python;tcl;octave;matlab;matlab-octave;objective-c;c;cpp;c-cpp;bash;sh;zsh;fish;powershell;batch;javascript;typescript;csharp;java;fortran;rust;go;r;julia;ruby;perl;prolog;perl-prolog;lua;php;sql;make;cmake;dockerfile;json;yaml;toml;ini;xml;html;css;markdown;rst;tex;gitignore
required=1

[config.encoding]
type=choice
label=Encoding (auto = BOM / Python cookie / UTF-8)
default=auto
values=auto;utf-8;utf-8-sig;ascii;utf-16;utf-16-le;utf-16-be;utf-32;utf-32-le;utf-32-be;cp1252;iso-8859-1
required=1

[runner]
handler=text_document

[acquisition_handler]
api_version=1
script=runtime/acquisition_handler.tcl
inspect_proc=::AcqTextDocument::inspect
import_proc=::AcqTextDocument::import
begin_proc=::AcqTextDocument::begin
step_proc=::AcqTextDocument::step
cancel_proc=::AcqTextDocument::cancel
dataset_preview_proc=::AcqTextDocument::datasetPreview
file_label=Text documents and source code (all extensions)
file_patterns=*
file_type_groups=Python source|*.py;*.pyw||Tcl source|*.tcl;*.tk||Text and markup|*.txt;*.md;*.log||Other source code|*.m;*.sh;*.c;*.cpp;*.h;*.js;*.f90||All text/source files|*
supports_batch=1
supports_external_raw=1
source_kind=text
variable_mapping=none
capabilities=batch;progress;dataset_preview;cooperative_async;cancellation
formats=document.text;code.source

[acquisition_format.document.text]
description=Preserved plain text, markup or configuration document; explicit encoding metadata.
mime=text/plain
extensions=*.txt;*.log;*.md;*.json;*.yaml;*.yml;*.toml;*.ini;*.xml
canonical_formats=text

[acquisition_format.code.source]
description=Preserved program or script source; language inferred without executing it.
mime=text/plain
extensions=*.py;*.tcl;*.tk;*.m;*.sh;*.ps1;*.c;*.cpp;*.h;*.js;*.f90
canonical_formats=source_code

[documentation]
api_version=1
guide=MANUAL.html
changelog=CHANGELOG.md
api_refs=MODULE_API_v1;ACQUISITION_HANDLER_PLUGIN_API_v1;DATASET_METADATA_API_v1;SESSION_INSPECTION_API_v1;PREVIEW_DESCRIPTOR_API_v1;PLUGIN_INSTALL_API_v1;CONTRACT_REGISTRY_API_v1
