[meta]
api_version=1
id=viewer.interactive_curve_builder
kind=viewer
group=Viewers
name=Interactive Curve Builder
version=1.1.0
selectable=0
default_enabled=1
core=0
runner=service
order=860
depends=math.numeric;plot.dataset
description=Select canonical Dataset rows, interpolate or fit with NUMERIC_API, and publish reusable curves.
config_hint=Open from Viewers or a Dataset. Select source variables and points, preview, then publish.

[inputs]
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table;spectrum.family

[outputs]
datasets=table.generic

[viewers]
api_version=1
ids=interactive_curve_builder

[viewer.interactive_curve_builder]
name=Interactive Curve Builder
backend=interactive_curve_builder_tk
activation_api=INTERACTIVE_CURVE_BUILDER_API_v1
capabilities=canonical_row_selection;multi_dataset;family_member;range;point;numeric_interpolation;numeric_fit;parametric_3d;dataset_publication;plot_dataset

[public_apis]
ids=INTERACTIVE_CURVE_BUILDER_API_v1

[public_api.INTERACTIVE_CURVE_BUILDER_API_v1]
api_version=1
name=Interactive Curve Builder backend
entrypoint=api/interactive_curve_builder_api_v1.tcl
namespace=::GX::InteractiveCurveBuilder
capabilities=viewer_backend;canonical_source_rows;numeric_evaluation;dataset_publication

[documentation]
api_version=1
guide=MANUAL.md
api_refs=VIEWER_PROVIDER_API_v1;SESSION_INSPECTION_API_v1;DATASET_VARIABLE_SCHEMA_API_v3;TABLE_STREAM_API_v3;NUMERIC_API_v1;DATASET_PUBLICATION_API_v2;DATASET_METADATA_API_v1;PLOT_DATASET_API_v3

[configuration]
entrypoint=api/curve_builder_options.tcl
[config]
fields=defaults
[config.defaults]
configuration_id=modules.curve_builder.defaults
type=string
label=Simple Builder defaults
default=
persistent_default=1
application=next_viewer
validator=::GX::InteractiveCurveBuilder::_optionsValidate
structured_fields=::GX::InteractiveCurveBuilder::_optionFields
description=Factory auto-order is OFF. An explicitly saved ON preference still requires review for each candidate. Source graph scope is independent.

[workspaces]
ids=curve_builder
[workspace.curve_builder]
entrypoint=api/workspace_provider.tcl
type=Interactive Curve Builder
schema=gxtxt.interactive_curve_builder.context
version=1.0
validate=::GX::InteractiveCurveBuilder::workspaceValidate
open=::GX::InteractiveCurveBuilder::workspaceOpen
