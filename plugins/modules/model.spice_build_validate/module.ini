[runner]
script=plugins/modules/model.spice_build_validate/runtime/model_spice_build_validate.m
rerender_script=plugins/modules/model.spice_build_validate/runtime/model_spice_build_validate_rerender.m

[config]
fields=model_id;parameter_file;domain_file;dataset_id;validation_dataset_role;spice_device_name;ngspice_executable;absolute_tolerance;relative_tolerance;relative_error_floor;sweep_points;sweep_groups;x_min;x_max;family_min;family_max

[config.model_id]
type=model
label=Mathematical model
default=
required=1

[config.parameter_file]
type=file
label=Frozen parameter CSV
required=1
must_exist=1
extensions=.csv
dialog_title=Choose frozen parameter set

[config.domain_file]
type=file
label=Training-domain CSV (optional)
required=0
must_exist=1
extensions=.csv
dialog_title=Choose model training domain

[config.dataset_id]
type=dataset
label=Validation dataset (optional)
default=
required=0
contract=curve_family.table


[config.validation_dataset_role]
type=choice
label=Validation dataset relationship to fitting data
default=unspecified
values=unspecified;independent;training_reused;other
required=1

[config.spice_device_name]
type=string
label=Generated SPICE subcircuit name
default=GXTXT_MODEL
required=1

[config.ngspice_executable]
type=string
label=ngspice executable or path
default=ngspice
required=1

[config.absolute_tolerance]
type=double
label=SPICE vs analytical absolute tolerance (model output units)
default=1e-6
required=1

[config.relative_tolerance]
type=double
label=SPICE vs analytical relative tolerance
default=1e-7
required=1

[config.relative_error_floor]
type=double
label=Minimum |analytical Y| for relative-error metrics
default=1e-9
required=1

[config.sweep_points]
type=integer
label=Points per generated sweep curve
default=41
required=1

[config.sweep_groups]
type=integer
label=Generated curves per sweep profile
default=7
required=1

[config.x_min]
type=string
label=Model X minimum override (blank = derive)
default=
required=0

[config.x_max]
type=string
label=Model X maximum override (blank = derive)
default=
required=0

[config.family_min]
type=string
label=Model family minimum override (blank = derive)
default=
required=0

[config.family_max]
type=string
label=Model family maximum override (blank = derive)
default=
required=0

[bindings]
roles=x;family;y

[binding.x]
label=Model input X
required=0
preferred_model_field=x_column
semantic_role=independent

[binding.family]
label=Model family input
required=0
preferred_model_field=family_column
semantic_role=family

[binding.y]
label=Measured output Y
required=0
preferred_model_field=y_column
semantic_role=measured

