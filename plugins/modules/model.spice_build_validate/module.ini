[meta]
api_version=1
id=model.spice_build_validate
kind=analysis
group=Generic analysis / Model export
name=SPICE Build and Validation
version=4
selectable=1
default_enabled=0
enabled_key=
run_key=
runner=standard_octave
order=360
depends=math.numeric;plot.dataset
description=Exports a selected mathematical model through its optional SPICE Adapter API, runs deterministic ngspice verification, and optionally validates against a canonical dataset.
config_hint=Choose a mathematical model with a SPICE adapter and a frozen parameter CSV. A model-domain file and a canonical validation dataset are optional. No fitting is performed.

[inputs]
contracts=curve_family.table
default_dataset=

[outputs]
files=spice_model.lib;spice_testbench_x_sweep.cir;spice_testbench_family_sweep.cir;spice_testbench_validation.cir;ngspice_x_sweep.log;ngspice_family_sweep.log;ngspice_validation.log;ngspice_x_sweep.dat;ngspice_family_sweep.dat;ngspice_validation.dat;spice_predictions.csv;spice_validation_metrics.csv;spice_validation_metrics_by_family.csv;spice_validation_summary.txt;render_cache.mat

[graphs]
provider_api_version=1
ids=model.spice.overlay;model.spice.residuals;model.spice.parity;model.spice.validation_overlay;model.spice.validation_residuals;model.spice.validation_domain
default_ids=model.spice.overlay;model.spice.residuals;model.spice.parity
rerender=standard_octave

