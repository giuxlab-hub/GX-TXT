[meta]
api_version=1
id=demo.numeric.uncertainty
kind=analysis
group=Generic analysis / Numerical examples
name=Numerical Uncertainty Demo
version=1.0.1
selectable=1
default_enabled=0
core=0
enabled_key=
run_key=
runner=standard_octave
order=791
depends=math.numeric
description=External reference module demonstrating standard-uncertainty propagation and explicit weighted estimation through math.numeric NUMERIC_API_v1, canonical result publication and public Plot.dataset graphing.
config_hint=Use the Measurement Uncertainty Session Generator in GX-TXT Numerical Examples, import raw/measurement_uncertainty_demo.csv as table.generic, bind Measured value and Uncertainty / weight, choose the explicit interpretation, then run.

[inputs]
contracts=table.generic

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=table.generic

[bindings]
roles=value;aux

[binding.value]
label=Measured value variable
required=1
semantic_role=measured

[binding.aux]
label=Uncertainty / weight variable
required=1

[outputs]
files=uncertainty_metrics.ini;uncertainty_report.txt;render_cache.mat
datasets=table.generic

[graphs]
provider_api_version=1
ids=demo.numeric.uncertainty.measurements
default_ids=demo.numeric.uncertainty.measurements
rerender=standard_octave

[graph.demo.numeric.uncertainty.measurements]
name=Measurements and uncertainty-aware estimate
file=01_uncertainty_measurements.png
default_enabled=1
supports_legend=1
legend_editor=standard
legend_placements=inside;above;below;left;right;manual
legend_layouts=row;stacked;wrapped
config_fields=title;x_label;y_label;line_width;marker_size

[graph.demo.numeric.uncertainty.measurements.config.title]
type=string
label=Plot title
default=Measurement uncertainty demo

[graph.demo.numeric.uncertainty.measurements.config.x_label]
type=string
label=X-axis label
default=Measurement

[graph.demo.numeric.uncertainty.measurements.config.y_label]
type=string
label=Y-axis label (auto = measured variable and unit)
default=auto

[graph.demo.numeric.uncertainty.measurements.config.line_width]
type=double
label=Reference line width
default=1.4

[graph.demo.numeric.uncertainty.measurements.config.marker_size]
type=double
label=Measurement marker size
default=6

[runner]
script=plugins/modules/demo.numeric.uncertainty/runtime/demo_numeric_uncertainty.m
rerender_script=plugins/modules/demo.numeric.uncertainty/runtime/demo_numeric_uncertainty_rerender.m

[config]
fields=selection;input_interpretation;weight_semantics;nonfinite_policy;output_dataset_id

[config.selection]
type=selection
label=Data selection (optional X interval)
required=0
source_role=primary
selection_types=x_range

[config.input_interpretation]
type=choice
label=Input interpretation
default=standard_uncertainty
values=standard_uncertainty;explicit_weight
required=1

[config.weight_semantics]
type=choice
label=Explicit-weight semantics
default=inverse_variance
values=inverse_variance;relative
required=1

[config.nonfinite_policy]
type=choice
label=NaN / Inf policy
default=omit
values=omit;error
required=1

[config.output_dataset_id]
type=string
label=Result Dataset ID
default=demo.numeric.uncertainty.result
required=1

[documentation]
api_version=1
guide=MANUAL.md
api_refs=MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;DATASET_METADATA_API_v1;DATASET_SELECTION_API_v1;DATASET_VARIABLE_SCHEMA_API_v3;TABLE_STREAM_API_v3;DATASET_PUBLICATION_API_v2;NUMERIC_API_v1;PROGRESS_API_v1;GRAPH_PROVIDER_API_v1;PLOT_MODULE_API_v1;PLOT_DATASET_API_v2;PLUGIN_INSTALL_API_v1;SESSION_GENERATOR_LIBRARY_API_v1;UNIT_REGISTRY_API_v1;DOCUMENTATION_API_v1
examples=session_generators/gxtxt_numerical_examples_measurement_uncertainty_1.0.0.zip
changelog=CHANGELOG.md
