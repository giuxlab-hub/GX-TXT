[meta]
api_version=1
id=acq.scientific_spectrum
kind=acquisition
group=Scientific Libraries / Spectroscopy
name=Scientific Spectrum CSV and JCAMP
version=1.0.0
selectable=1
default_enabled=1
core=0
runner=standard_tcl
order=796
depends=
description=Scientific Spectrum CSV and JCAMP; reuses CORE scientific spectrum parsing and standard Acquisition ownership.
[acquisition_handler]
api_version=1
script=runtime/acquisition_handler.tcl
inspect_proc=::AcqScientificSpectrum::inspect
import_proc=::AcqScientificSpectrum::import
source_kind=text
variable_mapping=none
supports_batch=1
file_label=Scientific spectrum CSV or JCAMP
file_patterns=*.csv;*.jdx;*.dx;*.jcamp
formats=spectrum.csv;spectrum.jcamp
[documentation]
api_version=1
guide=README.md
api_refs=SCIENTIFIC_SPECTRUM_IMPORT_API_v1;SCIENTIFIC_SPECTRUM_API_v1;SCIENTIFIC_LIBRARY_MANAGER_API_v1

[inputs]
contracts=raw.spectrum
[outputs]
datasets=spectrum.scientific
files=raw/*;datasets/*.csv;metadata/datasets/*
[runner]
handler=scientific_spectrum
[library_acquisition]
api_version=1
record_types=scientific.spectrum
content_contracts=spectrum.scientific
[acquisition_format.spectrum.csv]
description=Actual numeric spectral CSV with explicit scientific axis semantics
mime=text/csv
extensions=*.csv
canonical_formats=csv
[acquisition_format.spectrum.jcamp]
description=Supported actual JCAMP-DX spectral source
mime=chemical/x-jcamp-dx
extensions=*.jdx;*.dx;*.jcamp
canonical_formats=csv
[config]
fields=dataset_id;source_format;spectrum_kind;x_quantity;x_unit;y_quantity;y_representation;y_unit;x_column;y_column;header;delimiter
[config.dataset_id]
type=string
label=Dataset Id
default=scientific.spectrum
required=1
[config.source_format]
type=string
label=Source Format
default=auto
required=0
[config.spectrum_kind]
type=string
label=Spectrum Kind
default=
required=0
[config.x_quantity]
type=string
label=X Quantity
default=
required=0
[config.x_unit]
type=string
label=X Unit
default=
required=0
[config.y_quantity]
type=string
label=Y Quantity
default=
required=0
[config.y_representation]
type=string
label=Y Representation
default=
required=0
[config.y_unit]
type=string
label=Y Unit
default=
required=0
[config.x_column]
type=string
label=X Column
default=1
required=0
[config.y_column]
type=string
label=Y Column
default=2
required=0
[config.header]
type=string
label=Header
default=1
required=0
[config.delimiter]
type=string
label=Delimiter
default=auto
required=0
