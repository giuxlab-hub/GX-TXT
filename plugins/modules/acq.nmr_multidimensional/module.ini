; GX-TXT acquired multidimensional NMRPipe import
; SPDX-License-Identifier: GPL-3.0-or-later
[meta]
api_version=1
id=acq.nmr_multidimensional
kind=acquisition
group=Instruments / Spectroscopy
name=Multidimensional NMRPipe import
version=1.0.0
core=0
selectable=1
default_enabled=1
runner=standard_tcl
order=73
description=Import phase-corrected acquired 2-D or true 3-D NMRPipe spectra with nucleus, ppm and exact source identity.
config_hint=Choose a processed real NMRPipe spectrum, then record its citation and usage rights.

[inputs]
contracts=raw.nmr

[outputs]
datasets=spectrum.nmr_multidimensional
files=raw/*;datasets/*;metadata/datasets.ini

[config]
fields=dataset_id;citation;license

[config.dataset_id]
type=string
label=Dataset ID
default=nmr.multidimensional
required=1

[config.citation]
type=string
label=Source citation or DOI
default=
required=0

[config.license]
type=string
label=Source license or usage rights
default=
required=0

[acquisition_handler]
api_version=1
script=runtime/acquisition_handler.tcl
inspect_proc=::GX::NmrMultiAcq::inspect
import_proc=::GX::NmrMultiAcq::import
dataset_preview_proc=::GX::NmrMultiAcq::preview
file_label=Processed 2-D and 3-D NMRPipe spectra
file_patterns=*.ft2;*.ft3;*.spec;*.dat;*.pip
supports_batch=1

[runner]
handler=nmr_multidimensional

[documentation]
api_version=1
guide=README.md
api_refs=ACQUISITION_HANDLER_PLUGIN_API_v1;DATASET_METADATA_API_v1
