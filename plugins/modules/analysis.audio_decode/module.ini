[meta]
api_version=1
id=analysis.audio_decode
kind=analysis
group=Generic analysis / Audio
name=Audio decode
version=2.0.1
selectable=1
default_enabled=0
core=1
enabled_key=
run_key=
runner=standard_octave
order=250
depends=
description=Decodes an audio.waveform source through CORE Audio Decode API v1 and publishes a canonical large timeseries.table through Dataset Publication API v2 and Storage Auto. Samples are decoded and published in bounded chunks; the uniform time coordinate is implicit rather than stored once per sample.
config_hint=Select an audio.waveform dataset as the source. The module preserves normalized full-scale amplitude semantics and can optionally scale 1.0 FS to a real unit. Storage and decoder backend details are handled by GX-TXT CORE.

[inputs]
contracts=audio.waveform

[outputs]
files=decode_info.txt
datasets=timeseries.table

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=audio.waveform

[config]
fields=amplitude_scale;amplitude_unit

[config.amplitude_scale]
type=double
label=Full-scale to real-unit scale (1.0 = keep normalized FS)
default=1
required=1

[config.amplitude_unit]
type=string
label=Amplitude unit (FS = normalized full-scale; e.g. V for a calibrated capture)
default=FS

[runner]
script=plugins/modules/analysis.audio_decode/runtime/analysis_audio_decode.m

[documentation]
api_version=1
guide=README.md
api_refs=MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;AUDIO_DECODE_API_v1;DATASET_PUBLICATION_API_v2;DATASET_PUBLICATION_V2_OCTAVE_BINDING;CANONICAL_DATASET_API_v2;TABLE_STREAM_API_v3;DATASET_VARIABLE_SCHEMA_API_v3;PROGRESS_API_v1;DOCUMENTATION_API_v1
examples=
changelog=CHANGELOG.md
