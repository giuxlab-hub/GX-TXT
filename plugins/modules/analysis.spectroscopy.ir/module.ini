[meta]
api_version=1
id=analysis.spectroscopy.ir
kind=analysis
group=Generic analysis / Spectral
name=IR Spectroscopy and Reference Matching
version=1.1.2
selectable=1
default_enabled=0
core=1
runner=standard_octave
order=350
depends=math.numeric
description=Dataset-native infrared preprocessing, peak extraction and transparent reference matching with persistent Scientific Reference Libraries. Generic vector/grid/statistical operations use NUMERIC_API_v1; result graphics use persistent plot.dataset variants.
config_hint=Bind the spectral coordinate and measured signal by Dataset variable. Confirm the ordinate representation, select an installed reference library and inspect processing/matching settings. Scores are similarities, not probabilities.

[inputs]
contracts=spectrum.scientific;table.generic

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=spectrum.scientific;table.generic

[bindings]
roles=spectral_x;spectral_y

[binding.spectral_x]
label=IR spectral coordinate
required=1
semantic_role=independent

[binding.spectral_y]
label=Measured IR signal
required=1
semantic_role=measured

[outputs]
files=ir_analysis_report.txt;01_ir_overlay.png;automatic_graphs.ini
datasets=spectrum.scientific;table.generic

[config]
fields=intensity_representation;reference_library_ids;range_min_cm1;range_max_cm1;baseline_method;baseline_degree;smoothing_method;smoothing_window;normalization;derivative_order;resample_step_cm1;matching_method;fingerprint_min_cm1;fingerprint_max_cm1;fingerprint_weight;peak_min_prominence;peak_tolerance_cm1;top_n;minimum_match_score

[config.intensity_representation]
type=choice
label=Measured ordinate representation (confirm explicitly)
default=absorbance
values=absorbance;absorption_index;transmittance_fraction;transmittance_percent;relative_transmission_signal
required=1

[config.reference_library_ids]
type=string
label=Installed reference library IDs (semicolon separated)
default=tum.refimp.ftir.2022
required=1

[config.range_min_cm1]
type=string
label=Minimum wavenumber [cm^-1]
default=500
required=1

[config.range_max_cm1]
type=string
label=Maximum wavenumber [cm^-1]
default=3700
required=1

[config.baseline_method]
type=choice
label=Baseline correction
default=none
values=none;linear;polynomial
required=1

[config.baseline_degree]
type=integer
label=Polynomial baseline degree
default=2
required=1

[config.smoothing_method]
type=choice
label=Smoothing
default=none
values=none;moving_mean;local_polynomial;savitzky_golay
required=1

[config.smoothing_window]
type=integer
label=Odd smoothing window [samples]
default=9
required=1

[config.normalization]
type=choice
label=Comparable intensity normalization
default=mean_center_unit_vector
values=unit_vector;mean_center_unit_vector
required=1

[config.derivative_order]
type=choice
label=Derivative order
default=0
values=0;1;2
required=1

[config.resample_step_cm1]
type=string
label=Matching grid step [cm^-1]
default=4
required=1

[config.matching_method]
type=choice
label=Full-range matching score
default=cosine
values=cosine;pearson;spectral_angle;normalized_residual
required=1

[config.fingerprint_min_cm1]
type=string
label=Fingerprint lower bound [cm^-1]
default=500
required=1

[config.fingerprint_max_cm1]
type=string
label=Fingerprint upper bound [cm^-1]
default=1500
required=1

[config.fingerprint_weight]
type=string
label=Fingerprint score weight [0..1]
default=0.35
required=1

[config.peak_min_prominence]
type=string
label=Peak prominence threshold (processed units)
default=0.03
required=1

[config.peak_tolerance_cm1]
type=string
label=Peak-position tolerance [cm^-1]
default=16
required=1

[config.top_n]
type=integer
label=Top-ranked candidates
default=10
required=1

[config.minimum_match_score]
type=string
label=Minimum score for a convincing match
default=0.6
required=1

[automatic_graphs]
provider=plot.dataset
api=PLOT_DATASET_API_v2
persistent_variants=1
requires_capabilities=series_kind_line;multi_dataset;axis_direction

[runner]
script=plugins/modules/analysis.spectroscopy.ir/runtime/analysis_spectroscopy_ir.m

[documentation]
api_version=1
guide=README.md
changelog=CHANGELOG.md
api_refs=SCIENTIFIC_SPECTRUM_API_v1;SCIENTIFIC_REFERENCE_LIBRARY_API_v1;NUMERIC_API_v1;DATASET_PUBLICATION_API_v2;PLOT_DATASET_API_v2;VIEWER_PROVIDER_API_v1
