[meta]
api_version=1
id=acq.generic_csv
kind=acquisition
group=Generic acquisition / import
name=Generic CSV dataset import
version=2
selectable=0
default_enabled=1
enabled_key=
run_key=
runner=standard_tcl
order=20
depends=
description=Imports one or many self-contained CSV tables as canonical datasets without GNU Octave. Batch mode assigns an independent dataset ID and contract to each CSV; sources are snapshotted in RAW and registered with SHA-256 provenance.
config_hint=Single-file import remains backward compatible. For multiple CSV files use the batch table; each row has its own dataset ID, contract, Preview and Variables mapping. Original headers and canonical aliases are inspected per dataset.

[inputs]
contracts=raw.csv

[outputs]
datasets=table.generic
files=raw/*;datasets/*.csv;metadata/datasets.ini

[graphs]
ids=

[config]
fields=dataset_id;dataset_kind;delimiter;header_rows

[config.dataset_id]
type=string
label=Canonical dataset ID
default=curve_family.primary
required=1

[config.dataset_kind]
type=string
label=Dataset contract / kind
default=curve_family.table
required=1

[config.delimiter]
type=choice
label=CSV delimiter
default=auto
values=auto;comma;semicolon;tab
required=1

[config.header_rows]
type=integer
label=Header rows
default=1
required=1

[runner]
handler=generic_csv

[documentation]
api_version=1
guide=README.md
api_refs=MODULE_API_v1;DATASET_API_v1;CONTRACT_REGISTRY_API_v1;DATASET_INSPECTION_VARIABLE_MAPPING_API_v1
examples=
changelog=
