[meta]
api_version=1
id=demo.visualization.surface3d
kind=analysis
group=Generic analysis / Visualization examples
name=3D Surface Visualization Demo
version=1.0.3
selectable=1
default_enabled=0
core=0
runner=standard_octave
order=795
depends=math.numeric;plot.dataset
description=Deterministic 3D scientific plotting demonstration. Validates a rectangular XYZ Dataset, computes summary statistics, and renders surface, mesh, and contour3 as persistent public Plot.dataset variants.
config_hint=Use the bundled 3D Thermal Surface Session Generator, import raw/thermal_surface_3d.csv, assign Variable Schema units/semantics, import metadata/thermal_surface_3d.metadata.txt, bind X/Y/Z, and run. The source Dataset is not copied or republished.

[inputs]
contracts=table.generic

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=table.generic

[bindings]
roles=x;y;z

[binding.x]
label=X coordinate
required=1
semantic_role=independent

[binding.y]
label=Y coordinate
required=1
semantic_role=independent

[binding.z]
label=Z value
required=1
semantic_role=measured

[outputs]
files=surface3d_report.txt;surface3d_metrics.ini;render_cache.mat

[render_cache]
api_version=1
rerender_from_cache=1

[graphs]
provider_api_version=1
ids=demo.visualization.surface3d.surface;demo.visualization.surface3d.mesh;demo.visualization.surface3d.contour3
default_ids=demo.visualization.surface3d.surface;demo.visualization.surface3d.mesh;demo.visualization.surface3d.contour3
rerender=standard_octave

[graph.demo.visualization.surface3d.surface]
name=Thermal field - surface
file=01_surface.png
default_enabled=1
supports_legend=0
config_fields=title;x_label;y_label;z_label

[graph.demo.visualization.surface3d.surface.config.title]
type=string
label=Plot title
default=3D thermal surface

[graph.demo.visualization.surface3d.surface.config.x_label]
type=string
label=X-axis label (auto = X position + display unit)
default=auto

[graph.demo.visualization.surface3d.surface.config.y_label]
type=string
label=Y-axis label (auto = Y position + display unit)
default=auto

[graph.demo.visualization.surface3d.surface.config.z_label]
type=string
label=Z-axis label (auto = Temperature + display unit)
default=auto

[graph.demo.visualization.surface3d.mesh]
name=Thermal field - mesh
file=02_mesh.png
default_enabled=1
supports_legend=0
config_fields=title;x_label;y_label;z_label

[graph.demo.visualization.surface3d.mesh.config.title]
type=string
label=Plot title
default=3D thermal mesh

[graph.demo.visualization.surface3d.mesh.config.x_label]
type=string
label=X-axis label (auto = X position + display unit)
default=auto

[graph.demo.visualization.surface3d.mesh.config.y_label]
type=string
label=Y-axis label (auto = Y position + display unit)
default=auto

[graph.demo.visualization.surface3d.mesh.config.z_label]
type=string
label=Z-axis label (auto = Temperature + display unit)
default=auto

[graph.demo.visualization.surface3d.contour3]
name=Thermal field - 3D contour
file=03_contour3.png
default_enabled=1
supports_legend=0
config_fields=title;x_label;y_label;z_label;contour_levels

[graph.demo.visualization.surface3d.contour3.config.title]
type=string
label=Plot title
default=3D thermal contours

[graph.demo.visualization.surface3d.contour3.config.x_label]
type=string
label=X-axis label (auto = X position + display unit)
default=auto

[graph.demo.visualization.surface3d.contour3.config.y_label]
type=string
label=Y-axis label (auto = Y position + display unit)
default=auto

[graph.demo.visualization.surface3d.contour3.config.z_label]
type=string
label=Z-axis label (auto = Temperature + display unit)
default=auto

[graph.demo.visualization.surface3d.contour3.config.contour_levels]
type=integer
label=Contour levels
default=12

[runner]
script=plugins/modules/demo.visualization.surface3d/runtime/demo_visualization_surface3d.m
rerender_script=plugins/modules/demo.visualization.surface3d/runtime/demo_visualization_surface3d_rerender.m

