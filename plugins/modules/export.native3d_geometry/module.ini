[meta]
api_version=1
id=export.native3d_geometry
kind=export
group=Export
name=Native3D Geometry Export
version=1.0.0
selectable=1
default_enabled=1
core=0
runner=service
order=866
depends=viewer.engine_3d
description=Complete-world STEP, STL and VTP with atomic scientific unit/provenance sidecars.
[extensions]
api_version=1
ids=step;stl;vtp;publish
[extension.publish]
name=Publish complete geometry as Dataset
category=utility
workbenches=viewer.3d_workbench
mutates=0
public_api=NATIVE3D_GEOMETRY_EXPORT_API_v1
command=::GX::Native3DGeometryExport::publish
required_apis=NATIVE_3D_GEOMETRY_API_v1
parameters=dataset_id;format;linear_deflection;angular_deflection;weld_tolerance;max_triangles;max_output_bytes
[extension.publish.parameter.dataset_id]
type=string
label=Public Dataset name / ID
default=
[extension.publish.parameter.format]
type=choice
label=Canonical geometry format
values=stl;step;vtp
default=stl
[extension.publish.parameter.linear_deflection]
type=number
label=B-Rep linear deflection (working unit)
default=.01
min=1e-300
[extension.publish.parameter.angular_deflection]
type=number
label=B-Rep angular deflection (radians)
default=.3
min=1e-300
max=3.141592653589793
[extension.publish.parameter.weld_tolerance]
type=number
label=Tessellation weld tolerance (working unit)
default=1e-8
min=1e-300
[extension.publish.parameter.max_triangles]
type=integer
label=Complete tessellation triangle budget
default=1000000
min=1
max=10000000
[extension.publish.parameter.max_output_bytes]
type=integer
label=Complete mesh byte budget
default=134217728
min=1
max=134217728
[extension.step]
name=Export exact STEP
category=exporter
workbenches=viewer.3d_workbench
mutates=0
public_api=NATIVE3D_GEOMETRY_EXPORT_API_v1
