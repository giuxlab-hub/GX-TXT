[meta]
api_version=1
id=acq.wav
kind=acquisition
group=Acquisition / Audio
name=WAV/PCM raw audio import
version=1.0.0
selectable=1
default_enabled=0
core=1
enabled_key=
run_key=
runner=standard_tcl
order=40
depends=
description=Imports raw (neutral) PCM audio as a first-class binary canonical dataset (audio.waveform). The WAV bytes are kept opaque and provenance-anchored; decoding to a time-series is a separate downstream step (see analysis.audio_decode). Compressed/lossy sources (MP3, AAC, OGG, ADPCM, mu-law...) are refused by design: they are not neutral raw sources.
config_hint=Select one or more WAV files. Each is verified to contain linear PCM (integer or IEEE float) by inspecting the fmt chunk content, not the file extension, then registered as a binary audio.waveform dataset. Non-PCM payloads are rejected with an explanation.

[inputs]
contracts=raw.audio.wav

[outputs]
datasets=audio.waveform
files=datasets/*;metadata/datasets.ini

[contracts]
provided=audio.waveform

[contract.audio.waveform]
description=Canonical opaque binary linear-PCM audio waveform.

[graphs]
ids=

[config]
fields=dataset_id

[config.dataset_id]
type=string
label=Dataset ID (blank = from file name)
default=
required=0

[runner]
handler=wav

[acquisition_handler]
api_version=1
script=runtime/acquisition_handler.tcl
inspect_proc=::AcqWav::inspect
import_proc=::AcqWav::import
dataset_preview_proc=::AcqWav::datasetPreview
file_label=WAV / PCM audio files
file_patterns=*.wav;*.wave
source_kind=binary
variable_mapping=none
supports_batch=1

[documentation]
api_version=1
guide=README.md
api_refs=ACQUISITION_HANDLER_PLUGIN_API_v1;PREVIEW_DESCRIPTOR_API_v1;BINARY_DATASET_FOUNDATION_v1;PLUGIN_INSTALL_API_v1;DOCUMENTATION_API_v1
examples=
changelog=CHANGELOG.md
