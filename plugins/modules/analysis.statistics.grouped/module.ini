[meta]
api_version=1
id=analysis.statistics.grouped
kind=analysis
group=Statistics
name=Grouped Statistics
version=1.0.0
selectable=1
default_enabled=0
core=1
enabled_key=
run_key=
runner=standard_octave
order=421
depends=math.numeric
summary=Descriptive statistics by one Dataset grouping variable.
description=Computes reusable descriptive statistics for one or more numeric variables split by one categorical or numeric grouping variable, publishes machine-readable results, and creates persistent plot.dataset grouped-summary variants without modifying source data.
config_hint=Choose a Canonical Dataset, add one or more numeric value variables, choose exactly one grouping variable, optionally choose an X-range Dataset Selection, then run.

[inputs]
contracts=table.generic;timeseries.table;curve_family.table

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=table.generic;timeseries.table;curve_family.table

[outputs]
files=grouped_statistics_report.txt;grouped_statistics_summary.ini;automatic_graphs.ini
datasets=table.generic

[config]
fields=values;grouping;selection;nonfinite_policy;missing_group_policy;output_dataset_id;render_graphs

[config.values]
type=table
dynamic=1
label=Value variables
min_rows=1
columns=variable

[config.values.variable]
type=variable
label=Numeric value variable
source=primary
required=1

[config.grouping]
type=table
dynamic=1
label=Grouping variable
min_rows=1
max_rows=1
columns=variable

[config.grouping.variable]
type=variable
label=Grouping variable
source=primary
required=1

[config.selection]
type=selection
label=Data selection (optional X interval)
required=0
source_role=primary
selection_types=x_range

[config.nonfinite_policy]
type=choice
label=NaN / Inf value policy
default=omit
values=omit;error
required=1

[config.missing_group_policy]
type=choice
label=Missing / invalid group policy
default=omit
values=omit;error
required=1

[config.output_dataset_id]
type=string
label=Grouped summary Dataset ID
default=statistics.grouped.summary
required=1

[config.render_graphs]
type=boolean
label=Create automatic grouped plots
default=1
required=1

[runner]
script=plugins/modules/analysis.statistics.grouped/runtime/analysis_statistics_grouped.m

[documentation]
api_version=1
guide=MANUAL.md
api_refs=MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;ANALYSIS_SOURCE_ACCESS_RUNTIME_v2;DATASET_VARIABLE_SCHEMA_API_v3;DATASET_SELECTION_API_v1;REPEATABLE_CONFIG_API_v1;TABLE_STREAM_API_v3;DATASET_PUBLICATION_API_v2;DATASET_PUBLICATION_V2_OCTAVE_BINDING;NUMERIC_API_v1;UNIT_REGISTRY_API_v1;PLOT_DATASET_API_v2;PLOT_DATASET_OCTAVE_BRIDGE_v1;PLUGIN_INSTALL_API_v1;PROGRESS_API_v1;SESSION_GENERATOR_LIBRARY_API_v1;DOCUMENTATION_API_v1
examples=session_generators/gxtxt_grouped_statistics_student_lab_1.0.0.zip
changelog=CHANGELOG.md
