[meta]
api_version=1
id=demo.numeric.nonlinear_fit
kind=analysis
group=Generic analysis / Numerical examples
name=Nonlinear fit integration demo
version=1.1.0
selectable=1
default_enabled=0
core=0
runner=standard_octave
order=790
depends=math.numeric
description=Fits the deterministic nonlinear example through NUMERIC_API_v1, publishes a canonical measured-versus-fitted Dataset, validates the recovered parameters against the Session Generator ground truth, and renders the fit graph.
config_hint=Use a Session created with GX-TXT Numerical Examples / Nonlinear Fitting. Import raw/nonlinear_fitting.csv with acq.generic_csv, select the imported Dataset as the primary Analysis Source, then bind primary.x and primary.y before running. The runtime resolves those canonical binding tokens to stable Dataset variable_id values before calling NUMERIC_API_v1.

[inputs]
contracts=table.generic;timeseries.table

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=table.generic;timeseries.table

[outputs]
files=fit_report.txt;fit_metrics.ini;render_cache.mat
datasets=table.generic

[graphs]
provider_api_version=1
ids=demo.nonlinear.fit.curve
default_ids=demo.nonlinear.fit.curve
rerender=standard_octave

[graph.demo.nonlinear.fit.curve]
name=Generated observations and nonlinear fit
file=01_nonlinear_fit.png
default_enabled=1
supports_legend=1
legend_editor=standard
legend_placements=inside;above;below;left;right;manual
legend_layouts=row;stacked;wrapped
supports_annotations=1
annotation_editor=standard
annotation_types=text;line;arrow;rectangle;ellipse
annotation_coordinate_spaces=figure_norm
config_fields=title;x_label;y_label

[graph.demo.nonlinear.fit.curve.config.title]
type=string
label=Plot title
default=Nonlinear fitting - generated observations and exponential fit

[graph.demo.nonlinear.fit.curve.config.x_label]
type=string
label=X-axis label
default=x

[graph.demo.nonlinear.fit.curve.config.y_label]
type=string
label=Y-axis label
default=y

[config]
fields=

[bindings]
roles=x;y

[binding.x]
label=X variable (choose primary.x for the generated example)
required=1

[binding.y]
label=Y variable (choose primary.y for the generated example)
required=1

[runner]
script=plugins/modules/demo.numeric.nonlinear_fit/runtime/demo_numeric_nonlinear_fit.m
rerender_script=plugins/modules/demo.numeric.nonlinear_fit/runtime/demo_numeric_nonlinear_fit_rerender.m

[documentation]
api_version=1
guide=MANUAL.md
api_refs=STATISTICAL_RESULT_SEMANTICS_API_v1;MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;NUMERIC_API_v1;DATASET_PUBLICATION_API_v2;GRAPH_PROVIDER_API_v1;PLOT_MODULE_API_v1;PLUGIN_INSTALL_API_v1
examples=
changelog=CHANGELOG.md

[statistical_results]
api_version=1
semantics_api=STATISTICAL_RESULT_SEMANTICS_API_v1
boundary=runtime/demo_numeric_nonlinear_fit_main.m
publication_validation=gxtxt_publication_v2_open
publication_required=1
