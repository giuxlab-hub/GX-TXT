[config]
fields=nominal_carrier_hz;carrier_search_mode;carrier_lock_tolerance;carrier_search_min_hz;carrier_search_max_hz;comparison_plot_mode;normalization_method;pretest_mode;manual_pre_ms;manual_post_ms;min_signal_amplitude_v;threshold_fraction;noise_sigma_multiplier;burst_gap_periods;cluster_relative_tolerance;cluster_guard;cluster_max_ratio;max_overview_points;carrier_periods_to_plot


[config.nominal_carrier_hz]
type=double
label=Nominal carrier frequency [Hz]
default=38000
required=1

[config.carrier_search_mode]
type=choice
label=Carrier search mode
default=nominal_recovery
values=nominal_recovery;strict_nominal;automatic
required=1

[config.carrier_lock_tolerance]
type=double
label=Carrier lock tolerance around nominal period [fraction]
default=0.20
required=1

[config.carrier_search_min_hz]
type=double
label=Automatic carrier search minimum [Hz]
default=33000
required=1

[config.carrier_search_max_hz]
type=double
label=Automatic carrier search maximum [Hz]
default=60000
required=1

[config.comparison_plot_mode]
type=choice
label=Comparison graph mode
default=stacked
values=stacked;overlay
required=1

[config.normalization_method]
type=choice
label=Optional normalized comparison method
default=peak
values=peak;vpp;rms
required=1

[config.pretest_mode]
type=choice
label=Pretest window
default=auto
values=auto;manual
required=1

[config.manual_pre_ms]
type=double
label=Manual pre-trigger window [ms]
default=5
required=1

[config.manual_post_ms]
type=double
label=Manual post-trigger window [ms]
default=40
required=1

[config.min_signal_amplitude_v]
type=double
label=Minimum plausible signal excursion [V]
default=0.050
required=1

[config.threshold_fraction]
type=double
label=Carrier threshold / signal amplitude
default=0.30
required=1

[config.noise_sigma_multiplier]
type=double
label=Carrier threshold / pretrigger noise sigma
default=8
required=1

[config.burst_gap_periods]
type=double
label=MARK separation gap [carrier periods]
default=3.0
required=1

[config.cluster_relative_tolerance]
type=double
label=Duration clustering relative tolerance
default=0.20
required=1

[config.cluster_guard]
type=boolean
label=Use guarded span-limited duration clustering
default=1
required=1

[config.cluster_max_ratio]
type=double
label=Maximum max/min ratio inside guarded cluster
default=1.60
required=1

[config.max_overview_points]
type=integer
label=Maximum overview min/max bins
default=6000
required=1

[config.carrier_periods_to_plot]
type=integer
label=Carrier periods shown in detail graph
default=12
required=1

[bindings]
roles=signal;time;compare1;compare2;compare3;compare4;compare5;compare6;compare7

[binding.signal]
label=IR waveform signal (primary Dataset)
required=1
semantic_role=signal

[binding.time]
label=Time variable (primary Dataset; Auto uses time_s)
required=0
semantic_role=time

