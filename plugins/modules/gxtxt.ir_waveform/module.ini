[meta]
api_version=1
id=gxtxt.ir_waveform
kind=analysis
group=GX-TXT / Remote Control Tester
name=IR waveform / MARK-SPACE analysis
version=3.6.2
selectable=1
default_enabled=0
enabled_key=
run_key=
runner=standard_octave
order=100
depends=math.numeric;plot.dataset
description=Analyzes a canonical time-series IR waveform, measures the carrier, reconstructs MARK/SPACE bursts, groups recurring durations and produces diagnostic graphs. Acquisition is intentionally external to this module.
config_hint=Select the canonical input Dataset in Dataset sources as primary, then bind the IR signal from primary.*. Add optional source rows only when comparison traces come from other Datasets. The time binding may be left on Auto when the primary Dataset uses time_s.

[inputs]
contracts=timeseries.table

[analysis_sources]
api_version=1
ids=primary
dynamic=1

[analysis_source.primary]
required=1
contracts=timeseries.table

[outputs]
files=eventi_mark_space.csv;burst.csv;duration_clusters_comparison.csv;analog_chain_comparison.csv;analog_chain_timeseries.csv;ir_analysis_manifest.ini;riepilogo_VIR.txt;render_cache.mat

[graphs]
provider_api_version=1
ids=ir.full;ir.carrier;ir.markspace;ir.durations;ir.compare;ir.compare_baseline;ir.compare_envelope;ir.compare_gain;ir.compare_margin;ir.compare_normalized
default_ids=ir.full;ir.carrier;ir.markspace;ir.durations
rerender=standard_octave

[graph.ir.full]
name=IR command overview
default_enabled=1
