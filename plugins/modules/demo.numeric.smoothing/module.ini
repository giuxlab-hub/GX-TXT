contracts=table.generic

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=table.generic

[bindings]
roles=x;measured;reference

[binding.x]
label=Independent X variable
required=1
semantic_role=independent

[binding.measured]
label=Measured / noisy Y variable
required=1
semantic_role=measured

[binding.reference]
label=Reference / clean Y variable
required=1
semantic_role=reference

[outputs]
files=smoothing_metrics.ini;smoothing_report.txt;render_cache.mat
datasets=table.generic

