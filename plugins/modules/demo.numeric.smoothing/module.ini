[meta]
api_version=1
id=demo.numeric.smoothing
kind=analysis
group=Generic analysis / Numerical examples
name=Numerical Smoothing Demo
version=1.1.0
selectable=1
default_enabled=0
core=0
enabled_key=
run_key=
runner=standard_octave
order=786
depends=math.numeric
description=External reference module demonstrating Dataset-native moving mean, moving median, Savitzky-Golay and local-polynomial smoothing through math.numeric NUMERIC_API_v1, canonical derived Dataset publication, deterministic reference diagnostics and automatic GX-TXT graphs.
config_hint=Use the portable Smoothing Session Generator in GX-TXT Numerical Examples, import the generated raw/smoothing_demo.csv as a table.generic Dataset, bind X, measured Y and reference Y, configure smoothing windows/degrees if required, then run the module.

