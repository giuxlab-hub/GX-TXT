[meta]
api_version=1
id=analysis.spectroscopy.uvvis
kind=analysis
group=Generic analysis / Spectral
name=UV/Vis Spectral Family Quantitation
version=1.2.0
selectable=1
default_enabled=0
core=1
runner=standard_octave
order=355
depends=math.numeric
description=Selected-wavelength UV/Vis family quantitation using public NUMERIC_API_v1 for reusable mathematics and persistent plot.dataset variants for family, calibration and residual graphics.
config_hint=Select a spectrum.family Dataset. Confirm the analytical wavelength and any optional blank/unknown Spectrum sources. Enter held-out member IDs only for explicitly labeled validation samples; individual replicates are retained.

[inputs]
contracts=spectrum.family;spectrum.scientific

[statistical_results]
publication_required=1
semantics_api=STATISTICAL_RESULT_SEMANTICS_API_v1
boundary=runtime/uvvis_pipeline.tcl
publication_validator=CORE datasetPublicationV2Prepare

[analysis_sources]
api_version=1
ids=primary;blank;unknown
dynamic=0

[analysis_source.primary]
required=1
contracts=spectrum.family

[analysis_source.blank]
required=0
contracts=spectrum.scientific

[analysis_source.unknown]
required=0
contracts=spectrum.scientific

[outputs]
files=uvvis_report.md;01_family_overlay.png;02_calibration.png;03_residuals.png;automatic_graphs.ini
datasets=table.generic

[config]
fields=analytical_wavelength_nm;heldout_member_ids;blank_correction;peak_search_min_nm;peak_search_max_nm

[config.analytical_wavelength_nm]
type=string
label=Analytical wavelength [nm]
default=280
required=1

[config.heldout_member_ids]
type=string
label=Held-out validation member IDs (semicolon separated)
default=
required=0

[config.blank_correction]
type=choice
label=Absorbance blank correction
default=none
values=none;subtract_blank_absorbance
required=1

[config.peak_search_min_nm]
type=string
label=Peak search minimum [nm]
default=250
required=1

[config.peak_search_max_nm]
type=string
label=Peak search maximum [nm]
default=800
required=1

[automatic_graphs]
provider=plot.dataset
api=PLOT_DATASET_API_v2
persistent_variants=1
requires_capabilities=series_kind_line;series_kind_scatter;series_family_grouping;multi_dataset;annotations_reference_line

[runner]
script=plugins/modules/analysis.spectroscopy.uvvis/runtime/analysis_spectroscopy_uvvis.m

[documentation]
api_version=1
guide=MANUAL.md
changelog=CHANGELOG.md
api_refs=STATISTICAL_RESULT_SEMANTICS_API_v1;SPECTRAL_FAMILY_API_v1;SCIENTIFIC_SPECTRUM_API_v1;NUMERIC_API_v1;DATASET_PUBLICATION_API_v2;PLOT_DATASET_API_v2
