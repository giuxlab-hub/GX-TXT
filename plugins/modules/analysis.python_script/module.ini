[public_api.PYTHON_SCRIPT_EDITOR_API_v1]
public_contract=schema gxtxt.public_api_documentation.v1 purpose {Python-only Script Registry adapter; exact source SHA, immutable existing scope/ID and typed metadata apply. Delete uses existing resource lifecycle/dependency refusal; saving opens no scientific execution.} context {Inert provider-owned trusted-host documentation only. No provider activation, scientific work, Script/SDK authorization or generic invocation is granted.} operations {workspaceList {command ::GX::PythonScriptEditor::workspaceList arguments {} parameters {} result {type {list of script metadata dictionaries} description {Language-filtered Registry records with stable reference; Octave appends legacy Document references.}} context {trusted host service. Python-only Script Registry adapter; exact source SHA, immutable existing scope/ID and typed metadata apply. Delete uses existing resource lifecycle/dependency refusal; saving opens no scientific execution.}} workspaceRead {command ::GX::PythonScriptEditor::workspaceRead arguments reference parameters {reference {type {Script Registry reference} description {Stable user:<id>/session:<id>; Octave additionally accepts documented legacy:<DocumentID> reads.}}} result {type {script metadata/source dictionary} description {Existing language-checked Registry or supported legacy record, actual UTF-8 code and source SHA.}} context {trusted host service. Python-only Script Registry adapter; exact source SHA, immutable existing scope/ID and typed metadata apply. Delete uses existing resource lifecycle/dependency refusal; saving opens no scientific execution.}} workspaceSave {command ::GX::PythonScriptEditor::workspaceSave arguments {reference expectedSha scope scriptId name version description requiredApis parameters code} parameters {reference {type {Script Registry reference} description {Stable user:<id>/session:<id>; Octave additionally accepts documented legacy:<DocumentID> reads.}} expectedSha {type {expected SHA-256 string} description {Prior exact source/Document SHA for optimistic update/delete; actual owner enforces the operation-specific blank/stale policy.}} scope {type {Script Registry scope choice} description {user or session; save-copy/create policy stays with the existing Registry owner.}} scriptId {type {stable Script Registry ID} description {Validated logical script ID; existing scope/ID cannot be changed by update.}} name {type {display name string} description {Human-readable record name; does not replace its stable logical identity.}} version {type {semantic version string} description {Script metadata version validated by the existing Script Registry owner.}} description {type {description string} description {Script metadata text passed to the existing Registry/legacy Document owner.}} requiredApis {type {API-requirement dictionary} description {Required API IDs/versions for actual later script admission; this metadata call grants no access.}} parameters {type {typed Script Registry parameter dictionary} description {Declared script parameter schema; provider validation remains authoritative and saving runs no script.}} code {type {UTF-8 executable script source string} description {Actual language source stored through Script Registry/legacy Document owner; saving does not execute it.}}} result {type {Script Registry receipt dictionary} description {Exact created/updated script identity/reference/revision/SHA through existing Registry; no execution.}} context {trusted host service. Python-only Script Registry adapter; exact source SHA, immutable existing scope/ID and typed metadata apply. Delete uses existing resource lifecycle/dependency refusal; saving opens no scientific execution.}} workspaceDelete {command ::GX::PythonScriptEditor::workspaceDelete arguments {reference expectedSha} parameters {reference {type {Script Registry reference} description {Stable user:<id>/session:<id>; Octave additionally accepts documented legacy:<DocumentID> reads.}} expectedSha {type {expected SHA-256 string} description {Prior exact source/Document SHA for optimistic update/delete; actual owner enforces the operation-specific blank/stale policy.}}} result {type {Script Registry reference string} description {Actual removed user/session script reference after exact language/SHA/dependency checks through Resource Lifecycle.}} context {trusted host service. Python-only Script Registry adapter; exact source SHA, immutable existing scope/ID and typed metadata apply. Delete uses existing resource lifecycle/dependency refusal; saving opens no scientific execution.}} viewerDispatch {command ::GX::PythonScriptEditor::viewerDispatch arguments {action scene} parameters {action {type {Viewer lifecycle action string} description {Actual backend operation; open/rerender support or ignored action semantics are explicitly stated by this operation.}} scene {type {resolved Viewer scene dictionary} description {Host-supplied Viewer scene; only documented open_context fields are consumed, or explicitly ignored by this backend.}}} result {type {Tk window path} description {Opens existing Python Script Workspace UI for open/rerender; scene is ignored.}} context {Viewer Provider callback. Python-only Script Registry adapter; exact source SHA, immutable existing scope/ID and typed metadata apply. Delete uses existing resource lifecycle/dependency refusal; saving opens no scientific execution.}}}
