[meta]
api_version=1
id=acq.crystal_density
kind=acquisition
group=Acquisition / Chemistry
name=Crystal and Electron Density Import
version=1.0.0
selectable=1
default_enabled=1
core=0
runner=standard_tcl
order=158
depends=viewer.crystal_structure
description=Preserves and registers CIF crystal structures and Gaussian CUBE scalar fields as canonical scientific Datasets.
config_hint=Select a CIF or CUBE file; the original bytes, SHA-256 and crystallographic or field metadata are preserved.

[inputs]
contracts=raw.crystal;raw.volumetric_field

[outputs]
datasets=structure.crystal;field.scalar_3d
files=datasets/*;metadata/datasets.ini;metadata/datasets/*

[contracts]
provided=structure.crystal;field.scalar_3d

[contract.structure.crystal]
description=Source-preserving CIF crystallographic structure, with unit cell, space group, sites and symmetry metadata.

[contract.field.scalar_3d]
description=Source-preserving Gaussian CUBE scalar grid with embedded atom positions, axes, units and value range.

[config]
fields=dataset_id

[config.dataset_id]
type=string
label=Default Dataset ID
default=chemistry.source
required=1

[runner]
handler=crystal_density

[acquisition_handler]
api_version=1
script=runtime/acquisition_handler.tcl
inspect_proc=::AcqCrystalDensity::inspect
import_proc=::AcqCrystalDensity::import
dataset_preview_proc=::AcqCrystalDensity::datasetPreview
file_label=CIF crystal and Gaussian CUBE files
file_patterns=*.cif;*.CIF;*.cube;*.CUBE;*.cub;*.CUB
supports_batch=1
source_kind=binary
variable_mapping=none
capabilities=batch;dataset_preview
formats=chemistry.cif;chemistry.cube

[acquisition_format.chemistry.cif]
description=Crystallographic Information File
mime=chemical/x-cif
extensions=*.cif
canonical_formats=cif

[acquisition_format.chemistry.cube]
description=Gaussian CUBE scalar field
mime=chemical/x-gaussian-cube
extensions=*.cube;*.cub
canonical_formats=cube

[documentation]
api_version=1
guide=README.md
api_refs=ACQUISITION_HANDLER_PLUGIN_API_v1;DATASET_METADATA_API_v1
