; GX-TXT focused hypothesis tests.
; SPDX-License-Identifier: GPL-3.0-or-later
[meta]
api_version=1
id=analysis.statistics.tests
kind=analysis
group=Statistics
name=Hypothesis Tests
version=1.1.0
selectable=1
default_enabled=0
core=0
runner=standard_octave
order=470
depends=math.numeric
summary=Explicit one-sample, two-sample, Welch, paired, rank-sum and signed-rank tests.
description=Uses public NUMERIC_API hypothesis primitives and publishes machine-readable test results.
config_hint=Choose the exact test method and alternative; provide a second variable except for one-sample t.
[inputs]
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table
[analysis_sources]
api_version=1
ids=primary
dynamic=0
[analysis_source.primary]
required=1
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table
[outputs]
files=tests_report.txt;tests_summary.ini;automatic_graphs.ini
datasets=table.generic
[config]
fields=first_variable;second_variable;selection;method;mu0;alternative;confidence;nonfinite_policy;output_dataset_id
[config.first_variable]
type=variable
label=First numeric sample
source=primary
required=1
[config.second_variable]
type=variable
label=Second numeric sample (except one-sample t)
source=primary
required=0
[config.selection]
type=selection
label=Data selection (optional X interval)
source_role=primary
selection_types=x_range;rectangle
required=0
[config.method]
type=choice
label=Test method
default=one_sample_t
values=one_sample_t;independent_t;welch_t;paired_t;mann_whitney;signed_rank
required=1
[config.mu0]
type=number
label=Null mean or mean difference (t-tests)
default=0
[config.alternative]
type=choice
label=Alternative hypothesis
default=two_sided
values=two_sided;greater;less
required=1
[config.confidence]
type=number
label=Confidence level
default=0.95
required=1
[config.nonfinite_policy]
type=choice
label=NaN / Inf policy
default=omit
values=omit;error
required=1
[config.output_dataset_id]
type=string
label=Result Dataset ID
default=statistics.tests.result
required=1
[runner]
script=plugins/modules/analysis.statistics.tests/runtime/analysis_statistics_tests.m
[documentation]
api_version=1
guide=MANUAL.md
api_refs=STATISTICAL_RESULT_SEMANTICS_API_v1;MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;ANALYSIS_SOURCE_ACCESS_RUNTIME_v2;DATASET_SELECTION_API_v1;TABLE_STREAM_API_v3;DATASET_PUBLICATION_API_v2;NUMERIC_API_v1;UNIT_REGISTRY_API_v1
changelog=CHANGELOG.md

[statistical_results]
api_version=1
semantics_api=STATISTICAL_RESULT_SEMANTICS_API_v1
boundary=runtime/analysis_statistics_tests_main.m
publication_validation=gxtxt_publication_v2_open
publication_required=1
