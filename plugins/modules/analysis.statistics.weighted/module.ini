[meta]
api_version=1
id=analysis.statistics.weighted
kind=analysis
group=Statistics
name=Weighted Statistics
version=1.1.0
selectable=1
default_enabled=0
core=0
runner=standard_octave
order=460
depends=math.numeric
summary=Weighted summaries and quantiles with explicit statistical-weight or uncertainty semantics.
description=Uses stable Dataset variables, optional Selection and public NUMERIC_API weighted primitives.
config_hint=Choose a value and weight or uncertainty variable, then explicitly choose the weight model.
[inputs]
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table
[analysis_sources]
api_version=1
ids=primary
dynamic=0
[analysis_source.primary]
required=1
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table
[outputs]
files=weighted_report.txt;weighted_summary.ini;automatic_graphs.ini
datasets=table.generic
[config]
fields=value_variable;weight_variable;selection;weight_model;mean_se_model;nonfinite_policy;quantile_probabilities;output_dataset_prefix
[config.value_variable]
type=variable
label=Numeric measurement
source=primary
required=1
[config.weight_variable]
type=variable
label=Statistical weight or measurement uncertainty
source=primary
required=1
[config.selection]
type=selection
label=Data selection (optional X interval)
source_role=primary
selection_types=x_range;rectangle
required=0
[config.weight_model]
type=choice
label=Weight semantics
default=statistical_weight
values=statistical_weight;inverse_variance_uncertainty
required=1
[config.mean_se_model]
type=choice
label=Mean uncertainty model
default=none
values=none;sampling
required=1
[config.nonfinite_policy]
type=choice
label=NaN / Inf policy
default=omit
values=omit;error
required=1
[config.quantile_probabilities]
type=string
label=Weighted quantile probabilities
default=0;0.25;0.5;0.75;1
[config.output_dataset_prefix]
type=string
label=Output Dataset ID prefix
default=statistics.weighted
required=1
[runner]
script=plugins/modules/analysis.statistics.weighted/runtime/analysis_statistics_weighted.m
[documentation]
api_version=1
guide=MANUAL.md
api_refs=STATISTICAL_RESULT_SEMANTICS_API_v1;MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;ANALYSIS_SOURCE_ACCESS_RUNTIME_v2;DATASET_SELECTION_API_v1;TABLE_STREAM_API_v3;DATASET_PUBLICATION_API_v2;NUMERIC_API_v1;UNIT_REGISTRY_API_v1
changelog=CHANGELOG.md

[statistical_results]
api_version=1
semantics_api=STATISTICAL_RESULT_SEMANTICS_API_v1
boundary=runtime/analysis_statistics_weighted_main.m
publication_validation=gxtxt_publication_v2_open
publication_required=1
