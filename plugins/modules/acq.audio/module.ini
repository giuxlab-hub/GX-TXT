[meta]
api_version=1
id=acq.audio
kind=acquisition
group=Acquisition / Audio
name=Audio file import
version=1.0.1
core=1
selectable=1
default_enabled=0
enabled_key=
run_key=
runner=standard_tcl
order=45
depends=
description=Imports self-describing audio files supported by GX-TXT Audio Decode API v1, plus explicitly described raw PCM, as opaque canonical audio.source datasets. The original encoded or PCM bytes are preserved byte-for-byte while technical metadata and source tags are attached through Dataset Metadata API v1 for normal runtime transport to future consumers.
config_hint=Use source batch for multi-file import. WAV, FLAC, MP3, AAC, OGG/Opus and other FFmpeg/FFprobe-supported audio are probed automatically. Headerless .pcm/.raw sources require explicit raw PCM format, sample rate and channel count. Raw PCM settings are module-wide defaults for the current import run.

[inputs]
contracts=raw.audio

[outputs]
datasets=audio.source
files=datasets/*;metadata/datasets.ini;metadata/datasets/*

[contracts]
provided=audio.source

[contract.audio.source]
description=Canonical opaque audio source preserving the original source bytes. The source may be compressed, lossless, lossy, containerized PCM or explicitly described headerless raw PCM; decoding to scientific sample variables is a downstream operation.

[config]
fields=dataset_id;audio_stream_index;raw_pcm_input_format;raw_pcm_sample_rate;raw_pcm_channels

[config.dataset_id]
type=string
label=Default Dataset ID
default=audio.source
required=1

[config.audio_stream_index]
type=string
label=Audio stream index (blank = first audio stream)
default=
required=0

[config.raw_pcm_input_format]
type=choice
label=Raw PCM sample format (.pcm/.raw only)
default=none
values=none;u8;s16le;s16be;s24le;s24be;s32le;s32be;f32le;f32be;f64le;f64be
required=1

[config.raw_pcm_sample_rate]
type=integer
label=Raw PCM sample rate [Hz] (.pcm/.raw only)
default=0
required=1

[config.raw_pcm_channels]
type=integer
label=Raw PCM channel count (.pcm/.raw only)
default=0
required=1

[runner]
handler=audio

[acquisition_handler]
api_version=1
script=runtime/acquisition_handler.tcl
inspect_proc=::AcqAudio::inspect
import_proc=::AcqAudio::import
dataset_preview_proc=::AcqAudio::datasetPreview
file_label=Audio files (GX-TXT Audio Decode API)
file_patterns=*
source_kind=binary
variable_mapping=none
supports_batch=1
capabilities=batch;dataset_preview
formats=audio.source;audio.raw_pcm

[acquisition_format.audio.source]
description=Self-describing audio source recognized by GX-TXT Audio Decode API v1 / FFprobe.
mime=application/octet-stream
extensions=*
canonical_formats=binary

[acquisition_format.audio.raw_pcm]
description=Headerless raw PCM source requiring explicit input format, sample rate and channel count.
mime=audio/x-raw
extensions=*.pcm;*.raw
canonical_formats=binary

[documentation]
api_version=1
guide=AUDIO_IMPORTER_GUIDE.md
api_refs=MODULE_API_v1;ACQUISITION_HANDLER_PLUGIN_API_v1;DATASET_METADATA_API_v1;ANALYSIS_SOURCE_METADATA_RUNTIME_v1;AUDIO_DECODE_API_v1;BINARY_DATASET_FOUNDATION_v1;PREVIEW_DESCRIPTOR_API_v1;PLUGIN_INSTALL_API_v1;DOCUMENTATION_API_v1
examples=
changelog=CHANGELOG.md
