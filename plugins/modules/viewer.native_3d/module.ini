[meta]
api_version=1
id=viewer.native_3d
deprecated=1
replacement=viewer.engine_3d
kind=viewer
group=Viewers
name=Legacy 3D Viewer (Deprecated)
version=0.9.6
selectable=1
default_enabled=1
core=0
runner=service
order=855
depends=
description=LEGACY / DEPRECATED. Retained for historical compatibility and selected legacy uses. New development must use viewer.engine_3d and modern public CORE Native3D APIs.
config_hint=Import geometry into a Session, open the viewer and select a compatible Dataset. Public Viewer Provider scenes can render VTP/VTU scientific geometry and VTI scalar isosurfaces.

[config]
fields=memory_budget_mib;interactive_triangle_budget;interactive_gpu_budget_mib

[config.memory_budget_mib]
label=Native 3D preprocessing memory budget (MiB)
type=integer
default=4096
persistent_default=1

[config.interactive_triangle_budget]
label=Native 3D presentation triangle budget
type=integer
default=1000000
persistent_default=1

[config.interactive_gpu_budget_mib]
label=Native 3D display memory budget (MiB)
type=integer
default=1024
persistent_default=1

[inputs]
contracts=geometry.mesh;model.cad;application/sla;model/obj;model/step

[outputs]
datasets=

[viewers]
api_version=1
ids=native_3d

[viewer.native_3d]
name=Legacy 3D Viewer (Deprecated)
backend=gx3d_native_host
activation_api=NATIVE_3D_VIEWER_API_v1
supported_primitives=triangle_mesh;geometry;surface;points;trajectory;isosurface
artifact_formats=stl;obj;step;stp;vtu;vtp;vti;gxtxt.external_3d_reference
capabilities=camera;clipping;opacity;native;lod;cache;session_persistence;multilayer;scalar;vector;mesh_repeat_instancing;display_patterns

[public_apis]
ids=NATIVE_3D_VIEWER_API_v1

[public_api.NATIVE_3D_VIEWER_API_v1]
api_version=1
name=Native 3D Viewer backend
entrypoint=api/native_3d_viewer_api_v1.tcl
namespace=::GX::Native3D
capabilities=viewer_backend;native_process;session_state;mesh_import;step_tessellation;vtu_scientific_layer;dataset_points_layer;scientific_scene;vtp_polydata;vti_isosurface;mesh_repeat_instancing;display_patterns;named_renderer_controls;plot_dataset_graph_source;manual_graph_sync
documentation=NATIVE_3D_VIEWER_API_v1.md

[documentation]
api_version=1
guide=MANUAL.md
changelog=CHANGELOG.md
third_party_notices=THIRD_PARTY_NOTICES.md
api_refs=VIEWER_PROVIDER_API_v1;INTERACTIVE_DOCUMENT_API_v1;DATASET_API_v1
