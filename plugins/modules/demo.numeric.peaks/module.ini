[meta]
api_version=1
id=demo.numeric.peaks
kind=analysis
group=Generic analysis / Numerical examples
name=Numerical Peak Detection Demo
version=1.0.2
selectable=1
default_enabled=0
core=0
enabled_key=
run_key=
runner=standard_octave
order=790
depends=math.numeric
description=External reference module demonstrating Dataset-aware peak detection through math.numeric NUMERIC_API_v1, canonical peak publication, a human-readable report and an automatic GX-TXT graph.
config_hint=Use the Peak Detection Session Generator in GX-TXT Numerical Examples, import raw/peak_detection_demo.csv as table.generic, bind X and Signal Y, then run.

[inputs]
contracts=table.generic

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=table.generic

[bindings]
roles=x;signal

[binding.x]
label=Independent X variable
required=1
semantic_role=independent

[binding.signal]
label=Signal Y variable
required=1
semantic_role=measured

[outputs]
files=peak_detection_metrics.ini;peak_detection_report.txt;render_cache.mat
datasets=table.generic

[graphs]
provider_api_version=1
ids=demo.numeric.peaks.detected
default_ids=demo.numeric.peaks.detected
rerender=standard_octave

[graph.demo.numeric.peaks.detected]
name=Signal with detected peaks
file=01_peak_detection.png
default_enabled=1
supports_legend=1
legend_editor=standard
legend_placements=inside;above;below;left;right;manual
legend_layouts=row;stacked;wrapped
config_fields=title;x_label;y_label;line_width;marker_size

[graph.demo.numeric.peaks.detected.config.title]
type=string
label=Plot title
default=Peak detection demo

[graph.demo.numeric.peaks.detected.config.x_label]
type=string
label=X-axis label (auto = source variable and unit)
default=auto

[graph.demo.numeric.peaks.detected.config.y_label]
type=string
label=Y-axis label (auto = signal variable and unit)
default=auto

[graph.demo.numeric.peaks.detected.config.line_width]
type=double
label=Signal line width
default=1.3

[graph.demo.numeric.peaks.detected.config.marker_size]
type=double
label=Peak marker size
default=8

[runner]
script=plugins/modules/demo.numeric.peaks/runtime/demo_numeric_peaks.m
rerender_script=plugins/modules/demo.numeric.peaks/runtime/demo_numeric_peaks_rerender.m

[config]
fields=selection;nonfinite_policy;min_height;min_prominence;min_distance;distance_mode;relative_height;output_dataset_id

[config.selection]
type=selection
label=Data selection (optional X interval)
required=0
source_role=primary
selection_types=x_range

[config.nonfinite_policy]
type=choice
label=NaN / Inf policy
default=omit
values=omit;error
required=1

[config.min_height]
type=double
label=Minimum peak height
default=0.5
required=1

[config.min_prominence]
type=double
label=Minimum prominence
default=0.5
required=1

[config.min_distance]
type=double
label=Minimum peak distance
default=8
required=1

[config.distance_mode]
type=choice
label=Distance units
default=x
values=x;samples
required=1

[config.relative_height]
type=double
label=Width relative height
default=0.5
required=1

[config.output_dataset_id]
type=string
label=Detected peaks Dataset ID
default=demo.numeric.peaks.detected
required=1

[documentation]
api_version=1
guide=MANUAL.md
api_refs=MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;DATASET_METADATA_API_v1;DATASET_SELECTION_API_v1;DATASET_VARIABLE_SCHEMA_API_v3;TABLE_STREAM_API_v3;DATASET_PUBLICATION_API_v2;NUMERIC_API_v1;PROGRESS_API_v1;GRAPH_PROVIDER_API_v1;PLOT_MODULE_API_v1;PLUGIN_INSTALL_API_v1;SESSION_GENERATOR_LIBRARY_API_v1;UNIT_REGISTRY_API_v1;DOCUMENTATION_API_v1
examples=session_generators/gxtxt_numerical_examples_peak_detection_1.0.0.zip
changelog=CHANGELOG.md
