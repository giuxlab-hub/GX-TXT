[meta]
api_version=1
id=viewer.document_extractors
kind=viewer
group=Viewers
name=Document Extraction Viewers
version=1.0.2
selectable=0
default_enabled=1
core=1
runner=service
order=852
depends=
description=Dataset-native OCR and Table Extractor viewers. Both use CORE Dataset Preview API v1 and delegate recognition/reconstruction to public service APIs.
config_hint=Open OCR or Table Extractor from Viewers. Select a compatible canonical Dataset; the viewer does not open arbitrary files.

[inputs]
contracts=image.raster;document.pdf

[outputs]
datasets=document.text;table.generic;image.raster

[contracts]
provided=document.text

[contract.document.text]
description=UTF-8 plain-text document Dataset.

[viewers]
api_version=1
ids=generic_ocr;table_extractor

[viewer.generic_ocr]
name=Generic OCR
backend=document_ocr_tk
activation_api=DOCUMENT_EXTRACTORS_VIEWER_API_v1
capabilities=interactive;dataset_preview;image_dataset;pdf_dataset;normalized_roi;ocr;document_text_publication;roi_image_publication;zoomable_preview
short_title=Document OCR
semantic_group=images
group_title=Imaging & Documents
icon=icons/generic_ocr.png

[viewer.table_extractor]
name=Table Extractor
backend=document_table_tk
activation_api=DOCUMENT_EXTRACTORS_VIEWER_API_v1
capabilities=interactive;dataset_preview;image_dataset;pdf_dataset;normalized_roi;table_reconstruction;cell_editing;dataset_publication
short_title=Document Tables
semantic_group=images
group_title=Imaging & Documents
icon=icons/table_extractor.png

[public_apis]
ids=DOCUMENT_EXTRACTORS_VIEWER_API_v1

[public_api.DOCUMENT_EXTRACTORS_VIEWER_API_v1]
public_contract=schema gxtxt.public_api_documentation.v1 purpose {Module-qualified Viewer Provider callback for generic_ocr or table_extractor; current Session and CORE extraction capabilities required. scene/open_context is ignored; activation returns status, not extraction data.} context {Inert provider-owned trusted-host documentation only. No provider activation, scientific work, Script/SDK authorization or generic invocation is granted.} operations {ocrDispatch {command ::GX::DocumentExtractors::ocrDispatch arguments {action scene} parameters {action {type {Viewer lifecycle action string} description {Actual backend operation; open/rerender support or ignored action semantics are explicitly stated by this operation.}} scene {type {resolved Viewer scene dictionary} description {Host-supplied Viewer scene; only documented open_context fields are consumed, or explicitly ignored by this backend.}}} result {type {status dictionary} description {status opened or focused, neither Tk path nor extraction result.}} context {Viewer Provider callback. Module-qualified Viewer Provider callback for generic_ocr or table_extractor; current Session and CORE extraction capabilities required. scene/open_context is ignored; activation returns status, not extraction data.}} tableDispatch {command ::GX::DocumentExtractors::tableDispatch arguments {action scene} parameters {action {type {Viewer lifecycle action string} description {Actual backend operation; open/rerender support or ignored action semantics are explicitly stated by this operation.}} scene {type {resolved Viewer scene dictionary} description {Host-supplied Viewer scene; only documented open_context fields are consumed, or explicitly ignored by this backend.}}} result {type {status dictionary} description {status opened or focused, neither Tk path nor extraction result.}} context {Viewer Provider callback. Module-qualified Viewer Provider callback for generic_ocr or table_extractor; current Session and CORE extraction capabilities required. scene/open_context is ignored; activation returns status, not extraction data.}}}
