[meta]
api_version=1
id=viewer.document_extractors
kind=viewer
group=Viewers
name=Document Extraction Viewers
version=1.0.2
selectable=0
default_enabled=1
core=1
runner=service
order=852
depends=
description=Dataset-native OCR and Table Extractor viewers. Both use CORE Dataset Preview API v1 and delegate recognition/reconstruction to public service APIs.
config_hint=Open OCR or Table Extractor from Viewers. Select a compatible canonical Dataset; the viewer does not open arbitrary files.

[inputs]
contracts=image.raster;document.pdf

[outputs]
datasets=document.text;table.generic;image.raster

[contracts]
provided=document.text

[contract.document.text]
description=UTF-8 plain-text document Dataset.

[viewers]
api_version=1
ids=generic_ocr;table_extractor

[viewer.generic_ocr]
name=Generic OCR
backend=document_ocr_tk
activation_api=DOCUMENT_EXTRACTORS_VIEWER_API_v1
capabilities=interactive;dataset_preview;image_dataset;pdf_dataset;normalized_roi;ocr;document_text_publication;roi_image_publication;zoomable_preview
short_title=Document OCR
semantic_group=images
group_title=Imaging & Documents
icon=icons/generic_ocr.png

[viewer.table_extractor]
name=Table Extractor
backend=document_table_tk
activation_api=DOCUMENT_EXTRACTORS_VIEWER_API_v1
capabilities=interactive;dataset_preview;image_dataset;pdf_dataset;normalized_roi;table_reconstruction;cell_editing;dataset_publication
short_title=Document Tables
semantic_group=images
group_title=Imaging & Documents
icon=icons/table_extractor.png

[public_apis]
ids=DOCUMENT_EXTRACTORS_VIEWER_API_v1

[public_api.DOCUMENT_EXTRACTORS_VIEWER_API_v1]
api_version=1
name=Document Extraction Viewer backends
entrypoint=api/document_extractors_viewer_api_v1.tcl
namespace=::GX::DocumentExtractors
capabilities=viewer_backends;dataset_preview_api_v1;ocr_layout_api_v1;table_extractor_api_v1;dataset_publication

[documentation]
api_version=1
guide=README.md
changelog=CHANGELOG.md
api_refs=VIEWER_PROVIDER_API_v1;DATASET_PREVIEW_API_v1;PREVIEW_DESCRIPTOR_API_v1;OCR_LAYOUT_API_v1;TABLE_EXTRACTOR_API_v1;DATASET_PUBLICATION_API_v2;DATASET_FILE_PUBLICATION_API_v1;DATASET_METADATA_API_v1;PLUGIN_INSTALL_API_v1
