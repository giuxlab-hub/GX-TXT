variable_mapping=none
capabilities=batch;dataset_preview
formats=geometry.sketch
[acquisition_format.geometry.sketch]
description=GX-TXT exact geometric Sketch v1
mime=application/vnd.gxtxt.sketch
extensions=*.gxsketch
canonical_formats=gxsketch
[documentation]
api_version=1
guide=MANUAL.md
api_refs=SKETCH_DATASET_API_v1
