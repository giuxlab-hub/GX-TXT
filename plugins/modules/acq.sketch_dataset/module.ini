[meta]
api_version=1
id=acq.sketch_dataset
kind=acquisition
group=Acquisition / Geometry
name=Sketch Dataset Import
version=1.0.0
selectable=0
default_enabled=1
core=1
runner=standard_tcl
order=156
description=Import portable exact retained Sketch geometry without scientific source dependencies.
[inputs]
contracts=raw.sketch
[outputs]
datasets=geometry.sketch
files=datasets/*;metadata/datasets.ini;metadata/datasets/*
[contracts]
provided=geometry.sketch
