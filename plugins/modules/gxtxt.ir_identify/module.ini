[meta]
api_version=1
id=gxtxt.ir_identify
kind=analysis
group=GX-TXT / Remote Control Tester
name=IR protocol identification
version=2.0.2
selectable=1
default_enabled=0
enabled_key=
run_key=
runner=standard_octave
order=110
depends=gxtxt.ir_waveform;math.numeric
description=Identifies IR protocol candidates from the measured MARK/SPACE artifact generated by gxtxt.ir_waveform, ranks candidates, decodes supported payloads and publishes timing/frame diagnostic Datasets with public Plot.dataset graphs.
config_hint=Run gxtxt.ir_waveform first for the same dataset and primary signal. This module consumes its ir_analysis_manifest.ini and eventi_mark_space.csv outputs.

[inputs]
contracts=timeseries.table
default_dataset=

[outputs]
files=protocol_identification.txt;protocol_candidates.csv;protocol_timing.csv;protocol_frame.csv;render_cache.mat

[graphs]
provider_api_version=1
ids=irid.ranking;irid.timing;irid.clusters;irid.frame
default_ids=irid.ranking;irid.timing;irid.clusters;irid.frame
rerender=standard_octave

[graph.irid.ranking]
name=Protocol candidate ranking
default_enabled=1
file=01_protocol_ranking.png
supports_legend=0
supports_annotations=1
annotation_editor=standard
annotation_types=text;line;arrow;rectangle;ellipse
annotation_coordinate_spaces=figure_norm
config_fields=title
[graph.irid.ranking.config.title]
type=string
label=Plot title
default=IR protocol candidate ranking

[graph.irid.timing]
name=Measured vs expected protocol timing
default_enabled=1
file=02_protocol_timing.png
supports_legend=1
legend_editor=standard
legend_placements=inside;above;below;left;right;manual
legend_layouts=row;stacked;wrapped
supports_annotations=1
annotation_editor=standard
annotation_types=text;line;arrow;rectangle;ellipse
annotation_coordinate_spaces=figure_norm
config_fields=title
[graph.irid.timing.config.title]
type=string
label=Plot title
default=Measured vs expected protocol timing

[graph.irid.clusters]
name=MARK / SPACE timing fingerprint
default_enabled=1
file=03_protocol_timing_fingerprint.png
supports_legend=1
legend_editor=standard
legend_placements=inside;above;below;left;right;manual
legend_layouts=row;stacked;wrapped
supports_annotations=1
annotation_editor=standard
annotation_types=text;line;arrow;rectangle;ellipse
annotation_coordinate_spaces=figure_norm
config_fields=title
[graph.irid.clusters.config.title]
type=string
label=Plot title
default=MARK / SPACE timing fingerprint

[graph.irid.frame]
name=Decoded frame timeline
default_enabled=1
file=04_protocol_frame.png
supports_legend=0
supports_annotations=1
annotation_editor=standard
annotation_types=text;line;arrow;rectangle;ellipse
annotation_coordinate_spaces=figure_norm
config_fields=title
[graph.irid.frame.config.title]
type=string
label=Plot title
default=Decoded frame timeline

[runner]
script=plugins/modules/gxtxt.ir_identify/runtime/gxtxt_ir_identify.m
rerender_script=plugins/modules/gxtxt.ir_identify/runtime/gxtxt_ir_identify_rerender.m

[config]
fields=dataset_id;accept_score_threshold;minimum_score_margin

[config.dataset_id]
type=dataset
label=Input time-series dataset
required=1
contract=timeseries.table

[config.accept_score_threshold]
type=double
label=Maximum accepted protocol score
required=1
default=0.28

[config.minimum_score_margin]
type=double
label=Minimum score margin over runner-up
required=1
default=0.03

[bindings]
roles=signal

[binding.signal]
label=IR waveform signal used by gxtxt.ir_waveform
required=1
semantic_role=signal

[documentation]
api_version=1
guide=README.md
api_refs=MODULE_API_v1;GRAPH_PROVIDER_API_v1;PLOT_MODULE_API_v1;NUMERIC_API_v1;PLOT_DATASET_API_v2
examples=
changelog=CHANGELOG.md
