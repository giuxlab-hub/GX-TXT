backend=curve_trace_assistant_native
activation_api=CURVE_TRACE_ASSISTANT_API_v1
capabilities=interactive;native_c;source_build;precompiled_binary;image_dataset;curve_digitizer_configuration;seed_guided_trace;local_grayscale_trace;local_color_trace;local_contrast_trace;continuity_tracking;crossing_ambiguity_stop;bounded_noise_gap;responsive_zoom_pan;viewport_rendering;image_pyramid;worker_thread;cancellation;proposal_overlay

[public_apis]
ids=CURVE_TRACE_ASSISTANT_API_v1

