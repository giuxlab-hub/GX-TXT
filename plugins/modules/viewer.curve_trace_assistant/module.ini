[meta]
api_version=1
id=viewer.curve_trace_assistant
kind=viewer
group=Viewers
name=Curve Trace Assistant
version=0.5.0
selectable=0
default_enabled=1
core=1
runner=service
order=845
depends=viewer.curve_digitizer
description=Native C seed-guided local curve tracing with responsive viewport rendering and background computation against authoritative Curve Digitalizer configurations.
config_hint=Open from Viewers, select a calibrated Curve Digitalizer configuration and curve, place one or two seeds, then trace. Source packages build the native backend on first launch when a compiler is available.

[inputs]
contracts=image.raster

[outputs]
datasets=

