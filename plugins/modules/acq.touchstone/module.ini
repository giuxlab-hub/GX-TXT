; GX-TXT Touchstone acquisition plugin
[meta]
api_version=1
id=acq.touchstone
kind=acquisition
group=Instruments / RF
name=Touchstone network import
version=1.0.0
core=0
selectable=1
default_enabled=1
runner=standard_tcl
order=125
description=Import measured Touchstone S-parameter files into canonical frequency-sweep Datasets.
config_hint=Choose a .sNp file, inspect frequency and network variables, then import.

[inputs]
contracts=raw.touchstone

[outputs]
datasets=spectrum.table
files=raw/*;datasets/*.csv;metadata/datasets.ini

[config]
fields=dataset_id

[config.dataset_id]
type=string
label=Dataset ID
default=touchstone.network
required=1

[runner]
handler=touchstone

[acquisition_handler]
api_version=1
script=runtime/acquisition_handler.tcl
inspect_proc=::GX::Touchstone::inspect
import_proc=::GX::Touchstone::import
file_label=Touchstone S-parameter files
file_patterns=*.s1p;*.s2p;*.s3p;*.s4p;*.s5p;*.s6p;*.s7p;*.s8p;*.s9p
supports_batch=1

[documentation]
api_version=1
guide=README.md
api_refs=ACQUISITION_HANDLER_PLUGIN_API_v1;RF_NETWORK_API_v1;SCIENTIFIC_FIELD_AND_SWEEP_DATASET_CONTRACT_v1
