[meta]
api_version=1
id=analysis.envelope_spectrum
kind=analysis
group=Generic analysis / Spectral
name=Envelope Spectrum & Demodulation Analysis
version=1.1.0
selectable=1
default_enabled=0
core=1
runner=standard_octave
order=340
depends=math.numeric
description=Dataset-native analytic-signal envelope demodulation and envelope-spectrum analysis for amplitude-modulated, impulsive and vibration signals. Generic transforms, analytic-signal construction, detrending, windows, grid checks and descriptive reductions are obtained from the public NUMERIC_API_v1 service.
config_hint=QUICK GUIDE: bind Time and one Signal. Optionally select an X/time interval. For broadband vibration data, choose Bandpass and enter a demodulation band around the resonance/carrier of interest. The module computes and publishes both the time-domain envelope and its normalized one-sided spectrum, then creates persistent plot.dataset graphs. See MANUAL.md.

[inputs]
contracts=timeseries.table;table.generic

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=timeseries.table;table.generic

[bindings]
roles=time;signal

[binding.time]
label=Time / temporal variable
required=1
semantic_role=independent

[binding.signal]
label=Signal
required=1
semantic_role=measured

[outputs]
files=envelope_spectrum_report.txt;automatic_graphs.ini
datasets=spectrum.table;timeseries.table

[config]
fields=selection;input_detrend;demodulation_filter;band_low_hz;band_high_hz;envelope_dc;window;nfft_mode;nfft

[config.selection]
type=selection
label=Data selection (optional time interval)
required=0
source_role=primary
selection_types=x_range

[config.input_detrend]
type=choice
label=Input detrend / DC handling
default=mean
values=none;mean;linear
required=1

[config.demodulation_filter]
type=choice
label=Pre-demodulation isolation
default=none
values=none;ideal_fft_bandpass
required=1

[config.band_low_hz]
type=string
label=Bandpass lower frequency [Hz]
default=1500
required=1

[config.band_high_hz]
type=string
label=Bandpass upper frequency [Hz]
default=2600
required=1

[config.envelope_dc]
type=choice
label=Envelope DC handling
default=remove_mean
values=keep;remove_mean
required=1

[config.window]
type=choice
label=Envelope-spectrum FFT window
default=hann
values=rectangular;hann;hamming;blackman;blackman_harris;flat_top
required=1

[config.nfft_mode]
type=choice
label=NFFT mode
default=auto
values=auto;explicit
required=1

[config.nfft]
type=integer
label=Explicit NFFT (must be >= selected sample count)
default=65536
required=1

[automatic_graphs]
provider=plot.dataset
api=PLOT_DATASET_API_v2
persistent_variants=1

[runner]
script=plugins/modules/analysis.envelope_spectrum/runtime/analysis_envelope_spectrum.m

[documentation]
api_version=1
guide=MANUAL.md
api_refs=MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;ANALYSIS_SOURCE_METADATA_RUNTIME_v1;CANONICAL_DATASET_API_v2;TABLE_STREAM_API_v3;DATASET_VARIABLE_SCHEMA_API_v3;DATASET_SELECTION_API_v1;DATASET_PUBLICATION_API_v2;DATASET_PUBLICATION_V2_OCTAVE_BINDING;GRAPH_PROVIDER_API_v1;PLOT_DATASET_API_v2;NUMERIC_API_v1;PLUGIN_INSTALL_API_v1;PROGRESS_API_v1
author=GX-TXT
changelog=CHANGELOG.md
