[meta]
api_version=1
id=acq.tektronix_current_log
kind=acquisition
group=Instruments / Tektronix
name=Tektronix current log import
version=2
core=1
selectable=1
default_enabled=0
enabled_key=
run_key=
runner=standard_tcl
order=120
depends=
description=Imports Tektronix current-log exports as canonical time-series datasets. One source file becomes one dataset; batch and incremental multi-source lifecycle are owned by GX-TXT v0.8.9.
config_hint=Use the batch table to add any number of source files. Each file keeps its own Dataset ID, Preview and Variables mapping. Measurement campaign and series IDs are provenance tags only; joining remains a separate analysis step.

[inputs]
contracts=raw.tektronix_current_log

[outputs]
datasets=timeseries.table
files=raw/*;datasets/*.csv;metadata/datasets.ini

[graphs]
ids=

[config]
fields=dataset_id;campaign_id;series_id;source_timezone;measurement_marker

[config.dataset_id]
type=string
label=Default Dataset ID
default=tektronix.current
required=1

[config.campaign_id]
type=string
label=Measurement campaign ID
default=
required=1

[config.series_id]
type=string
label=Series ID
default=reactor_current
required=1

[config.source_timezone]
type=string
label=Source time zone
default=Europe/Rome
required=1

[config.measurement_marker]
type=string
label=Measurement marker
default=Adc
required=1

[runner]
handler=tektronix_current_log

[acquisition_handler]
api_version=1
script=runtime/acquisition_handler.tcl
inspect_proc=::TektronixCurrentLog::inspect
import_proc=::TektronixCurrentLog::import
file_label=Tektronix current log files
file_patterns=*.csv;*.txt;*.dat
supports_batch=1

[documentation]
api_version=1
guide=README.md
api_refs=MODULE_API_v1;ACQUISITION_HANDLER_PLUGIN_API_v1;DATASET_API_v1;DATASET_INSPECTION_VARIABLE_MAPPING_API_v1
examples=
changelog=CHANGELOG.md
