[meta]
api_version=1
id=acq.molecule_structure
kind=acquisition
group=Acquisition / Chemistry
name=Molecular Structure Import
version=1.0.1
selectable=1
default_enabled=1
core=0
runner=standard_tcl
order=159
depends=
description=Imports source-preserved SDF/MOL, XYZ and PDB molecular coordinates as canonical molecular.structure Datasets.
config_hint=Choose a molecular structure file. The original bytes and source SHA-256 are preserved; VTP geometry is generated only for display.

[inputs]
contracts=raw.molecule

[outputs]
datasets=molecular.structure
files=datasets/*;metadata/datasets.ini;metadata/datasets/*

[contracts]
provided=molecular.structure

[contract.molecular.structure]
description=Opaque source-preserving molecular coordinate record with domain metadata. SDF bond orders and charges are retained; XYZ/PDB bonds may be inferred.

[config]
fields=dataset_id

[config.dataset_id]
type=string
label=Default Dataset ID
default=molecule.structure
required=1

[runner]
handler=molecule_structure

[acquisition_handler]
api_version=1
script=runtime/acquisition_handler.tcl
inspect_proc=::AcqMolecule::inspect
import_proc=::AcqMolecule::import
dataset_preview_proc=::AcqMolecule::datasetPreview
file_label=Molecular SDF/MOL, XYZ or PDB files
file_patterns=*.sdf;*.SDF;*.mol;*.MOL;*.xyz;*.XYZ;*.pdb;*.PDB;*.ent;*.ENT
supports_batch=1
source_kind=binary
variable_mapping=none
capabilities=batch;dataset_preview
formats=molecule.sdf;molecule.xyz;molecule.pdb

[acquisition_format.molecule.sdf]
description=MDL SDF/MOL V2000 with coordinates, bonds and bond order
mime=chemical/x-mdl-sdfile
extensions=*.sdf;*.mol
canonical_formats=sdf

[acquisition_format.molecule.xyz]
description=XYZ coordinates, including multiple frames
mime=chemical/x-xyz
extensions=*.xyz
canonical_formats=xyz

[acquisition_format.molecule.pdb]
description=PDB ATOM/HETATM coordinates and optional CONECT bonds
mime=chemical/x-pdb
extensions=*.pdb;*.ent
canonical_formats=pdb

[documentation]
api_version=1
guide=README.md
api_refs=ACQUISITION_HANDLER_PLUGIN_API_v1;SESSION_INSPECTION_API_v1;DATASET_METADATA_API_v1
