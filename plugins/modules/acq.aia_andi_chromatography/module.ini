; AIA/ANDI-CHROM NetCDF CDF acquisition plugin
[meta]
api_version=1
id=acq.aia_andi_chromatography
kind=acquisition
group=Instruments / Chromatography
name=AIA/ANDI chromatogram importer
version=1.0.2
selectable=1
default_enabled=0
core=0
runner=standard_tcl
order=136
depends=
description=Imports AIA/ANDI-CHROM standard NetCDF CDF chromatograms independently of the instrument vendor; optionally publishes original peak integration results. Uses standard Python only and public GX-TXT Acquisition APIs.
config_hint=Select standard AIA/ANDI chromatography .cdf files. Source NetCDF CDF-1/CDF-2 is recognized by magic signature. Select output profile; original RAW and provenance are preserved by GX-TXT in every profile. ANDI-MS and NetCDF-4/HDF5 require different decoders.

[inputs]
contracts=raw.aia.andi.chrom

[outputs]
datasets=timeseries.table;chromatography.aia.peaks;chromatography.aia.raw
files=datasets/*;metadata/datasets.ini;metadata/datasets/*

[contracts]
provided=chromatography.aia.peaks;chromatography.aia.raw

[contract.chromatography.aia.peaks]
parents=table.generic
description=Original AIA/ANDI chromatography integrated peak results, preserved without recalculation.

[contract.chromatography.aia.raw]
description=Byte-for-byte preserved original AIA/ANDI chromatographic NetCDF container.

[config]
fields=dataset_id;output_profile

[config.dataset_id]
type=string
label=Dataset ID
default=aia.chromatogram
required=1

[config.output_profile]
type=choice
label=Import output profile
default=trace_and_peaks
values=trace_and_peaks;trace_only;complete
required=1

[runner]
handler=aia_andi_chromatography

[acquisition_handler]
api_version=1
script=runtime/acquisition_handler.tcl
inspect_proc=::AcqAiaAndi::inspect
import_proc=::AcqAiaAndi::import
dataset_preview_proc=::AcqAiaAndi::datasetPreview
file_label=AIA/ANDI chromatography NetCDF CDF
file_patterns=*.cdf;*.CDF;*.nc;*.NC
supports_batch=1
source_kind=binary
variable_mapping=none
capabilities=batch;dataset_preview
formats=aia.andi.chrom

[acquisition_format.aia.andi.chrom]
description=Standard AIA/ANDI chromatography NetCDF classic export
mime=application/x-netcdf
extensions=*.cdf;*.CDF;*.nc;*.NC
canonical_formats=aia.andi.chrom

[documentation]
api_version=1
guide=README.md
changelog=CHANGELOG.md
api_refs=MODULE_API_v1;ACQUISITION_HANDLER_PLUGIN_API_v1;DATASET_VARIABLE_SCHEMA_API_v3;DATASET_METADATA_API_v1;BINARY_DATASET_FOUNDATION_v1;CONTRACT_REGISTRY_API_v1;PLUGIN_INSTALL_API_v1
