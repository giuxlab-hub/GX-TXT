; GX-TXT controlled Dataset Expression analysis.
; SPDX-License-Identifier: GPL-3.0-or-later
[meta]
api_version=1
id=analysis.dataset_expression
kind=analysis
group=Scientific Analysis
name=Dataset Expression
version=1.0.1
selectable=1
default_enabled=0
core=0
runner=standard_octave
order=420
depends=math.numeric
summary=Calculate a unit-aware expression from Dataset series and controlled scalar bindings.
description=Uses the shared expression grammar, Unit Registry and public NUMERIC_API catalog; publishes scalar or source-row-aligned results.
config_hint=Bind symbols to stable Dataset variables or scalar sources, enter an expression, and use Operations to browse supported functions.
[inputs]
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table
[analysis_sources]
api_version=1
ids=primary
dynamic=0
[analysis_source.primary]
required=1
contracts=table.generic;timeseries.table;curve_family.table;spectrum.table
[outputs]
files=expression_report.txt;expression_summary.ini;expression_definition.ini;automatic_graphs.ini
datasets=table.generic
[config]
fields=definition_file;expression;operation_browser;bindings;selection;output_dataset_id;output_variable_id;output_unit
[config.definition_file]
type=string
label=Saved definition file (optional, Session-relative or absolute)
default=
[config.expression]
type=string
label=Expression
required=1
[config.operation_browser]
type=numeric_operation_browser
label=Supported operations
required=0
[config.bindings]
type=table
dynamic=1
label=Symbol bindings
min_rows=1
columns=symbol;kind;variable;literal;metadata_key;source_row;aggregate;unit
[config.bindings.symbol]
type=string
label=Symbol
required=1
[config.bindings.kind]
type=choice
label=Source
default=series
values=series;literal;metadata;row;selection
required=1
[config.bindings.variable]
type=variable
label=Variable
source=primary
[config.bindings.literal]
type=string
label=Scalar
[config.bindings.metadata_key]
type=string
label=Metadata key
[config.bindings.source_row]
type=integer
label=Source row (one-based)
[config.bindings.aggregate]
type=choice
label=Selection aggregate
default=mean
values=mean;median;minimum;maximum;sum
[config.bindings.unit]
type=string
label=Scalar unit / missing variable unit
default=
[config.selection]
type=selection
label=Data selection (optional X interval)
source_role=primary
selection_types=x_range;rectangle
required=0
[config.output_dataset_id]
type=string
label=Output Dataset ID
default=analysis.expression.result
required=1
[config.output_variable_id]
type=string
label=Output variable ID
default=result
required=1
[config.output_unit]
type=string
label=Output unit (blank uses canonical dimensions)
default=
[runner]
script=plugins/modules/analysis.dataset_expression/runtime/analysis_dataset_expression.m
[documentation]
api_version=1
guide=MANUAL.md
api_refs=MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;ANALYSIS_SOURCE_ACCESS_RUNTIME_v2;DATASET_SELECTION_API_v1;TABLE_STREAM_API_v3;DATASET_PUBLICATION_API_v2;NUMERIC_API_v1;UNIT_REGISTRY_API_v1
changelog=CHANGELOG.md
