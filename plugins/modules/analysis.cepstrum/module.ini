[meta]
api_version=1
id=analysis.cepstrum
kind=analysis
group=Generic analysis / Spectral
name=Cepstrum Analysis
version=1.1.1
selectable=1
default_enabled=0
core=1
runner=standard_octave
order=350
depends=math.numeric
description=Dataset-native real-cepstrum analysis for uniformly sampled time series. Publishes quefrency-domain data and estimates a dominant periodicity/fundamental over a user-defined search range.
config_hint=Bind a time-like independent variable and one measured signal. Choose detrending, a window, a logarithmic magnitude floor, and a frequency search interval. The module computes the real cepstrum from the selected signal and reports the dominant positive-quefrency peak. See MANUAL.md.

[inputs]
contracts=timeseries.table

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=timeseries.table

[bindings]
roles=independent;signal

[binding.independent]
label=Independent time coordinate
required=1
semantic_role=independent

[binding.signal]
label=Signal variable / channel
required=1
semantic_role=measured

[outputs]
files=cepstrum_metrics.ini;cepstrum_report.txt;automatic_graphs.ini
datasets=table.generic

[config]
fields=window;detrend;log_floor_db;min_frequency_hz;max_frequency_hz;output_dataset_id

[config.window]
type=choice
label=Analysis window
default=rectangular
values=rectangular;hann;hamming;blackman_harris;flat_top
required=1

[config.detrend]
type=choice
label=Pre-transform detrend
default=mean
values=none;mean;linear
required=1

[config.log_floor_db]
type=string
label=Log-magnitude floor relative to peak [dB]
default=-240
required=1

[config.min_frequency_hz]
type=string
label=Minimum fundamental search frequency [Hz]
default=20
required=1

[config.max_frequency_hz]
type=string
label=Maximum fundamental search frequency [Hz]
default=2000
required=1

[config.output_dataset_id]
type=string
label=Cepstrum result Dataset ID
default=cepstrum.result
required=1

[runner]
script=plugins/modules/analysis.cepstrum/runtime/analysis_cepstrum.m

[documentation]
api_version=1
guide=MANUAL.md
api_refs=MODULE_API_v1;ANALYSIS_SOURCE_MAP_API_v1;DATASET_VARIABLE_SCHEMA_API_v3;TABLE_STREAM_API_v3;DATASET_PUBLICATION_API_v2;PROGRESS_API_v1;GRAPH_PROVIDER_API_v1;PLOT_DATASET_API_v2;NUMERIC_API_v1;PLUGIN_INSTALL_API_v1;SESSION_GENERATOR_LIBRARY_API_v1;UNIT_REGISTRY_API_v1;DOCUMENTATION_API_v1
examples=session_generators/gxtxt_numerical_examples_cepstrum_1.0.0.zip
changelog=CHANGELOG.md
