[meta]
api_version=1
id=analysis.welch_spectrum
kind=analysis
group=Generic analysis / Spectral
name=Welch PSD & Averaged Spectrum
version=1.1.0
selectable=1
default_enabled=0
core=1
runner=standard_octave
order=320
depends=math.numeric
description=Dataset-native Welch-style averaged spectral analysis using an existing Temporal Window Set. Publishes PSD, ASD and mean amplitude on one common frequency axis and supports cache-only graph variants.
config_hint=QUICK GUIDE: bind Time and one Signal from the same Dataset, then select an existing Temporal Window Set. The Temporal Set defines segment length, step/overlap, parent Selection and partial-window policy. Recommended student example: 2048 samples, step 1024, Drop = 50% overlap. Hann + mean detrend + NFFT auto is a good default. The calculation averages one-sided periodograms; graph variants can switch PSD dB / PSD linear / ASD / mean amplitude without recalculating. See MANUAL.md.

[inputs]
contracts=timeseries.table;table.generic

[analysis_sources]
api_version=1
ids=primary
dynamic=0

[analysis_source.primary]
required=1
contracts=timeseries.table;table.generic

[bindings]
roles=time;signal

[binding.time]
label=Time / temporal variable
required=1
semantic_role=independent

[binding.signal]
label=Signal
required=1
semantic_role=measured

[outputs]
files=welch_spectrum_report.txt;render_cache.mat
datasets=spectrum.table

[render_cache]
api_version=1
rerender_from_cache=1

[config]
fields=run_mode;temporal_set;window;detrend;nfft_mode;nfft;workers

[config.run_mode]
type=choice
label=Run mode
default=auto
values=auto;recalculate;render_only
required=1

[config.temporal_set]
type=temporal_set
label=Temporal Window Set
required=1
source_role=primary
temporal_types=window_set

[config.window]
type=choice
label=FFT weighting window
default=hann
values=rectangular;hann;hamming;blackman;blackman_harris;flat_top
required=1

[config.detrend]
type=choice
label=Pre-FFT detrend / DC handling
default=mean
values=none;mean;linear
required=1

[config.nfft_mode]
type=choice
label=NFFT mode
default=auto
values=auto;explicit
required=1

[config.nfft]
type=integer
label=Explicit NFFT (used only when NFFT mode = explicit)
default=2048
required=1

[config.workers]
type=string
label=Parallel workers (auto, serial, or positive integer)
default=auto
required=1

[graphs]
provider_api_version=1
ids=analysis.welch_spectrum.spectrum
default_ids=analysis.welch_spectrum.spectrum
rerender=standard_octave

[graph.analysis.welch_spectrum.spectrum]
supports_variants=1
variant_data_model=module_cache
name=Welch spectrum
file=01_welch_spectrum.png
default_enabled=1
supports_legend=0
config_fields=title;x_label;y_label;quantity;x_scale;y_scale;extra_format

[graph.analysis.welch_spectrum.spectrum.config.title]
type=string
label=Plot title
default=Welch averaged spectrum

[graph.analysis.welch_spectrum.spectrum.config.x_label]
type=string
label=X-axis label (auto = Frequency + display unit)
default=auto

[graph.analysis.welch_spectrum.spectrum.config.y_label]
type=string
label=Y-axis label
default=auto

[graph.analysis.welch_spectrum.spectrum.config.quantity]
type=choice
label=Spectral quantity
default=psd_db
values=psd_db;psd_linear;asd;mean_amplitude

[graph.analysis.welch_spectrum.spectrum.config.x_scale]
type=choice
label=Frequency-axis scale
default=linear
values=linear;log

[graph.analysis.welch_spectrum.spectrum.config.y_scale]
type=choice
label=Y-axis scale
default=linear
values=linear;log

[graph.analysis.welch_spectrum.spectrum.config.extra_format]
type=choice
label=Additional output format
default=none
values=none;pdf;svg

[runner]
script=plugins/modules/analysis.welch_spectrum/runtime/analysis_welch_spectrum.m
rerender_script=plugins/modules/analysis.welch_spectrum/runtime/analysis_welch_spectrum_rerender.m

[documentation]
api_version=1
guide=MANUAL.md
manual=MANUAL.md
changelog=CHANGELOG.md
