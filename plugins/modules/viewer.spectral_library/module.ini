[meta]
api_version=1
id=viewer.spectral_library
kind=viewer
group=Viewers
name=Scientific Spectral Library Viewer
version=1.0.14
selectable=0
default_enabled=1
core=0
runner=service
order=850
depends=math.numeric
description=Interactive browsing, independent IR library installation, overlays, candidate ranking and versioned reference maintenance.
config_hint=Open from Viewers to browse or install IR reference libraries with or without a Session. Select a reference and use Update / remove to create a new user-owned version; the source remains intact.

[inputs]
contracts=spectrum.scientific;table.generic

[outputs]
datasets=

[viewers]
api_version=1
ids=spectral_library

[viewer.spectral_library]
name=Scientific Spectral Library Viewer
backend=spectral_library_tk
activation_api=SPECTRAL_LIBRARY_VIEWER_API_v1
capabilities=interactive;reference_library;search;metadata;multiple_spectra;overlay;top_bottom;stacked;difference;ratio;zoom;pan;cursor;session_spectrum;candidate_ranking;session_persistence;spectrum_import;public_source_install;scientific_library_install;versioned_reference_update;versioned_reference_remove

[public_apis]
ids=SPECTRAL_LIBRARY_VIEWER_API_v1

[public_api.SPECTRAL_LIBRARY_VIEWER_API_v1]
api_version=1
name=Scientific Spectral Library Viewer backend
entrypoint=api/spectral_library_viewer_api_v1.tcl
namespace=::GX::SpectralLibraryViewer
capabilities=viewer_backend;reference_library;session_spectrum;candidate_ranking;comparison;session_state;scientific_library_install;versioned_reference_maintenance
documentation=SPECTRAL_LIBRARY_VIEWER_API_v1.md

[documentation]
api_version=1
guide=README.md
changelog=CHANGELOG.md
api_refs=VIEWER_PROVIDER_API_v1;SCIENTIFIC_SPECTRUM_API_v1;SCIENTIFIC_REFERENCE_LIBRARY_API_v1;SCIENTIFIC_LIBRARY_MANAGER_API_v1;INTERACTIVE_DOCUMENT_API_v1;DATASET_API_v1;NUMERIC_API_v1
