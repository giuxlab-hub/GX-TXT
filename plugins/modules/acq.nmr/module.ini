; GX-TXT NMR JCAMP-DX acquisition
; SPDX-License-Identifier: GPL-3.0-or-later
[meta]
api_version=1
id=acq.nmr
kind=acquisition
group=Instruments / Spectroscopy
name=NMR JCAMP-DX import
version=1.0.0
core=0
selectable=1
default_enabled=1
runner=standard_tcl
order=72
description=Import measured one-dimensional 1H/13C JCAMP-DX NTUPLES spectra or raw FIDs into canonical chemical-shift Datasets.
config_hint=Choose a JCAMP-DX NMR file. FID processing uses explicit apodization, zero fill and phase settings; inspect the source metadata and verify peak positions.

[inputs]
contracts=raw.nmr

[outputs]
datasets=spectrum.scientific
files=raw/*;datasets/*.csv;metadata/datasets.ini

[config]
fields=dataset_id;zero_fill_factor;line_broadening_hz;phase_deg

[config.dataset_id]
type=string
label=Dataset ID
default=nmr.spectrum
required=1

[config.zero_fill_factor]
type=integer
label=FID zero-fill factor
default=4
required=1

[config.line_broadening_hz]
type=number
label=FID exponential line broadening [Hz]
default=2.0
required=1

[config.phase_deg]
type=number
label=FID zero-order phase [degrees]
default=0
required=1

[acquisition_handler]
api_version=1
script=runtime/acquisition_handler.tcl
inspect_proc=::GX::NmrAcq::inspect
import_proc=::GX::NmrAcq::import
file_label=NMR JCAMP-DX spectra and FIDs
file_patterns=*.dx;*.jdx;*.jcamp
supports_batch=1

[runner]
handler=nmr

[documentation]
api_version=1
guide=README.md
api_refs=ACQUISITION_HANDLER_PLUGIN_API_v1;SCIENTIFIC_SPECTRUM_API_v1;CANONICAL_DATASET_API_v2
