; Metrohm IC Net .CHW binary acquisition and decoded chromatogram, native C candidate 0.3.0
; SPDX-License-Identifier: GPL-3.0-or-later
[meta]
api_version=1
id=acq.metrohm_icnet_chw
kind=acquisition
group=Instruments / Metrohm
name=Metrohm IC Net chromatogram importer
version=0.3.0
selectable=1
default_enabled=0
core=0
runner=standard_tcl
order=135
depends=
description=Imports native Metrohm IC Net CHW binary chromatograms, preserving the original container and reconstructing the full signal with an exact integer differential decoder. Publishes a separate peak table where available.
config_hint=Choose a Metrohm IC Net .CHW file. This experimental decoder reconstructs the full chromatogram from native ADC differences, preserves the unchanged source and optionally publishes peak integration records. Native/source implementation parity covers seven supplied IC Net files; independent vendor scientific comparison and normal canonical/GUI acceptance are separate checks. Unsupported structural variants fail clearly.

[inputs]
contracts=raw.metrohm.icnet.chw

[outputs]
datasets=chromatography.icnet.raw;timeseries.table;chromatography.icnet.peaks
files=datasets/*;metadata/datasets.ini;metadata/datasets/*

[contracts]
provided=chromatography.icnet.raw;chromatography.icnet.peaks

[contract.chromatography.icnet.raw]
description=Original Metrohm IC Net CHW chromatogram container preserved byte-for-byte, alongside a separate canonical numeric Dataset.

[contract.chromatography.icnet.peaks]
parents=table.generic
description=Integrated CHW peak-point table, retention derived from source sample indices and the native interval; no peak reintegration or inferred component identity.

[config]
fields=dataset_id;output_profile

[config.output_profile]
type=choice
label=Import output profile
default=complete
values=complete;trace_and_peaks;trace_only
required=1

[config.dataset_id]
type=string
label=Dataset ID
default=metrohm.icnet
required=1

[runner]
handler=metrohm_icnet_chw

[acquisition_handler]
api_version=1
script=runtime/acquisition_handler.tcl
inspect_proc=::AcqMetrohmCHW::inspect
import_proc=::AcqMetrohmCHW::import
dataset_preview_proc=::AcqMetrohmCHW::datasetPreview
file_label=Metrohm IC Net chromatograms
file_patterns=*.chw;*.CHW
supports_batch=1
source_kind=binary
variable_mapping=none
capabilities=batch;dataset_preview
formats=metrohm.icnet.chw

[acquisition_format.metrohm.icnet.chw]
description=Metrohm IC Net binary chromatogram container
mime=application/octet-stream
extensions=*.chw;*.CHW
canonical_formats=metrohm.icnet.chw

[documentation]
api_version=1
guide=README.md
changelog=CHANGELOG.md
api_refs=MODULE_API_v1;ACQUISITION_HANDLER_PLUGIN_API_v1;DATASET_METADATA_API_v1;DATASET_VARIABLE_SCHEMA_API_v3;BINARY_DATASET_FOUNDATION_v1;CONTRACT_REGISTRY_API_v1;PLUGIN_INSTALL_API_v1
