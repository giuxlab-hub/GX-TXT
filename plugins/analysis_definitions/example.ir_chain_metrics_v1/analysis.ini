[meta]
api_version=1
id=example.ir_chain_metrics_v1
kind=tabular
name=IR analog-chain metrics API example
version=1
capabilities=expression;compare;normalize;plot;export
description=Reference definition used to validate Scientific Analysis Definition API v1 against gxtxt.ir_waveform analog_chain_comparison.csv. It is intentionally generic tabular data-flow, not IR-specific engine code.

[sources]
roles=primary

[source.primary]
type=table
required=1

[variables]
ids=trace;carrier_amplitude;threshold;margin

[variable.trace]
source=primary
column=trace
type=string
role=group

[variable.carrier_amplitude]
source=primary
column=carrier_amplitude_V
type=numeric
role=measure

[variable.threshold]
source=primary
column=threshold_V
type=numeric
role=measure

[variable.margin]
source=primary
column=median_margin_V
type=numeric
role=measure

[operations]
ids=relative_amplitude;margin_fraction;margin_normalized

[operation.relative_amplitude]
type=compare
value=carrier_amplitude
group=trace
reference=VIR
reference_aggregate=median
method=ratio
output=relative_amplitude_api

[operation.margin_fraction]
type=expression
expression=margin / carrier_amplitude
output=margin_fraction

[operation.margin_normalized]
type=normalize
value=margin
method=maxabs
output=margin_normalized

[exports]
ids=result;summary

[export.result]
type=csv
file=analysis_result.csv
columns=trace;carrier_amplitude;threshold;margin;relative_amplitude_api;margin_fraction;margin_normalized

[export.summary]
type=text_summary
file=analysis_summary.txt

[plots]
ids=analysis.demo.ir_chain

[plot.analysis.demo.ir_chain]
type=bar
file=01_analysis_definition_demo.png
x=trace
series=relative_amplitude_api;margin_fraction
series_labels=Relative carrier amplitude;Threshold margin / carrier amplitude
title=Scientific Analysis API example - IR analog chain
x_label=Analog-chain trace
y_label=Dimensionless ratio

[documentation]
api_version=1
guide=README.md
api_refs=SCIENTIFIC_ANALYSIS_DEFINITION_API_v1
examples=analysis.ini
changelog=
