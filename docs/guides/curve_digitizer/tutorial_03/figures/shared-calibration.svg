<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Shared calibration dependencies</title><desc id="desc">Per-point independent placement terms differ from common calibration effects.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#155b88"/></marker></defs><style>text{font:20px sans-serif;fill:#182c40}.small{font-size:16px}.head{font-size:26px;font-weight:700}.box{fill:#eef5fa;stroke:#155b88;stroke-width:2}.line{fill:none;stroke:#155b88;stroke-width:3;marker-end:url(#arrow)}</style><rect width="100%" height="100%" fill="white"/><text class="head" x="30" y="42">Shared calibration is not independent point noise</text><rect class="box" x="285" y="90" width="390" height="65"/><text x="310" y="132">One calibration / scale assumption</text><path class="line" d="M380 160 L190 245"/><path class="line" d="M480 160 V245"/><path class="line" d="M580 160 L770 245"/><text x="110" y="285">Point 1</text><text x="425" y="285">Point 2</text><text x="735" y="285">Point 3</text><text class="small" x="40" y="335">Each point also has its own declared placement model.</text><text class="small" x="40" y="375">A row’s X/Y covariance does not describe every cross-point shared dependency.</text></svg>
