<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Separate processing and curve output</title><desc id="desc">Original input can produce a processed image Dataset and separately calibrated curve results.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#155b88"/></marker></defs><style>text{font:20px sans-serif;fill:#182c40}.small{font-size:16px}.head{font-size:26px;font-weight:700}.box{fill:#eef5fa;stroke:#155b88;stroke-width:2}.line{fill:none;stroke:#155b88;stroke-width:3;marker-end:url(#arrow)}</style><rect width="100%" height="100%" fill="white"/><text class="head" x="30" y="42">Image publication and curve publication are separate</text><rect class="box" x="35" y="155" width="220" height="80"/><text x="55" y="202">Original source image</text><path class="line" d="M260 180 L385 110"/><path class="line" d="M260 215 L385 295"/><rect class="box" x="405" y="65" width="495" height="95"/><text x="425" y="105">Processing → new image.raster Dataset</text><text class="small" x="425" y="140">New hash + parent lineage + recipe; new configuration</text><rect class="box" x="405" y="250" width="495" height="95"/><text x="425" y="290">Calibration + points → curve Dataset</text><text class="small" x="425" y="325">Own publication review + scientific quantities/units</text><text class="small" x="35" y="395">Opacity, background and read-only overlays are display state, not scientific output.</text></svg>
