<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Scale-bar conventions</title><desc id="desc">Three-pixel terminal ticks have distinct inner edges centres and outer edges.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#155b88"/></marker></defs><style>text{font:20px sans-serif;fill:#182c40}.small{font-size:16px}.head{font-size:26px;font-weight:700}.box{fill:#eef5fa;stroke:#155b88;stroke-width:2}.line{fill:none;stroke:#155b88;stroke-width:3;marker-end:url(#arrow)}</style><rect width="100%" height="100%" fill="white"/><text class="head" x="30" y="42">State the endpoint convention</text><path d="M170 150 H740" stroke="black" stroke-width="9"/><path d="M170 105 V195 M740 105 V195" stroke="black" stroke-width="20"/><path d="M170 245 H740" stroke="#155b88" stroke-width="3"/><text x="300" y="235">Tick centres: declared 152 px</text><path d="M180 295 H730" stroke="#a7432b" stroke-width="3"/><text x="320" y="285">Inner edges: shorter</text><path d="M160 345 H750" stroke="#209268" stroke-width="3"/><text x="320" y="335">Outer edges: longer</text><text class="small" x="35" y="400">Illustrative geometry enlarged; use actual source-pixel endpoints and known bar convention.</text></svg>
