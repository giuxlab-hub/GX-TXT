<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">Four-point source-pixel reference</title><desc id="desc">Downward image Y. Four corners and insertion-order target points are shown, not measured.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#155b88"/></marker></defs><style>text{font:20px sans-serif;fill:#182c40}.small{font-size:16px}.head{font-size:26px;font-weight:700}.box{fill:#eef5fa;stroke:#155b88;stroke-width:2}.line{fill:none;stroke:#155b88;stroke-width:3;marker-end:url(#arrow)}</style><rect width="100%" height="100%" fill="white"/><text class="head" x="30" y="40">100 × 100 source pixels; image Y points downward</text><rect x="150" y="80" width="320" height="320" fill="#fafafa" stroke="#182c40"/><path d="M182 368 H438 V112 H182 Z" fill="none" stroke="#8795a1" stroke-width="2"/><g fill="#a32323"><circle cx="182" cy="368" r="5"/><circle cx="438" cy="368" r="5"/><circle cx="182" cy="112" r="5"/><circle cx="438" cy="112" r="5"/></g><g fill="#155b88"><circle cx="246" cy="304" r="6"/><circle cx="342" cy="208" r="6"/><circle cx="390" cy="288" r="6"/><circle cx="278" cy="160" r="6"/></g><text x="259" y="325">P1</text><text x="354" y="204">P2</text><text x="401" y="310">P3</text><text x="288" y="154">P4</text><text x="520" y="110">Corners: BL → BR → TL → TR</text><text x="520" y="155">P1 (30,70) → (2,−1)</text><text x="520" y="195">P2 (60,40) → (5,0.5)</text><text x="520" y="235">P3 (75,65) → (6.5,−0.75)</text><text x="520" y="275">P4 (40,25) → (3,1.25)</text><text x="520" y="330" class="small">X in seconds; Y in volts.</text><text x="520" y="365" class="small">Keep insertion order; X is non-monotonic.</text></svg>
