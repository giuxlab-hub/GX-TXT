<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Inspect proposal and soft exclusion</title><desc id="desc">Guides on the intended line are separate from a neighboring soft-exclusion corridor.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#155b88"/></marker></defs><style>text{font:20px sans-serif;fill:#182c40}.small{font-size:16px}.head{font-size:26px;font-weight:700}.box{fill:#eef5fa;stroke:#155b88;stroke-width:2}.line{fill:none;stroke:#155b88;stroke-width:3;marker-end:url(#arrow)}</style><rect width="100%" height="100%" fill="white"/><text class="head" x="30" y="42">Inspect the intended stroke before accepting</text><path d="M55 185 Q450 230 900 185" stroke="#a7432b" stroke-width="4" fill="none"/><path d="M55 270 Q450 315 900 270" stroke="#155b88" stroke-width="5" fill="none"/><path d="M55 185 Q450 230 900 185" stroke="#d49fc8" stroke-width="30" opacity=".4" fill="none"/><path d="M55 270 Q450 315 900 270" stroke="#209268" stroke-width="2" stroke-dasharray="9 7" fill="none"/><g fill="#182c40"><circle cx="55" cy="270" r="7"/><circle cx="475" cy="292" r="7"/><circle cx="900" cy="270" r="7"/></g><text x="40" y="105">Neighbour + soft exclusion corridor</text><text x="40" y="350">Guides + reviewed proposal on intended stroke</text><text x="40" y="392" class="small">Schematic separation is enlarged. Proposal appearance is not a measured tracing result.</text></svg>
