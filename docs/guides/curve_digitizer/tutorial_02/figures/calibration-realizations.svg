<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Three declared maps</title><desc id="desc">A source pixel position is shared by k0 k1 and k4 maps; output coordinates differ.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#155b88"/></marker></defs><style>text{font:20px sans-serif;fill:#182c40}.small{font-size:16px}.head{font-size:26px;font-weight:700}.box{fill:#eef5fa;stroke:#155b88;stroke-width:2}.line{fill:none;stroke:#155b88;stroke-width:3;marker-end:url(#arrow)}</style><rect width="100%" height="100%" fill="white"/><text class="head" x="30" y="42">One source position, three declared transforms</text><rect class="box" x="35" y="160" width="255" height="90"/><text x="55" y="198">Source (600,830)</text><text x="55" y="230" class="small">Ideal c5 midspan</text><path class="line" d="M295 200 L420 105"/><path class="line" d="M295 205 H420"/><path class="line" d="M295 210 L420 305"/><text x="450" y="100">k0 → X=5 s, Y=0.7 V</text><text x="450" y="205">k1 → X=5.015 s, Y=0.69465 V</text><text x="450" y="310">k4 → X=5.06 s, Y=0.6786 V</text><text x="35" y="380" class="small">These are deterministic alternatives, not independent repeated measurements or a probability model.</text></svg>
