    owned_state: Expiring operation previews, result receipts and transient previous optional-module states only
    persistence: None added; configuration, resource, diagnostic, portable and scientific owners retain their stores
    consumers: [Configuration Framework Maintenance child page, trusted local host automation]
    dependencies: [CONFIGURATION_API_v1, RESOURCE_MANAGEMENT_API_v1, STDERR_DIAGNOSTICS_API_v1, PROJECT_PORTABLE_API_v1, SESSION_PORTABLE_API_v1, API_CATALOG_SERVICE_API_v1, public module operational APIs]
    extension_points: [frameworkMaintenanceStatus, frameworkMaintenanceConfigurationPlan, frameworkMaintenanceConfigurationApply, frameworkMaintenanceModulesPlan, frameworkMaintenanceModulesApply, frameworkMaintenanceCachePreview, frameworkMaintenanceCacheCleanup, frameworkMaintenanceBackupPlan, frameworkMaintenanceBackupExport, frameworkMaintenanceBackupRestorePlan, frameworkMaintenanceBackupRestore]
    invariants:
    - Reusable operations reside in CORE; widgets never become persistence authorities
    - Preview and confirmation precede destructive desktop actions; stale plans refuse
    - Configuration scopes remain separate with secret redaction and expected-value/Session guards
    - Unchanged defaults require no new binding admission; reset previews guard captured inheritance targets
    - Native Workspace, original scientific data, source scripts and unknown paths are not cleanup targets
    - Optional module changes preserve mandatory authorities, required dependencies and active operations
    - One all-Projects archive delegates every nested scientific package to existing Portable owners
    - Project organization read barriers reject pending foreign transactions even before registry bytes change
    - Nested unassociated Sessions follow the explicit policy through Portable resource exclusions and at most one Session package
    - Complete aggregate validation precedes non-overwriting owner imports; partial imports retain exact committed mappings
    - Host-only administration adds no scientific Script or restricted SDK grant
    docs: [docs/api/FRAMEWORK_MAINTENANCE_API_v1.md, docs/api/CONFIGURATION_API_v1.md]
    tests: [validation/dev111_p026/maintenance_contracts.tcl, validation/dev111_p026/maintenance_gui.tcl]
