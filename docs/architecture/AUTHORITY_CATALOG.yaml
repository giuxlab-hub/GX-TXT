    - Metadata and documentation grant no scientific execution or provider activation
    - Bounded queries invoke no discovery or worker; consumers retain an immutable process snapshot
    - Reconciliation publishes a fully validated next-process stage; failure preserves the good snapshot
    - Explicit source verification is separate from ordinary status polling
    - Provider and surface totals use one bounded native summary transaction without declaration payload queries
    - Native package 1.1 retains schema3 and public facade API_v1 compatibility
    - Confined manual declarations, physical files, index and renderer evidence remain distinct
    - Presentation correlation requires owned window, source path/hash and generation; availability is not rendered pixel evidence
    - Compact and regular presentations retain the same query, filter, context, enabled-state and manual owners; only an explicitly empty title delegates its label to the container
    - Compact healthy current nonempty results release redundant status space; stale, unknown, pending, error and empty feedback remains visible
    - Actual tree and text fonts determine three list rows and four detail lines; compact sash and containing Development minimum preserve both panes and Diagnostics rows without reducing fonts
    - Browser and Development resize callbacks coalesce, use stable requested geometry and retire on disposal
    - Every API Browser attaches the existing UI Field inspection style while its tree is empty; actual font line spacing and shared padding determine row height without changing declared columns or deliberate horizontal pan
    docs: [docs/api/API_CATALOG_SERVICE_API_v1.md]
    tests: [validation/dev111_p026_api/run.py, validation/dev111_p026_api/manual_gui.tcl, validation/dev111_p026_api/summary_gold.py, validation/dev111_p026_api/summary_panel.py, validation/dev111_p027_cpp/browser_height_run.py, validation/dev111_p027_cpp/browser_height.tcl]
