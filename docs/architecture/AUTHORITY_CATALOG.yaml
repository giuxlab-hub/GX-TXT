    persistence: Existing private diagnostic JSONL rotation only; scientific Job logs and History remain with their owners
    consumers: [Managed producer attachments, Diagnostics readers, Configuration Framework Maintenance]
    dependencies: [Existing native producer protocol, UNIX writer/snapshot locks, bounded asynchronous native tasks]
    extension_points: [stderrDiagnostics read, stderrDiagnostics meta, stderrDiagnostics export, stderrDiagnostics cleanup_preview, stderrDiagnostics cleanup]
    invariants:
    - Cleanup admits only canonical validated diagnostic records under existing ownership and exclusive inactive-writer lock
    - Complete exact preimage set is validated before removal; changed/symlink/foreign/unrecognized records refuse
