    owner: core/tcl/script_execution_api_v1.tcl
    adapters: [core/tcl/script_project_v1.tcl, core/python/script_project.py, app/script_source_tabs.tcl, core/python/gxtxt_python_script_execution.py, core/python/gxtxt_python_debug.py, core/python/gxtxt_octave_debug.py]
    public_apis: [SCRIPT_EXECUTION_API_v1, SCRIPT_JOB_API_v1, SOURCE_SURFACE_API_v1]
    owned_state: Existing Registry Script identity with bounded Project manifest and immutable source revisions
    persistence: Existing user or Session Script Registry and frozen whole-project Job snapshots
    invariants:
    - Atomic Save All changes one Registry revision after validating every admitted source and SHA
    - One source/schema commit and metadata CAS prevent partial or stale updates
    - Each source tab retains its own buffer, undo, dirty state, path, revision and debug position
    - Python packages and Octave function folders resolve from the admitted Project root
    - Helper breakpoints and stack frames refer to exact frozen Job files; historical files remain read-only
    - Source parameter declarations are literal metadata and runtime-safe noops; the existing Runner owns effective typed per-invocation parameters
    docs: [docs/api/SCRIPT_PROJECTS_v1.md, docs/api/SCRIPT_PARAMETER_DECLARATIONS_v1.md]
    tests: [validation/dev111_p028_scripts/contracts.py, validation/dev111_p028_scripts/integration.tcl, validation/dev111_p028_scripts/gui_contracts.tcl]
