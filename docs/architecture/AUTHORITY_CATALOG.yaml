# Reviewed ownership only; broader catalog remains an unfinished historical task.
catalog_version: 1
scope: Reviewed current CORE and provider authorities for scientific execution, opaque I/O, native geometry
  and presentation, Dataset ownership, numerical services and shared GUI hosts.
authorities:
  dataset_groups_and_portable_collection:
    owner: core/tcl/dataset_group_api_v1.tcl
    adapters: [core/tcl/dataset_authority_v1.tcl, core/tcl/dataset_namespace_api_v1.tcl, core/tcl/dataset_catalog_v1.tcl, core/tcl/dataset_rename_api_v1.tcl, core/tcl/portable_resource_api_v1.tcl, core/python/portable_resource_v1.py, app/gui/dataset_browser.tcl]
    public_apis: [DATASET_GROUP_API_v1, PORTABLE_RESOURCE_API_v2]
    owned_state: Session-local logical aggregate of exact existing canonical Dataset identities, roles, primary, source pins, revision and bounded history
    persistence: Existing Dataset authority journal enlists one inert metadata/dataset_groups.tcldict descriptor; portable Group v2 includes normal validated member packages
    consumers: [Acquisition Handler declarative result, Dataset Browser, existing Namespace and Portable owners]
    dependencies: [CANONICAL_DATASET_API_v2, DATASET_METADATA_API_v1, DATASET_NAMESPACE_API_v1, ACQUISITION_HANDLER_PLUGIN_API_v1]
    invariants:
    - No new Dataset payload, Registry, writer or variable-level group identity
    - Actual returned members and Group commit or roll back within the same existing Acquisition transaction
    - Whole-group move validates revision and every member and emits one Catalog notification
    - Legacy single-member move refuses a split; explicit detach and ungroup preserve scientific bytes
    - Rename updates member and primary references; grouped deletion requires an explicit lifecycle decision
    - Portable preflight validates all member SHA/contracts/source/paths before import; remapping changes only admitted same-package identities
    - Individual v1 ZIP remains supported with detached original-group provenance
    - Last128 inert events and original creation time survive Group ZIP; no executable history replay
    docs: [docs/api/DATASET_GROUP_API_v1.md, docs/api/PORTABLE_RESOURCE_API_v2.md]
    tests: [validation/dev111_p028_main/groups.tcl, validation/dev111_p028_main/chromatography_groups.py]
  acquisition_prepared_numeric_publication:
    owner: core/tcl/acquisition_handler_api_v1.tcl
    adapters: [core/tcl/acquisition_publication_v1.tcl, core/tcl/dataset_publication_api_v2.tcl, plugins/modules/acq.rigol_csv/runtime/acquisition_handler.tcl]
    public_apis: [ACQUISITION_HANDLER_PLUGIN_API_v1, DATASET_PUBLICATION_API_v2]
    owned_state: Existing private Acquisition staging and admitted typed numeric producer resources
    persistence: Existing Publication HDF5 and Dataset Registry only; RAW and Group join the same journal
    invariants:
    - Worker numeric blocks are bounded float64 staging, never an alternate canonical file format
    - CORE Publication owns schema, storage, final SHA and registration
    - Source inspection, immutable RAW identity and destination Namespace stay within existing Acquisition authority
    - Native Rigol parsing follows measured hotspot evidence; retained Octave and CSV compatibility preserve precision
    - Four full-resolution channels remain independent Datasets under one exact acquisition Group
    docs: [docs/api/ACQUISITION_HANDLER_PLUGIN_API_v1.md, plugins/modules/acq.rigol_csv/README.md]
    tests: [validation/dev111_p028_main/rigol_numeric.tcl, validation/dev111_p028_main/rigol_profile.tcl]
