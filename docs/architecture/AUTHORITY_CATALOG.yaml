    owner: core/tcl/python_environment_api_v1.tcl
    adapters: [core/tcl/python_environment_audit_v1.tcl, core/python/gxtxt_python_environment.py, app/gui/configuration_runtime.tcl, app/gui/python_import_audit.tcl]
    public_apis: [PYTHON_ENVIRONMENT_API_v1, CONFIGURATION_API_v1]
    owned_state: Bounded source/interpreter-bound diagnostic request and temporary Runtime projection
    persistence: No new environment database or settings store; explicit Job preflight report stays with its existing Job
    consumers: [Runtime in-page audit overlay, existing Scripts inventory and Manage imports, managed Python Project preflight]
    dependencies: [SCRIPT_JOB_API_v1, SCRIPT_EXECUTION_API_v1, UI_FIELD_API_v1, CONFIGURATION_API_v1]
    invariants:
    - Same AST analyze and nonexecuting static resolver; no target import, package installation or requirements write
    - Registered exact source manifests or controlled enabled installed roots only; host API adds no unrestricted Script directory grant
    - Source SHA, Registry revision, Session token and configured executable identity reject stale responses
    - Missing mandatory, present, optional, conditional, dynamic and invalid-source statuses remain distinct and qualified
    - Shared UI Field viewport owns scrolling and focus; existing field IDs, Detect/Test, drafts and Save authority remain unchanged
    - Overlay Refresh is explicit; Close and Escape cancel pending work and preserve drafts
    - Manage imports binds exact file and tab identity before applying one source edit
    docs: [docs/api/PYTHON_ENVIRONMENT_API_v1.md]
    tests: [validation/dev111_p028_main/python_audit.py, validation/dev111_p028_main/python_audit_host.tcl, validation/dev111_p028_main/runtime_gui.py]
