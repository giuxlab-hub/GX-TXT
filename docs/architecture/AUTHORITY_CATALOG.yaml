    owner: core/tcl/api_catalog_service_v1.tcl
    extensions: [core/api_catalog/api_catalog_tcl.cpp, core/python/gxtxt_api_catalog.py]
    presentation_owner: core/tcl/viewer_development_api_browser_v1.tcl
    presentation_state: Existing Browser compact chrome, measured minimum and ephemeral coalesced resize callbacks; no added persistence
    public_apis: [API_CATALOG_SERVICE_API_v1]
    owned_state: Immutable process definition snapshot, consumer tickets, bounded reconciliation progress/errors and derived manual/source diagnostics
    persistence: Packaged derived SQLite seed/manifest and framework-bound private next-process stages; no installed source writes
    consumers: [Three editor API Browsers, Viewer Builder api_catalog component, Configuration Framework Maintenance]
    dependencies: [Native C++ SQLite Catalog, current public descriptor owners, Plugin lifecycle notifications, managed Script Jobs, Documentation resolver/presentation, installed framework identity]
    extension_points: [apiCatalogRequest, apiCatalogQuery, apiCatalogGet, apiCatalogStatus, apiCatalogRefresh, apiCatalogCancel, apiCatalogInvalidate, apiCatalogProviderState, apiCatalogDiagnostics, apiCatalogManualInspect, apiCatalogManualOpen]
