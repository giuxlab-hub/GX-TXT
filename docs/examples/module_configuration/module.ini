[meta]
api_version=1
id=example.configuration
name=Generic Configuration Example
kind=analysis
group=Examples
version=1.0.0
selectable=1
default_enabled=0
core=0
runner=service
order=9999
description=Descriptor-only demonstration of shared central/local User defaults and Session overrides.
[config]
fields=level;mode;enabled;rows
[config.level]
type=integer
label=Display level
default=3
min=1
max=9
persistent_default=1
application=immediate
description=Persisted User default with explicit Session override and inheritance.
[config.mode]
type=choice
label=Processing mode
default=normal
values=normal;precise
persistent_default=1
application=next_invocation
[config.enabled]
type=boolean
label=Session annotation enabled
default=1
application=immediate
[documentation]
api_version=1
guide=README.md

[config.rows]
type=table
label=Session coefficients
min_rows=0
max_rows=4
columns=name;coefficient;enabled
application=next_invocation
[config.rows.name]
type=string
label=Name
default=sample
required=1
[config.rows.coefficient]
type=number
label=Coefficient
default=1
min=0
max=10
[config.rows.enabled]
type=boolean
label=Enabled
default=1
